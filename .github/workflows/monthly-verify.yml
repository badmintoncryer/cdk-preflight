name: monthly-verify
on:
  schedule:
    - cron: 0 18 1 * *
  workflow_dispatch:
    inputs:
      service:
        description: verify a single service (empty = all)
        required: false
        type: string
        default: ""
concurrency:
  group: monthly-verify
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      services: ${{ steps.plan.outputs.services }}
    steps:
      - name: Compute service matrix
        id: plan
        run: |-
          if [ -n "${{ inputs.service }}" ]; then
            echo 'services=["${{ inputs.service }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'services=["apigateway","apigatewayv2","autoscaling","batch","bedrock-agentcore","cloudfront","cloudwatch","cognito","dynamodb","ec2","ecs","elbv2","events","firehose","iam","lambda","logs","rds","route53","s3","scheduler","sns","stepfunctions"]' >> "$GITHUB_OUTPUT"
          fi
  verify:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - id: auto_ba33701f
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::502761806921:role/cdkpf-monthly-verify
          aws-region: ap-northeast-1
          role-duration-seconds: 14400
      - name: Verify rules
        id: verify_rules
        run: bash bench/verify-all.sh ${{ matrix.service }}
      - name: Upload results
        id: upload_results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-${{ matrix.service }}
          path: bench/out/
    timeout-minutes: 300
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
  report:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    if: always()
    steps:
      - id: auto_ba33701f
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::502761806921:role/cdkpf-monthly-verify
          aws-region: ap-northeast-1
          role-duration-seconds: 14400
      - name: Download results
        id: download_results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: verify-*
          path: bench/out/
          merge-multiple: true
      - name: Sweep leftover stacks
        id: sweep_leftover_stacks
        run: bash bench/sweep.sh | tee bench/out/sweep.log
      - name: Report
        id: report
        run: bash bench/report.sh
