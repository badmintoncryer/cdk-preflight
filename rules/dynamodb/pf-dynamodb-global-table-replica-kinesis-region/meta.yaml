id: pf-dynamodb-global-table-replica-kinesis-region
service: dynamodb
benchRegion: us-east-1
resourceTypes: [AWS::DynamoDB::GlobalTable]
severity: ERROR
title: "A replica's Kinesis destination must be in the replica's Region"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-dynamodb-globaltable.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 us-east-1: fail -> ROLLBACK_COMPLETE, \"Invalid request provided: To enable Kinesis Data Stream in DynamoDBTable, both the stream and table must be in the same region.\"; pass -> CREATE_COMPLETE. The pass control creates the stream in the same template, so the only variable is the stream's Region."
addedOn: 2026-09-08
