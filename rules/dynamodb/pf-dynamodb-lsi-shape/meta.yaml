id: pf-dynamodb-lsi-shape
service: dynamodb
resourceTypes: [AWS::DynamoDB::Table]
severity: ERROR
title: An LSI needs a RANGE key and the table's leading hash key
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-dynamodb-table-localsecondaryindex.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1: LSI without RANGE -> \"Index KeySchema does not have a range key for index: lsi1\"; LSI with a different hash key -> \"Index KeySchema does not have the same leading hash key as table KeySchema for index: lsi1. index hash key: other, table hash key: pk\". Both ROLLBACK_COMPLETE."
addedOn: 2026-09-02
