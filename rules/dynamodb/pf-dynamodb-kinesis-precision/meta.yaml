id: pf-dynamodb-kinesis-precision
service: dynamodb
resourceTypes: [AWS::DynamoDB::Table]
severity: ERROR
title: "Kinesis record timestamp precision is MICROSECOND or MILLISECOND"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-dynamodb-table-kinesisstreamspecification.html
upstream: pending-engine
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 us-east-1: fail -> ROLLBACK_COMPLETE, \"Validation failed with 1 error(s). Call DescribeEvents to retrieve the full list of issues with resource and property details, resolve each error, then retry the operation.\"; pass -> CREATE_COMPLETE. The stream is created in the same template so the only invalid value is the precision. The bundled engine reports the enum as W3030/WARN only (1.7.0-beta) -> upstream: pending-engine."
addedOn: 2026-09-08
