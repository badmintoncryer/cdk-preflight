id: pf-dynamodb-import-format-options
service: dynamodb
resourceTypes: [AWS::DynamoDB::Table]
severity: ERROR
title: "InputFormatOptions only applies to CSV imports"
constraintSource: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/S3DataImport.Requesting.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 us-east-1: fail -> ROLLBACK_COMPLETE, \"Invalid Request: Unsupported InputFormatOptions for the given input format: DYNAMODB_JSON.\"; pass -> CREATE_COMPLETE. The S3 bucket in the fixture does not exist; the format check fires before the source is read."
