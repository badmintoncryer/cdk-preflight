id: pf-dynamodb-resource-policy-size
service: dynamodb
resourceTypes: [AWS::DynamoDB::Table]
severity: ERROR
title: "A table resource policy must stay under 20480 bytes"
constraintSource: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/rbac-considerations.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 us-east-1: fail -> ROLLBACK_COMPLETE, \"One or more parameter values were invalid: Maximum policy size of 20480 bytes exceeded\"; pass -> CREATE_COMPLETE."
addedOn: 2026-09-08
