resourceTypes: [AWS::DynamoDB::Table]
severity: ERROR
title: Secondary index names must be unique
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-dynamodb-table.html
