id: pf-dynamodb-attribute-type
service: dynamodb
resourceTypes: [AWS::DynamoDB::Table]
severity: ERROR
title: "AttributeType must be S, N or B"
constraintSource: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_CreateTable.html
upstream: pending-engine
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 us-east-1: fail -> ROLLBACK_COMPLETE, \"1 validation error detected: Value 'X' at 'attributeDefinitions.1.member.attributeType' failed to satisfy constraint: Member must satisfy enum value set: [B, N, S]\"; pass -> CREATE_COMPLETE. The bundled engine reports the enum as W3030/WARN only (1.7.0-beta) -> upstream: pending-engine."
