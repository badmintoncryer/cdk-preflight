id: pf-dynamodb-global-table-witness-requires-mrsc
service: dynamodb
benchRegion: us-east-1
resourceTypes: [AWS::DynamoDB::GlobalTable]
severity: ERROR
title: "GlobalTableWitnesses only exists for MRSC global tables"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-dynamodb-globaltable-globaltablewitness.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 us-east-1: fail -> ROLLBACK_COMPLETE, \"Witnesses are not supported for global tables with MultiRegionConsistency set to EVENTUAL\"; pass -> CREATE_COMPLETE; omission bench 2026-11-26 us-east-1: pass template without AWS::DynamoDB::GlobalTable.MultiRegionConsistency -> ROLLBACK_COMPLETE with \"Witnesses are not supported for global tables with MultiRegionConsistency set to EVENTUAL\""
  expect: "Witnesses are not supported for global tables with MultiRegionConsistency set to EVENTUAL"
addedOn: 2026-09-08
omissionFails:
  - "AWS::DynamoDB::GlobalTable.MultiRegionConsistency"
