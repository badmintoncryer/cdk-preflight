id: pf-dynamodb-global-table-witness-region
service: dynamodb
benchRegion: us-east-1
resourceTypes: [AWS::DynamoDB::GlobalTable]
severity: ERROR
title: "A witness lives in a Region that has no replica"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-dynamodb-globaltable-globaltablewitness.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 us-east-1: fail -> ROLLBACK_COMPLETE, \"Cannot target multiple regions with the same action\"; pass -> CREATE_COMPLETE. The service error is generic (\"Cannot target multiple regions with the same action\"); the pass control differs only in moving the witness to the third Region of the set and reaches CREATE_COMPLETE."
addedOn: 2026-09-08
