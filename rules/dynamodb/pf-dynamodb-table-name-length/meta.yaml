id: pf-dynamodb-table-name-length
service: dynamodb
resourceTypes: [AWS::DynamoDB::Table]
severity: ERROR
title: TableName must be at least 3 characters
constraintSource: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_CreateTable.html
upstream: pending-engine
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1: TableName \"ab\" -> ROLLBACK_COMPLETE, \"Value 'ab' at 'tableName' failed to satisfy constraint: Member must have length greater than or equal to 3\". minLength is schema-expressible; engine silent (1.7.0-beta) -> upstream: pending-engine. Only the measured minimum is enforced."
addedOn: 2026-09-02
