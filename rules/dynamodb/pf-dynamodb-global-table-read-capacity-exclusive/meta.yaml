id: pf-dynamodb-global-table-read-capacity-exclusive
service: dynamodb
benchRegion: us-east-1
resourceTypes: [AWS::DynamoDB::GlobalTable]
severity: ERROR
title: "A replica sets either ReadCapacityUnits or autoscaling, never both or neither"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-dynamodb-globaltable-readprovisionedthroughputsettings.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 us-east-1: fail -> ROLLBACK_COMPLETE, \"Invalid request provided: You cannot specify both ReadCapacityUnits and ReadCapacityAutoScalingSettings at the same time for one replica or GSI.\"; pass -> CREATE_COMPLETE; omission bench 2026-11-26 us-east-1: pass template without AWS::DynamoDB::GlobalTable.Replicas.*.ReadProvisionedThroughputSettings.ReadCapacityUnits -> ROLLBACK_COMPLETE with \"Invalid request provided: You must specify ReadCapacityUnits or ReadCapacityAutoScalingSettings for each global table replica and each of its GSIs when Billi...\""
  expect: "You cannot specify both ReadCapacityUnits and ReadCapacityAutoScalingSettings at the same time for one replica or GSI"
addedOn: 2026-09-08
omissionFails:
  - "AWS::DynamoDB::GlobalTable.Replicas.*.ReadProvisionedThroughputSettings.ReadCapacityUnits"
