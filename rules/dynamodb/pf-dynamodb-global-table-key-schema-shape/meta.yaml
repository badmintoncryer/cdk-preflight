id: pf-dynamodb-global-table-key-schema-shape
service: dynamodb
benchRegion: us-east-1
resourceTypes: [AWS::DynamoDB::GlobalTable]
severity: ERROR
title: "GlobalTable KeySchema must be [HASH] or [HASH, RANGE]"
constraintSource: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_CreateTable.html
upstream: cfn-schema
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a three-element KeySchema written as RANGE, HASH, RANGE (so all three branches are broken at once) rolled back, but the GlobalTable handler only says \"Validation failed with 1 error(s). Call DescribeEvents to retrieve the full list of issues\" - it does not name the constraint. CreateTable answers directly: three elements give \"Value '[...]' at 'keySchema' failed to satisfy constraint: Member must have length less than or equal to 2\", and the ordering branches give \"Invalid KeySchema: The first KeySchemaElement is not a HASH key type\" / \"... The second KeySchemaElement is not a RANGE key type\". The pass template's HASH + RANGE pair reached CREATE_COMPLETE."
addedOn: 2026-09-08
