id: pf-dynamodb-global-table-attribute-definitions
service: dynamodb
benchRegion: us-east-1
resourceTypes: [AWS::DynamoDB::GlobalTable]
severity: ERROR
title: "GlobalTable AttributeDefinitions must match the key schemas exactly"
constraintSource: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_CreateTable.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 us-east-1: fail -> ROLLBACK_COMPLETE, \"An attribute referenced in a KeySchema element is not defined in AttributeDefinitions\"; pass -> CREATE_COMPLETE; omission bench 2026-11-26 us-east-1: pass template without AWS::DynamoDB::GlobalTable.AttributeDefinitions -> ROLLBACK_COMPLETE with \"AttributeDefinitions property cannot be empty when KeySchema, GlobalSecondaryIndexes, or LocalSecondaryIndexes are specified\"; omission bench 2026-11-26 us-east-1: pass template without AWS::DynamoDB::GlobalTable.KeySchema -> ROLLBACK_COMPLETE with \"KeySchema property cannot be empty\""
  expect: "An attribute referenced in a KeySchema element is not defined in AttributeDefinitions"
addedOn: 2026-09-08
omissionFails:
  - "AWS::DynamoDB::GlobalTable.AttributeDefinitions"
  - "AWS::DynamoDB::GlobalTable.KeySchema"
