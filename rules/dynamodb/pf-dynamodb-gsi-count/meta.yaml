id: pf-dynamodb-gsi-count
service: dynamodb
resourceTypes: [AWS::DynamoDB::Table]
severity: ERROR
title: "A table can carry at most 20 global secondary indexes"
constraintSource: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 us-east-1: fail -> ROLLBACK_COMPLETE, \"One or more parameter values were invalid: GlobalSecondaryIndex count exceeds the per-table limit of 20\"; pass -> CREATE_COMPLETE."
addedOn: 2026-09-08
