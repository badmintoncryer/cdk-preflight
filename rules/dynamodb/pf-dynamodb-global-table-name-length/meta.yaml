id: pf-dynamodb-global-table-name-length
service: dynamodb
benchRegion: us-east-1
resourceTypes: [AWS::DynamoDB::GlobalTable]
severity: ERROR
title: "GlobalTable TableName must be at least 3 characters"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-dynamodb-globaltable.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: TableName 'ab' rolled back with \"1 validation error detected: Value 'ab' at 'tableName' failed to satisfy constraint: Member must have length greater than or equal to 3\"; the pass template's three-character name reached CREATE_COMPLETE."
addedOn: 2026-09-08
