id: pf-memorydb-user-password
service: memorydb
resourceTypes: [AWS::MemoryDB::User]
severity: ERROR
title: "A password user needs passwords of 16-128 characters"
constraintSource: https://docs.aws.amazon.com/memorydb/latest/APIReference/API_CreateUser.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a 129 character password -> \"Passwords length must be between 16-128 characters.\" ROLLBACK_COMPLETE (the chained user carries a 15 character password); pass a 128 and a 16 character password -> CREATE_COMPLETE."
addedOn: 2026-09-06
