id: pf-memorydb-maintenance-window
service: memorydb
resourceTypes: [AWS::MemoryDB::Cluster]
severity: ERROR
title: "MaintenanceWindow must be ddd:hh24:mi-ddd:hh24:mi and span at least 60 minutes"
constraintSource: https://docs.aws.amazon.com/memorydb/latest/APIReference/API_CreateCluster.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a 59 minute window (sun:23:00-sun:23:59) -> \"Maintenance window must be at least 60 minutes.\" ROLLBACK_COMPLETE (the chained cluster carries a malformed window); pass sun:23:00-mon:00:00, exactly 60 minutes -> CREATE_COMPLETE."
addedOn: 2026-09-06
