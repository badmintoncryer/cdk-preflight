# 手書きのリスト（8 件以上の文字列リテラル集合）の台帳。scripts/lint-rules.ts が rules/ の中の
# リストとこの台帳を突き合わせ、載っていないリストも、もう無いリストの行も落とす。
#
#   kind    allow = リストに無い値でルールが鳴る（閉じた世界の主張）。deny = リストにある値で鳴る。
#   growth  grows = AWS が値を足していく（リージョン、ランタイム、メトリクス名、属性キー…）。
#           stable = AWS の外で決まる、ほぼ増えない集合（ISO 国コード、IANA タイムゾーン、HTTP メソッド…）。
#   refresh 権威ある出どころとリストを突き合わせるテスト。grows の allow リストは、これが無いと
#           「今日の一覧に無い = 誤り」と言い切れないので、使うルールは WARN にしかできない（②）。
#   source  stable の根拠（任意）。

