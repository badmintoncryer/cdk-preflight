id: pf-avp-policy-balanced-braces
service: verifiedpermissions
benchRegion: us-east-1
resourceTypes: [AWS::VerifiedPermissions::Policy, AWS::VerifiedPermissions::PolicyTemplate]
severity: ERROR
title: "Braces and parentheses in a statement are balanced"
constraintSource: https://docs.cedarpolicy.com/policies/syntax-grammar.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail (condition brace never closed) -> ROLLBACK_COMPLETE, \"Invalid input (Service: VerifiedPermissions, Status Code: 400). At /definition/static/statement: Failed to validate policy body.\"; pass (the same template with only the offending statement corrected) -> CREATE_COMPLETE. CloudFormation names the fieldList path but not the reason, so the fail/pass pair on a single statement is what attributes the rejection to this constraint. Both resources in the fail template are rejected - the static policy at /definition/static/statement and the template at /template/statement - which is how the one rule is shown to cover both resource types. The policy store is Mode=OFF in both fixtures, so the check is the Cedar parser and not the STRICT schema validator (api 2026-09-25 us-east-1, phase A probe-out-1, rejected the same statement against a Mode=OFF policy store)."
addedOn: 2026-09-25
