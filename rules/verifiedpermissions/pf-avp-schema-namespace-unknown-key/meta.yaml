id: pf-avp-schema-namespace-unknown-key
service: verifiedpermissions
benchRegion: us-east-1
resourceTypes: [AWS::VerifiedPermissions::PolicyStore]
severity: ERROR
title: "A namespace body holds only commonTypes, entityTypes, actions and annotations"
constraintSource: https://docs.cedarpolicy.com/schema/json-schema.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail -> ROLLBACK_COMPLETE, \"Invalid input (Service: VerifiedPermissions, Status Code: 400). At /schema: unknown field `bogusKey`, expected one of `commonTypes`, `entityTypes`, `actions`, `annotations`.\"; pass (the same PolicyStore with only the schema corrected) -> CREATE_COMPLETE. The store is ValidationSettings.Mode=OFF in both fixtures, so what rejects the fail template is the Cedar schema parser and not the STRICT policy validator."
addedOn: 2026-09-25
