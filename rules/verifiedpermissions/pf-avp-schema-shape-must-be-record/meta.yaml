id: pf-avp-schema-shape-must-be-record
service: verifiedpermissions
benchRegion: us-east-1
resourceTypes: [AWS::VerifiedPermissions::PolicyStore]
severity: ERROR
title: "An entity type's shape is a Record"
constraintSource: https://docs.cedarpolicy.com/schema/json-schema.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail -> ROLLBACK_COMPLETE, \"Invalid input (Service: VerifiedPermissions, Status Code: 400). At /schema: Shape for entity type MyApp::User is declared with a type other than `Record`.\"; pass (the same PolicyStore with only the schema corrected) -> CREATE_COMPLETE. The store is ValidationSettings.Mode=OFF in both fixtures, so what rejects the fail template is the Cedar schema parser and not the STRICT policy validator."
addedOn: 2026-09-25
