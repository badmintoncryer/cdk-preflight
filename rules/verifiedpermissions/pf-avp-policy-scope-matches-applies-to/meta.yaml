id: pf-avp-policy-scope-matches-applies-to
service: verifiedpermissions
benchRegion: us-east-1
resourceTypes: [AWS::VerifiedPermissions::PolicyStore, AWS::VerifiedPermissions::Policy, AWS::VerifiedPermissions::PolicyTemplate]
severity: ERROR
title: "A policy scope's principal and resource types match the action's appliesTo"
constraintSource: https://docs.cedarpolicy.com/policies/validation.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-26 us-east-1: fail -> ROLLBACK_COMPLETE, \"Invalid input (Service: VerifiedPermissions, Status Code: 400). At /definition: for policy `policy0`, unable to find an applicable action given the policy scope constraints.\"; pass (the same policy with principal and resource put back the right way round) -> CREATE_COMPLETE."
