id: pf-avp-static-policy-no-placeholder
service: verifiedpermissions
benchRegion: us-east-1
resourceTypes: [AWS::VerifiedPermissions::Policy]
severity: ERROR
title: "A static policy carries no ?principal or ?resource"
constraintSource: https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/policy-templates.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail (\"?principal\" in Definition.Static.Statement) -> ROLLBACK_COMPLETE, \"Invalid input (Service: VerifiedPermissions, Status Code: 400). At /definition/static/statement: expected a static policy, got a template containing the slot ?principal.\"; pass (the same template with only the offending statement corrected) -> CREATE_COMPLETE. The policy store is Mode=OFF in both fixtures, so the check is the Cedar parser and not the STRICT schema validator (api 2026-09-25 us-east-1, phase A probe-out-1, rejected the same statement against a Mode=OFF policy store)."
addedOn: 2026-09-25
