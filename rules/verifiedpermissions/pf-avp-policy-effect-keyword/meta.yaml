id: pf-avp-policy-effect-keyword
service: verifiedpermissions
benchRegion: us-east-1
resourceTypes: [AWS::VerifiedPermissions::Policy, AWS::VerifiedPermissions::PolicyTemplate]
severity: ERROR
title: "A Cedar statement starts with permit or forbid"
constraintSource: https://docs.cedarpolicy.com/policies/syntax-grammar.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail (effect keyword \"allow\" on both the static policy and the template) -> ROLLBACK_COMPLETE, \"Invalid input (Service: VerifiedPermissions, Status Code: 400). At /definition/static/statement: invalid policy effect: allow.\"; pass (the same template with only the offending statement corrected) -> CREATE_COMPLETE. Both resources in the fail template are rejected - the static policy at /definition/static/statement and the template at /template/statement - which is how the one rule is shown to cover both resource types. The policy store is Mode=OFF in both fixtures, so the check is the Cedar parser and not the STRICT schema validator (api 2026-09-25 us-east-1, phase A probe-out-1, rejected the same statement against a Mode=OFF policy store)."
addedOn: 2026-09-25
