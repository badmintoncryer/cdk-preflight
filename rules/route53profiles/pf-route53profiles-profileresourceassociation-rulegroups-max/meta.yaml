id: pf-route53profiles-profileresourceassociation-rulegroups-max
service: route53profiles
benchRegion: us-east-1
resourceTypes: [AWS::Route53Profiles::ProfileResourceAssociation]
severity: ERROR
title: "A Profile cannot hold more than 5 DNS Firewall rule groups"
constraintSource: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/DNSLimitations.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: six rule groups associated to one profile -> \"Profile exceeded max associations to firewall rule groups limit.\" ROLLBACK_COMPLETE; pass five -> CREATE_COMPLETE. The quota (L-F8A07EF1 \"DNS Firewall rule groups associations to a Route 53 Profile\", 5) is not adjustable, so the five is a hard limit (principle 6)."
addedOn: 2026-09-10
