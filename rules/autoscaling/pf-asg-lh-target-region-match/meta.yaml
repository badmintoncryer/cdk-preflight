  evidence: "bench 2026-09-09 us-east-1: Unable to publish test message to notification target arn:aws:sns:us-west-2:214794239830:cdkpf-lh-region using IAM role arn:aws:iam::214794239830:role/cdkpf-pf-asg-lh-target-region-match-fail-Role-tI6JQMur5w9i. Please check your target and role configuration … -> ROLLBACK_COMPLETE. pass template CREATE_COMPLETE. The service message names the unreachable target rather than the region, so the region is the mechanism, not the wording."
