id: pf-asg-health-check-grace-period
service: autoscaling
resourceTypes: [AWS::AutoScaling::AutoScalingGroup]
severity: ERROR
title: HealthCheckGracePeriod cannot be negative
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-autoscaling-autoscalinggroup.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-30 us-east-1: HealthCheckGracePeriod -10 -> \"Grace period must be a positive integer.\" ROLLBACK_COMPLETE; pass HealthCheckGracePeriod 300 -> CREATE_COMPLETE (MinSize 0 and no DesiredCapacity, so no instance is launched). Zero is the documented default and stays legal; the registry schema carries no minimum (engine clean). The fixtures name us-east-1a, so benchRegion pins us-east-1: without it the harness ran the rule in ap-northeast-1, where the group fails first on \"You must use a valid fully-formed launch template. Invalid availability zone: [us-east-1a]\" (monthly 2026-09-04 and 2026-09-29 counted that as verified because there was no repro.expect)."
  expect: "Grace period must be a positive integer"
addedOn: 2026-09-03
