id: pf-asg-predictive-capacity-metric-requires-load-and-scaling
service: autoscaling
resourceTypes: [AWS::AutoScaling::ScalingPolicy]
severity: ERROR
title: A customized capacity metric is an add-on to a load and a scaling metric
constraintSource: https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_PutScalingPolicy.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-09 us-east-1: The metric specification is invalid. A policy must have either one scaling metric and one load metric or one metric pair. -> ROLLBACK_COMPLETE. pass template CREATE_COMPLETE. A predefined load metric plus a capacity metric gives the narrower \"Capacity metric can only be used when you use customized load metric.\"."
addedOn: 2026-09-09
