id: pf-asg-sched-capacity-fields-ordering
service: autoscaling
resourceTypes: [AWS::AutoScaling::ScheduledAction]
severity: ERROR
title: A scheduled action keeps MinSize <= DesiredCapacity <= MaxSize
constraintSource: https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_PutScheduledUpdateGroupAction.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: three scheduled actions, one per comparison — DesiredCapacity 2 over MaxSize 1, DesiredCapacity 1 under MinSize 2, and MinSize 2 over MaxSize 1 -> \"Desired capacity must be less than or equal to max size\" (ROLLBACK_COMPLETE; the first action is reported and the other two stay behind it); pass one action with MinSize, MaxSize and DesiredCapacity all 1 -> CREATE_COMPLETE, which is the limit of all three at once."
addedOn: 2026-09-09
