id: pf-asg-ondemand-percentage-max
service: autoscaling
resourceTypes: [AWS::AutoScaling::AutoScalingGroup]
severity: ERROR
title: OnDemandPercentageAboveBaseCapacity tops out at 100
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-autoscaling-autoscalinggroup-instancesdistribution.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: OnDemandPercentageAboveBaseCapacity 101 -> \"Value '101' at 'mixedInstancesPolicy.launchStrategy.onDemandCapacityOverBasePercentage' failed to satisfy constraint: Member must have value less than or equal to 100\" ROLLBACK_COMPLETE; pass 100 -> CREATE_COMPLETE. api 2026-09-13 us-east-1 UpdateAutoScalingGroup: 101 is rejected with that message and 100 is accepted. The bundled schema carries no range for this property (the bare engine is clean on 101)."
addedOn: 2026-09-03
