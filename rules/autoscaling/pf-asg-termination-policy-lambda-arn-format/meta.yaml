id: pf-asg-termination-policy-lambda-arn-format
service: autoscaling
resourceTypes: [AWS::AutoScaling::AutoScalingGroup]
severity: ERROR
title: A termination policy is a published name or a Lambda ARN
constraintSource: https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_CreateAutoScalingGroup.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-09 us-east-1: [InvalidPolicyValue123] is not a valid termination policy. Valid termination policies are: [AllocationStrategy, ClosestToNextInstanceHour, Default, Lambda, NewestInstance, OldestInstance, OldestLaunchConfiguration, OldestLaunchTemplate]. -> ROLLBACK_COMPLETE. pass template CREATE_COMPLETE."
addedOn: 2026-09-09
