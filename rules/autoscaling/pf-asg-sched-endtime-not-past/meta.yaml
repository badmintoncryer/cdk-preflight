id: pf-asg-sched-endtime-not-past
service: autoscaling
resourceTypes: [AWS::AutoScaling::ScheduledAction]
severity: ERROR
title: A scheduled action EndTime is not a date already gone by
constraintSource: https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_PutScheduledUpdateGroupAction.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-09 us-east-1: Given end time is in the past -> ROLLBACK_COMPLETE. pass template CREATE_COMPLETE. The rule compares against a fixed floor (the addedOn date) because the engine has no clock builtin, so it flags only dates already past when the rule was written."
addedOn: 2026-09-09
