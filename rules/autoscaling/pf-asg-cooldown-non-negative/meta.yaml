id: pf-asg-cooldown-non-negative
service: autoscaling
resourceTypes: [AWS::AutoScaling::AutoScalingGroup]
severity: ERROR
title: Cooldown cannot be negative
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-autoscaling-autoscalinggroup.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-30 us-east-1: Cooldown \"-100\" -> \"Value '-100' at 'defaultCooldown' failed to satisfy constraint: Member must have value greater than or equal to 0\" ROLLBACK_COMPLETE; pass Cooldown \"300\" -> CREATE_COMPLETE, no instance launched. The property is string-typed, so no schema range applies (engine clean). The fixtures name us-east-1a, so benchRegion pins us-east-1: the fail is rejected on the value before the zone is checked even in ap-northeast-1 (monthly 2026-09-04 and 2026-09-29), but the pass names a zone that ap-northeast-1 does not have."
  expect: "Value '-100' at 'defaultCooldown' failed to satisfy constraint: Member must have value greater than or equal to 0"
addedOn: 2026-09-03
