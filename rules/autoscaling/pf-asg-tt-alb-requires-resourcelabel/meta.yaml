id: pf-asg-tt-alb-requires-resourcelabel
service: autoscaling
resourceTypes: [AWS::AutoScaling::ScalingPolicy]
severity: ERROR
title: The ALB request-count metric needs a ResourceLabel
constraintSource: https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_PutScalingPolicy.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-09 us-east-1: Resource label should be specified for predefined metric type ALBRequestCountPerTarget -> ROLLBACK_COMPLETE. pass template CREATE_COMPLETE. The pass template uses ASGAverageCPUUtilization: an ALB ResourceLabel needs a real target group already attached to the group (\"Target group not attached to the Auto Scaling group\")."
addedOn: 2026-09-09
