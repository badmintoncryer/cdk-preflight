id: pf-asg-instance-requirements-vcpu-min-max
service: autoscaling
resourceTypes: [AWS::AutoScaling::AutoScalingGroup]
severity: ERROR
title: Instance requirement ranges run from Min up to Max
constraintSource: https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_CreateAutoScalingGroup.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: VCpuCount Min 3 with Max 2 -> \"Invalid instance requirements. The Min value (3) in VCpuCount must be less or equal to the Max value (2).\" (ROLLBACK_COMPLETE); pass Min 2 with Max 2 -> CREATE_COMPLETE."
addedOn: 2026-09-09
