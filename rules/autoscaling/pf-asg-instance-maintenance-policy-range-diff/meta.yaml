id: pf-asg-instance-maintenance-policy-range-diff
service: autoscaling
resourceTypes: [AWS::AutoScaling::AutoScalingGroup]
severity: ERROR
title: An instance maintenance policy spans at most 100 points
constraintSource: https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_CreateAutoScalingGroup.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: MinHealthyPercentage 0 with MaxHealthyPercentage 101 (a spread of 101) -> \"The difference between MaxHealthyPercentage and MinHealthyPercentage must be less than or equal to 100.\" ROLLBACK_COMPLETE; pass 0 and 100 (a spread of exactly 100) -> CREATE_COMPLETE. api 2026-09-13 us-east-1 UpdateAutoScalingGroup: a spread of 101 is rejected with that message and 100 is accepted."
addedOn: 2026-09-09
