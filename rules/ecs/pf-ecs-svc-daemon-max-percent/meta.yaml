id: pf-ecs-svc-daemon-max-percent
service: ecs
benchRegion: us-east-1
resourceTypes: [AWS::ECS::Service]
severity: ERROR
title: A DAEMON service requires DeploymentConfiguration.MaximumPercent 100
constraintSource: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service_definition_parameters.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a DAEMON service with MaximumPercent 101 -> \"The daemon scheduling strategy does not support values above 100 for maximumPercent\" ROLLBACK_COMPLETE; pass 100 -> CREATE_COMPLETE. api 2026-09-13 us-east-1 CreateService: 101 is rejected with that message and 100 is accepted."
addedOn: 2026-09-08
