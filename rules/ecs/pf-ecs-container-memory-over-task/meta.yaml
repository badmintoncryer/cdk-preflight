id: pf-ecs-container-memory-over-task
service: ecs
resourceTypes: [AWS::ECS::TaskDefinition]
severity: ERROR
title: A container Memory must not exceed the task-level Memory
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ecs-taskdefinition.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: container Memory 513 against task Memory 512 -> \"Create TaskDefinition: The 'memory' setting for container 'app' is greater than for the task.\" (ROLLBACK_COMPLETE); pass container Memory 512 against task Memory 512 -> CREATE_COMPLETE, so equal is the limit and 513 the closest violating value."
addedOn: 2026-09-02
