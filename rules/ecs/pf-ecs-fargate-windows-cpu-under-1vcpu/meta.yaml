id: pf-ecs-fargate-windows-cpu-under-1vcpu
service: ecs
benchRegion: us-east-1
resourceTypes: [AWS::ECS::TaskDefinition]
severity: ERROR
title: Windows tasks on Fargate need at least 1 vCPU
constraintSource: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definition_parameters.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a WINDOWS_SERVER_2019_CORE FARGATE task definition with Cpu 512 and Memory 2048 -> \"No Fargate configuration exists for given values: 512 CPU, 2048 memory\" ROLLBACK_COMPLETE; pass Cpu 1024 with the same Windows platform -> CREATE_COMPLETE. api 2026-09-13 us-east-1 RegisterTaskDefinition: 512 is rejected and 1024 is accepted. Fargate Cpu is a fixed set (256, 512, 1024, ...), so 1023 does not exist and the tightest violating value is 512."
addedOn: 2026-09-08
