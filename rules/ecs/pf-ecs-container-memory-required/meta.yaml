service: ecs
resourceTypes: [AWS::ECS::TaskDefinition]
severity: ERROR
title: A container needs Memory or MemoryReservation when the task sets no Memory
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-ecs-taskdefinition-containerdefinition.html
