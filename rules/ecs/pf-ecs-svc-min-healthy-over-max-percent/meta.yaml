id: pf-ecs-svc-min-healthy-over-max-percent
service: ecs
benchRegion: us-east-1
resourceTypes: [AWS::ECS::Service]
severity: ERROR
title: MinimumHealthyPercent must stay below MaximumPercent
constraintSource: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service_definition_parameters.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: MinimumHealthyPercent 100 with MaximumPercent 100 -> \"Both maximumPercent and minimumHealthyPercent cannot be 100 as this will block deployments.\" (ROLLBACK_COMPLETE — equal is the closest violating pair because the rule fires at `>=`); pass 99 / 100 -> CREATE_COMPLETE."
