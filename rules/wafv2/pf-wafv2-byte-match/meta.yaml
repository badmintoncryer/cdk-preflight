id: pf-wafv2-byte-match
service: wafv2
resourceTypes: [AWS::WAFv2::WebACL, AWS::WAFv2::RuleGroup]
severity: ERROR
title: "ByteMatchStatement: exactly one of SearchString / SearchStringBase64, at most 200 bytes, non-blank, and CONTAINS_WORD only with [A-Za-z0-9_]"
constraintSource: https://docs.aws.amazon.com/waf/latest/APIReference/API_ByteMatchStatement.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: a 201-character SearchString -> \"AWS WAF couldn't perform the operation because you exceeded your resource limit NUM_BYTES_IN_BYTEMATCH_SEARCHSTRING\" (ROLLBACK_COMPLETE); pass 200 characters -> CREATE_COMPLETE"
addedOn: 2026-09-05
