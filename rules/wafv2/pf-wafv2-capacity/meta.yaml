id: pf-wafv2-capacity
service: wafv2
resourceTypes: [AWS::WAFv2::WebACL, AWS::WAFv2::RuleGroup]
severity: ERROR
title: "Rule group Capacity must be 1..5000 and cover the WCUs of its rules; a web ACL is limited to 5000 WCUs"
constraintSource: https://docs.aws.amazon.com/waf/latest/developerguide/aws-waf-capacity-units.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: a rule group declaring Capacity 5001 -> \"AWS WAF couldn't perform the operation because you exceeded your resource limit NUM_CAPACITY_UNITS_IN_RULE_GROUP\" (ROLLBACK_COMPLETE); pass Capacity 5000 -> CREATE_COMPLETE. The other branch - the WCUs the rules actually need - cannot be put on the same boundary in one template; it stays proved by the 2026-09-05 run (\"You exceeded the capacity limit for a rule group or web ACL., field: RULE_GROUP, parameter: 40\")."
addedOn: 2026-09-05
