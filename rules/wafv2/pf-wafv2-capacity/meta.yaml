id: pf-wafv2-capacity
service: wafv2
resourceTypes: [AWS::WAFv2::WebACL, AWS::WAFv2::RuleGroup]
severity: ERROR
title: "Rule group Capacity must be 1..5000 and cover the WCUs of its rules; a web ACL is limited to 5000 WCUs"
constraintSource: https://docs.aws.amazon.com/waf/latest/developerguide/aws-waf-capacity-units.html
upstream: none
