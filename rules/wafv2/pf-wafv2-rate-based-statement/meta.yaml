id: pf-wafv2-rate-based-statement
service: wafv2
resourceTypes: [AWS::WAFv2::WebACL, AWS::WAFv2::RuleGroup]
severity: ERROR
title: "Rate-based statement aggregation settings must be consistent (keys, forwarded IP config, scope-down, counts)"
constraintSource: https://docs.aws.amazon.com/waf/latest/APIReference/API_RateBasedStatement.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: a rule group with 5 rate-based rules alongside a web ACL with 11 -> \"AWS WAF couldn't perform the operation because you exceeded your resource limit NUM_RATEBASED_STATEMENT_IN_RULE_GROUP\" (ROLLBACK_COMPLETE; the rule group is created first, so the web ACL's own limit is not reached); pass 4 in the rule group and 10 in the web ACL -> CREATE_COMPLETE"
addedOn: 2026-09-05
