id: pf-wafv2-regex-syntax
service: wafv2
resourceTypes: [AWS::WAFv2::WebACL, AWS::WAFv2::RuleGroup, AWS::WAFv2::RegexPatternSet]
severity: ERROR
title: "Regular expressions must stay within the supported PCRE subset (no backreferences, lookaround, possessive / atomic groups, conditionals, recursion, \\K, \\R, control verbs), at most 10 per pattern set"
constraintSource: https://docs.aws.amazon.com/waf/latest/developerguide/waf-regex-pattern-support.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: a regex pattern set with 11 patterns -> \"AWS WAF couldn't perform the operation because you exceeded your resource limit NUM_PATTERNS_IN_REGEX_PATTERN_SET\" (ROLLBACK_COMPLETE); pass 10 -> CREATE_COMPLETE"
addedOn: 2026-09-05
