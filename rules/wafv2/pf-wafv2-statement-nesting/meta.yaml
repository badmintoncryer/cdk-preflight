id: pf-wafv2-statement-nesting
service: wafv2
resourceTypes: [AWS::WAFv2::WebACL, AWS::WAFv2::RuleGroup]
severity: ERROR
title: "And/Or need two nested statements; managed rule group, rule group reference and rate-based statements cannot be nested"
constraintSource: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statements-logical.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Error reason: You haven't met a minimum requirement for a threshold setting. Examples include a rule group capacity setting that's too low and an OR statement with only one nested statement., field: AND_STATEMENT, parameter: AndStatement\"; pass template -> CREATE_COMPLETE"
addedOn: 2026-09-05
