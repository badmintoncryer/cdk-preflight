id: pf-wafv2-custom-request-handling
service: wafv2
resourceTypes: [AWS::WAFv2::WebACL, AWS::WAFv2::RuleGroup]
severity: ERROR
title: "Inserted request headers: unique names, at most 10 per action and 100 per web ACL / rule group"
constraintSource: https://docs.aws.amazon.com/waf/latest/APIReference/API_CustomRequestHandling.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: one CustomRequestHandling with 11 InsertHeaders, 101 across the web ACL -> \"AWS WAF couldn't perform the operation because you exceeded your resource limit\" (ROLLBACK_COMPLETE; the message names no limit code); pass 10 headers per handling and 100 across the web ACL -> CREATE_COMPLETE"
addedOn: 2026-09-05
