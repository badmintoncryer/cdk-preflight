id: pf-wafv2-statement-limits
service: wafv2
resourceTypes: [AWS::WAFv2::WebACL, AWS::WAFv2::RuleGroup]
severity: ERROR
title: "Statement limits: 50 country codes, 30-character query argument names, 50 reference statements per web ACL / rule group, unique header and cookie filters"
constraintSource: https://docs.aws.amazon.com/waf/latest/developerguide/limits.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: 51 country codes, a 31-character SingleQueryArgument name and a 31-character rate-based CustomKeys QueryArgument name -> \"3 validation errors detected: ... rules.1.member.statement.geoMatchStatement.countryCodes ... Member must have length less than or equal to 50; ... singleQueryArgument.name ... less than or equal to 30; ... rateBasedStatement.customKeys.1.member.queryArgument.name ... less than or equal to 30\" (ROLLBACK_COMPLETE); pass 50 country codes and 30-character names -> CREATE_COMPLETE. The fourth branch, 50 referenced statements per container, is carried at 51 / 50 in the same fixtures but is not what the deploy reports: the SDK-level length checks fire first. The references all point at one IP set on purpose - 51 IP set resources made the fixture itself fall over on WAF throttling."
addedOn: 2026-09-05
