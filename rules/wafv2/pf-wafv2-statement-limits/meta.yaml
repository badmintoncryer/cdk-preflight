id: pf-wafv2-statement-limits
service: wafv2
resourceTypes: [AWS::WAFv2::WebACL, AWS::WAFv2::RuleGroup]
severity: ERROR
title: "Statement limits: 50 country codes, 30-character query argument names, 50 reference statements per web ACL / rule group, unique header and cookie filters"
constraintSource: https://docs.aws.amazon.com/waf/latest/developerguide/limits.html
upstream: none
repro:
