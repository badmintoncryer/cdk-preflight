id: pf-wafv2-label-syntax
service: wafv2
resourceTypes: [AWS::WAFv2::WebACL, AWS::WAFv2::RuleGroup]
severity: ERROR
title: "Rule labels and label match keys must follow the label syntax (no reserved words, no empty components, at most 8 components of 128 chars, no labels on rule group references)"
constraintSource: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-label-requirements.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: a 129-character label component -> \"Error reason: The parameter value is out of bounds., field: null, parameter: Label\" (ROLLBACK_COMPLETE); pass 128 characters -> CREATE_COMPLETE"
addedOn: 2026-09-05
