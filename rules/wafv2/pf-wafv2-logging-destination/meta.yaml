id: pf-wafv2-logging-destination
service: wafv2
resourceTypes: [AWS::WAFv2::LoggingConfiguration]
severity: ERROR
title: "Exactly one log destination whose name starts with aws-waf-logs-, in the web ACL account and region"
constraintSource: https://docs.aws.amazon.com/waf/latest/developerguide/logging-destinations.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: a log group whose name does not start with aws-waf-logs- -> \"Error reason: The ARN isn't valid. A valid ARN begins with arn: and includes other information separated by colons or slashes., field: LOG_DESTINATION\" (ROLLBACK_COMPLETE); pass an aws-waf-logs- log group -> CREATE_COMPLETE"
addedOn: 2026-09-05
