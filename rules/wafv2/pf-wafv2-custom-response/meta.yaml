id: pf-wafv2-custom-response
service: wafv2
resourceTypes: [AWS::WAFv2::WebACL, AWS::WAFv2::RuleGroup]
severity: ERROR
title: "Custom responses: no content-type or duplicate headers, at most 10 headers, body keys must exist, bodies within 4 KB / 50 entries / 50 KB total"
constraintSource: https://docs.aws.amazon.com/waf/latest/APIReference/API_CustomResponse.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: 51 custom response bodies, one of them 4097 characters, with 11 response headers -> \"AWS WAF couldn't perform the operation because you exceeded your resource limit NUM_CUSTOM_RESPONSE_BODY_IN_CONTAINER\" (ROLLBACK_COMPLETE); pass 50 bodies, the largest 4096 characters, 10 response headers -> CREATE_COMPLETE. The 50 KB total cannot be put on its boundary: 51,200 characters of body content do not fit in CloudFormation's 51,200-byte inline template."
addedOn: 2026-09-05
