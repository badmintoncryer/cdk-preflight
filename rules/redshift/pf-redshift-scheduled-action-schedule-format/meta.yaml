id: pf-redshift-scheduled-action-schedule-format
service: redshift
resourceTypes: [AWS::Redshift::ScheduledAction]
severity: ERROR
title: "ScheduledAction Schedule must be an at(...) or cron(...) expression"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-redshift-scheduledaction.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "api-probe 2026-09-15 us-east-1: CreateScheduledAction -> \"InvalidSchedule: Invalid schedule provided. The schedule expression must be encapsulated by cron() or at().\" (#66 phase B) (the fixtures create the targeted ra3.large cluster first, so the fail stack rolls back only after the cluster exists, about 10 minutes; the action itself is never created); bench 2026-09-22 us-east-1: fail -> \"Resource handler returned message:  Invalid schedule provided. The schedule expression must be encapsulated by cron() or at(). (Service: Redshift, Status Code: 400, Request ID: 686a5cc0-5298-46f8-8cb3-624eec7444a9) (SDK Attempt Count: 1)  (RequestToken: 51871538-d474-4e98-70f9-427159d04500, HandlerE\" (ROLLBACK_COMPLETE); pass -> CREATE_COMPLETE"
addedOn: 2026-09-22
