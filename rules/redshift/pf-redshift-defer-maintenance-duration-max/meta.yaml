id: pf-redshift-defer-maintenance-duration-max
service: redshift
resourceTypes: [AWS::Redshift::Cluster]
severity: ERROR
title: "DeferMaintenanceDuration must be at most 60 days"
constraintSource: https://docs.aws.amazon.com/redshift/latest/APIReference/API_ModifyClusterMaintenance.html
upstream: none
benchRegion: us-east-1
repro:
