id: pf-redshift-master-password-secret-kms-requires-manage
service: redshift
resourceTypes: [AWS::Redshift::Cluster]
severity: ERROR
title: "MasterPasswordSecretKmsKeyId requires ManageMasterPassword true"
constraintSource: https://docs.aws.amazon.com/redshift/latest/APIReference/API_CreateCluster.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "api-probe 2026-09-15 us-east-1: CreateCluster -> \"InvalidParameterValue: You can't set the secret encryption KMS key for this cluster without opting in to manage your admin credentials using AWS Secrets Manager. Opt in to managing your admin credentials with Secrets Manager, then try again.\" (#66 phase B); bench 2026-09-22 us-east-1: fail -> \"Resource handler returned message:  You can't set the secret encryption KMS key for this cluster without opting in to manage your admin credentials using AWS Secrets Manager. Opt in to managing your admin credentials with Secrets Manager, then try again. (Service: Redshift, Status Code: 400, Request\" (ROLLBACK_COMPLETE); pass -> CREATE_COMPLETE; omission: the fail template above is this omission (MasterPasswordSecretKmsKeyId with ManageMasterPassword absent, plus a MasterUserPassword) and is rejected with the KMS sentence. The omission bench of the pass template without ManageMasterPassword (2026-11-25 and 2026-11-26 us-east-1) also ended ROLLBACK_COMPLETE, but only with the handler's \"Cluster ... Not Found\" and no CreateCluster in CloudTrail, so it is not the evidence"
  expect: "You can't set the secret encryption KMS key for this cluster without opting in to manage your admin credentials using AWS Secrets Manager. Opt in to managing your admin credentials with Secrets Manager, then try again"
addedOn: 2026-09-22
omissionFails:
  - "AWS::Redshift::Cluster.ManageMasterPassword"
