id: pf-sqs-redrive-policy
service: sqs
resourceTypes: [AWS::SQS::Queue]
severity: ERROR
title: "RedrivePolicy needs deadLetterTargetArn (an SQS queue ARN) and maxReceiveCount in 1..1000"
constraintSource: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_CreateQueue.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: maxReceiveCount 1001 -> \"Value {...} for parameter RedrivePolicy is invalid. Reason: Invalid value for maxReceiveCount.\" ROLLBACK_COMPLETE (the chained second queue carries 0); pass 1000 and 1 -> CREATE_COMPLETE."
addedOn: 2026-09-05
