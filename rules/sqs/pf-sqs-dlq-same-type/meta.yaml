id: pf-sqs-dlq-same-type
service: sqs
resourceTypes: [AWS::SQS::Queue]
severity: ERROR
title: "A dead-letter queue named by a literal ARN must be the same type as its source (FIFO for FIFO, standard for standard); Fn::GetAtt wiring is covered by engine rule E3502"
constraintSource: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_CreateQueue.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Value {\"maxReceiveCount\":\"5\",\"deadLetterTargetArn\":\"arn:aws:sqs:ap-northeast-1:214794239830:cdkpf-dlq-type-fail.fifo\"} for parameter RedrivePolicy is invalid. Reason: Dead-letter queue must be same type of queue as the source..\"; pass template -> CREATE_COMPLETE"
addedOn: 2026-09-05
