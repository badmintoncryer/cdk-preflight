id: pf-sqs-redrive-allow-policy
service: sqs
resourceTypes: [AWS::SQS::Queue]
severity: ERROR
title: "RedriveAllowPolicy: redrivePermission is required (allowAll|denyAll|byQueue); byQueue needs 1..10 sourceQueueArns and the other two forbid them"
constraintSource: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_CreateQueue.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: 11 sourceQueueArns -> \"Value {...} for parameter RedriveAllowPolicy is invalid.\" ROLLBACK_COMPLETE (the chained second queue sets redrivePermission byQueue with no sourceQueueArns at all); pass 10 -> CREATE_COMPLETE. api 2026-09-13 us-east-1 SetQueueAttributes: 11 ARNs are rejected and 10 are accepted, and the ARNs do not have to point at existing queues."
addedOn: 2026-09-05
