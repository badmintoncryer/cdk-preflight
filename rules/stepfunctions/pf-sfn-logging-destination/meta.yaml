id: pf-sfn-logging-destination
service: stepfunctions
resourceTypes: [AWS::StepFunctions::StateMachine]
severity: ERROR
title: "LoggingConfiguration with Level other than OFF needs exactly one Destinations entry carrying CloudWatchLogsLogGroup.LogGroupArn, and a literal ARN must be a CloudWatch Logs log-group ARN ending in :*"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-stepfunctions-statemachine-loggingconfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Invalid Logging Configuration: Must specify exactly one Log Destination.\"; pass template -> CREATE_COMPLETE; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::StepFunctions::StateMachine.LoggingConfiguration.Destinations -> ROLLBACK_COMPLETE with \"Invalid Logging Configuration: Must specify exactly one Log Destination.\"; bench 2026-11-26 ap-northeast-1: fail -> \"Invalid Logging Configuration: Must specify exactly one Log Destination.\" (ROLLBACK_COMPLETE); pass -> CREATE_COMPLETE; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::StepFunctions::StateMachine.LoggingConfiguration.Destinations.*.CloudWatchLogsLogGroup -> ROLLBACK_COMPLETE with \"null\"; HandlerErrorCode InternalFailure, the same in two runs (2026-11-25 and 2026-11-26), while the pass template it was cut from reaches CREATE_COMPLETE"
  expect: "Invalid Logging Configuration: Must specify exactly one Log Destination"
addedOn: 2026-09-05
omissionFails:
  - "AWS::StepFunctions::StateMachine.LoggingConfiguration.Destinations"
  - "AWS::StepFunctions::StateMachine.LoggingConfiguration.Destinations.*.CloudWatchLogsLogGroup"
