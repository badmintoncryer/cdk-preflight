id: pf-sfn-asl-missing-state
service: stepfunctions
resourceTypes: [AWS::StepFunctions::StateMachine]
severity: ERROR
title: "ASL Next/Default/Choices[].Next/Catch[].Next must reference a state defined in the same States block, at every nesting level (a dangling StartAt is covered by engine rule E3601)"
constraintSource: https://docs.aws.amazon.com/step-functions/latest/dg/statemachine-structure.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Invalid State Machine Definition: 'MISSING_TRANSITION_TARGET: Missing 'Next' target: MISSING at /States/A/Next, MISSING_END_STATE: Workflow has no terminal state at null'\"; pass template -> CREATE_COMPLETE"
