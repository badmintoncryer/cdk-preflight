id: pf-sfn-kms-key-region
service: stepfunctions
resourceTypes: [AWS::StepFunctions::StateMachine, AWS::StepFunctions::Activity]
severity: ERROR
title: "EncryptionConfiguration.KmsKeyId must be a key in the deploy region (state machines and activities)"
constraintSource: https://docs.aws.amazon.com/step-functions/latest/dg/encryption-at-rest.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Invalid arn eu-west-1 (Service: Kms, Status Code: 400, Request ID: 574cac23-be67-4bd2-8ce8-496a7b458d8a) (SDK Attempt Count: 1)\"; pass template (Fn::GetAtt of a key in the stack) -> CREATE_COMPLETE. Control (CreateStateMachine API, same day): a non-existent key in the deploy region fails with \"Key ... does not exist\" instead, so the message names the region check, not the fake key. Evaluates only with a concrete deploy region (deploy_region injection); fixtures assume the harness region us-east-1"
addedOn: 2026-09-05
