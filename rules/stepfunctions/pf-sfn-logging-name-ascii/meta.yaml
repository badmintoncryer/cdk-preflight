id: pf-sfn-logging-name-ascii
service: stepfunctions
resourceTypes: [AWS::StepFunctions::StateMachine]
severity: ERROR
title: "With CloudWatch Logs logging enabled (Level other than OFF) the StateMachineName may only contain 0-9, A-Z, a-z, . - and _ (non-ASCII names are accepted only without logging)"
constraintSource: https://docs.aws.amazon.com/step-functions/latest/dg/cw-logs.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template (StateMachineName cdkpf-テスト + Level ALL, real log group, role with logs permissions) -> ROLLBACK_COMPLETE with \"Invalid Logging Configuration: 1 validation error detected: Value 'arn:aws:states:ap-northeast-1:...:stateMachine:cdkpf-テスト' at 'resourceId' failed to satisfy constraint: Member must satisfy regular expression pattern: ^[0-9A-Za-z.\\/\\-_:]+$\"; pass template (cdkpf-logging-name-ok, same logging) -> CREATE_COMPLETE. Without logging the same non-ASCII name creates fine (CreateStateMachine API, same day)."
addedOn: 2026-09-05
