id: pf-sfn-name-charset
service: stepfunctions
resourceTypes: [AWS::StepFunctions::StateMachine, AWS::StepFunctions::Activity]
severity: ERROR
title: "StateMachineName and Activity Name may not contain whitespace, brackets (< > { } [ ]), wildcards (? *), the special characters \" # % \\ ^ | ~ ` $ & , ; : / or control characters (non-ASCII letters are accepted)"
constraintSource: https://docs.aws.amazon.com/step-functions/latest/dg/service-quotas.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Invalid Name: 'cdkpf act/charset'\"; pass template -> CREATE_COMPLETE"
