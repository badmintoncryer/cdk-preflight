id: pf-sfn-asl-resource-arn
service: stepfunctions
resourceTypes: [AWS::StepFunctions::StateMachine]
severity: ERROR
title: "Task Resource is an ARN, and an integration pattern the service does not offer fails creation: .sync on Lambda/SNS/SQS/DynamoDB/EventBridge/API Gateway/aws-sdk, .waitForTaskToken on Athena/Batch/CodeBuild/EMR/Glue/DataBrew/MediaConvert/SageMaker/DynamoDB, and .sync:2 anywhere but states:startExecution"
constraintSource: https://docs.aws.amazon.com/step-functions/latest/dg/integrate-optimized.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Invalid State Machine Definition: 'SCHEMA_VALIDATION_FAILED: The resource provided arn:aws:states:::lambda:invoke.sync is not recognized. The value is not a valid resource ARN, or the resource is not available in this region. at /States/A/Resource'\"; pass template -> CREATE_COMPLETE"
addedOn: 2026-09-05
