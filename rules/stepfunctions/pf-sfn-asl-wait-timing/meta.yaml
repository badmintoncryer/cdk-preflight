id: pf-sfn-asl-wait-timing
service: stepfunctions
resourceTypes: [AWS::StepFunctions::StateMachine]
severity: ERROR
title: "A Wait state carries exactly one of Seconds / Timestamp / SecondsPath / TimestampPath, and a literal Timestamp is RFC3339 with T and Z (all four absent is covered by engine rule E3601)"
constraintSource: https://docs.aws.amazon.com/step-functions/latest/dg/state-wait.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Invalid State Machine Definition: 'SCHEMA_VALIDATION_FAILED: There should only be one of the following fields: [SecondsPath, Seconds, TimestampPath, Timestamp] at /States/W'\"; pass template -> CREATE_COMPLETE"
addedOn: 2026-09-05
