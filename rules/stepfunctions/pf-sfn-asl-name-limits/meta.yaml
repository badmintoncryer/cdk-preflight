id: pf-sfn-asl-name-limits
service: stepfunctions
resourceTypes: [AWS::StepFunctions::StateMachine]
severity: ERROR
title: "ASL state names are at most 80 characters; a Distributed Map Label is at most 40 characters and unique within the state machine"
constraintSource: https://docs.aws.amazon.com/step-functions/latest/dg/service-quotas.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: an 81 character state name -> \"Invalid State Machine Definition: 'INVALID_STATE_NAME: Invalid State name: ...'\" ROLLBACK_COMPLETE (the same definition carries a 41 character Map Label); pass 80 characters and a 40 character Label -> CREATE_COMPLETE."
addedOn: 2026-09-05
