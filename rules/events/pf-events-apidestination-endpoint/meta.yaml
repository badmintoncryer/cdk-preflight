severity: ERROR
title: An API destination needs an HTTPS endpoint and a same-Region connection
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-events-apidestination.html
upstream: none
benchRegion: us-east-1
repro:
