id: pf-events-rule-name-duplicate
service: events
resourceTypes: [AWS::Events::Rule]
severity: ERROR
title: Two rules in one template may not share a name
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-events-rule.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-07 us-east-1: two AWS::Events::Rule resources both named cdkpf-bench-dup -> ROLLBACK_COMPLETE. Rules without an explicit Name get generated names and never collide, so only literal Name values are compared. bench 2026-11-27 us-east-1: fail template -> ROLLBACK_COMPLETE with \"Validation failed with 1 error(s). Call DescribeEvents to retrieve the full list of issues with resource and property details, resolve each error, then retry the operation. [DescribeEvents: NAME_CONFLICT_VALIDATION R0 /Resources/R0: Duplicate resource detected: 'R0' of type 'AWS::Events::Rule' has the same identifier as another resource in the template.]\""
  expect: "has the same identifier as another resource in the template"
addedOn: 2026-09-07
