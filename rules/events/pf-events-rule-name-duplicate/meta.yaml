id: pf-events-rule-name-duplicate
service: events
resourceTypes: [AWS::Events::Rule]
severity: ERROR
title: Two rules in one template may not share a name
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-events-rule.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-07 us-east-1: two AWS::Events::Rule resources both named cdkpf-bench-dup -> ROLLBACK_COMPLETE. Rules without an explicit Name get generated names and never collide, so only literal Name values are compared."
addedOn: 2026-09-07
