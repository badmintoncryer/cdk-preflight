id: pf-events-input-transformer-placeholders
service: events
resourceTypes: [AWS::Events::Rule]
severity: ERROR
title: InputTemplate placeholders must be declared in InputPathsMap
constraintSource: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-transform-target-input.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-11-25 us-east-1 (verify-rule.sh): pass template now also has a target whose InputTemplate uses <detailType> without any InputPathsMap -> CREATE_COMPLETE (placeholders are not checked without InputPathsMap); fail -> ROLLBACK_COMPLETE. bench 2026-09-02 ap-northeast-1 (ev07): InputTemplate with <undeclared> -> \"InputTemplate for target t1 contains invalid placeholder undeclared.\" ROLLBACK_COMPLETE. aws.events.* predefined variables are exempt."
  expect: "InputTemplate for target t1 contains invalid placeholder undeclared."
addedOn: 2026-09-02
