  evidence: "bench 2026-09-07 us-east-1: ArrayProperties.Size 1 -> ROLLBACK_COMPLETE \"Parameter ArrayProperties is not valid. Reason: Size must be in between 2 and 10000.\" Measured the same day via events:PutTargets: RetryStrategy.Attempts outside 1-10 gives \"Attempts must be in between 1 and 10\"."
