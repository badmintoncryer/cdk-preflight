id: pf-events-target-batch-parameters
service: events
resourceTypes: [AWS::Events::Rule]
severity: ERROR
title: Batch array size and retry attempts have service-stated bounds
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-events-rule-batchparameters.html
upstream: none
benchRegion: us-east-1
repro:
