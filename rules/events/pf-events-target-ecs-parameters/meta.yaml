id: pf-events-target-ecs-parameters
service: events
resourceTypes: [AWS::Events::Rule]
severity: ERROR
title: EcsParameters must match the launch type and stay inside its size caps
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-events-rule-ecsparameters.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: TaskCount 11 -> \"Parameter(s) TaskCount not valid for target: t1.\" ROLLBACK_COMPLETE (the same target carries 17 subnets and 6 security groups); pass TaskCount 10 with 16 subnets and 5 security groups -> CREATE_COMPLETE. PutTargets does not resolve the cluster, task definition, subnet or security group ids, so the fixture can use placeholders and still exercise the counts."
addedOn: 2026-09-07
