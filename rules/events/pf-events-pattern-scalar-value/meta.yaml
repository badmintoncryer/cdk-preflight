id: pf-events-pattern-scalar-value
service: events
resourceTypes: [AWS::Events::Rule, AWS::Events::Archive]
severity: ERROR
title: Event pattern values must be arrays or objects, not scalars
constraintSource: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1 (ev01): EventPattern {\"source\": \"aws.ec2\"} -> \"Event pattern is not valid. Reason: \\\"source\\\" must be an object or an array\". ROLLBACK_COMPLETE. events:CreateArchive rejects the same pattern with the same message (measured 2026-09-07, us-east-1), so AWS::Events::Archive is covered too. Nested keys are covered as well: {\"detail\": {\"a\": {\"b\": {\"c\": \"plain\"}}}} gives \"\\\"c\\\" must be an object or an array\" (measured 2026-09-07 via events:PutRule), while the same pattern with [\"v\"] is accepted. Matcher objects are array elements and are never walked, so {\"prefix\": \"a\"} stays silent."
addedOn: 2026-09-02
