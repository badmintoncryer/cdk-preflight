id: pf-grafana-ws-nac-id-prefix
service: grafana
resourceTypes: [AWS::Grafana::Workspace]
benchRegion: us-east-1
severity: ERROR
title: "A network access control list holds prefix-list ids"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-grafana-workspace-networkaccesscontrol.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-26 us-east-1: fail (NetworkAccessControl.PrefixListIds [\"not-a-prefix-list\"], VpceIds [\"not-a-vpc-endpoint\"]) -> ROLLBACK_COMPLETE, Resource handler returned message: \"The Prefix List Id should satisfy the pattern ^pl-[a-z0-9_]{1,32}$. (Service: Grafana, Status Code: 400, Request ID: c69844b7-82c7-4b03-bec1-a94315e3a26d)\". The VpceIds body was measured on its own on 2026-09-27 (stack cdkpf-c3-vpce, VpceIds [\"not-a-vpc-endpoint\"] with PrefixListIds []) -> CREATE_FAILED, Resource handler returned message: \"The VPC endpoint should satisfy the pattern ^vpce-[0-9a-f]{1,32}$. (Service: Grafana, Status Code: 400, Request ID: 8b298807-6268-4fcb-af1a-f1087894d08b)\" -- hexadecimal only, a different charset from the prefix list's, which the doc does not mention at all, so the two bodies carry the two measured patterns rather than one shared guess. A well formed id that does not exist is a different sentence (Prefix List Ids [pl-0123456789abcdef0] are invalid. Please recheck the ids and ensure they are correct), so a format violation stays distinguishable from a missing resource. pass (pl-1a2b3c4d / vpce-1a2b3c4d) not deployed (--fail-only) and silent under rule-check"
addedOn: 2026-09-26
