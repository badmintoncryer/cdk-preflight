id: pf-kinesis-provisioned-shard-count
service: kinesis
resourceTypes: [AWS::Kinesis::Stream]
severity: ERROR
title: "A provisioned stream must set ShardCount"
constraintSource: https://docs.aws.amazon.com/kinesis/latest/APIReference/API_CreateStream.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-06 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"ShardCount is expected when StreamMode=PROVISIONED\"; pass template -> CREATE_COMPLETE; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::Kinesis::Stream.ShardCount -> ROLLBACK_COMPLETE with \"ShardCount is expected when StreamMode=PROVISIONED\""
  expect: "ShardCount is expected when StreamMode=PROVISIONED"
addedOn: 2026-09-06
omissionFails:
  - "AWS::Kinesis::Stream.ShardCount"
