id: pf-codepipeline-artifact-name-charset
service: codepipeline
benchRegion: us-east-1
resourceTypes: [AWS::CodePipeline::Pipeline]
severity: ERROR
title: "An artifact name is at most 100 characters of letters, digits, underscore and hyphen"
constraintSource: https://docs.aws.amazon.com/codepipeline/latest/APIReference/API_Artifact.html
upstream: none
repro:
  method: real-deploy
  evidence: "api-probe 2026-09-14 us-east-1: CreatePipeline with a dotted artifact name -> \"ValidationException: ... Member must satisfy regular expression pattern: [a-zA-Z0-9_\\\\-]+\"; bench 2026-09-14 us-east-1: fail -> \"2 validation errors detected: Value at 'pipeline.stages.1.member.actions.1.member.outputArtifacts.1.member.name' failed to satisfy constraint: Member must have length less than or equal to 100; Value at 'pipeline.stages.2.member.actions.1.member.inputArtifacts.1.member.name' failed to satisfy constraint: Member must have length less than or equal to 100\" (ROLLBACK_COMPLETE); pass -> CREATE_COMPLETE"
addedOn: 2026-09-14
