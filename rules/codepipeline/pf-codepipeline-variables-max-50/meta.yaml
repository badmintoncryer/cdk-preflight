id: pf-codepipeline-variables-max-50
service: codepipeline
benchRegion: us-east-1
resourceTypes: [AWS::CodePipeline::Pipeline]
severity: ERROR
title: "A pipeline may declare at most 50 pipeline-level variables"
constraintSource: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipeline-types.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: 51 pipeline variables -> \"Value at 'pipeline.variables' failed to satisfy constraint: Member must have length less than or equal to 50\" (ROLLBACK_COMPLETE); pass 50 variables -> CREATE_COMPLETE"
