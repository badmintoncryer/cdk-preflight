id: pf-codepipeline-v1-action-provider
service: codepipeline
benchRegion: us-east-1
resourceTypes: [AWS::CodePipeline::Pipeline]
severity: ERROR
title: "The Commands, ECRBuildAndPublish and EKS action providers need a V2 pipeline"
constraintSource: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipeline-types.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-11-25 us-east-1 (verify-rule.sh): the pass template now omits PipelineType, which creates a V2 pipeline (get-pipeline: pipelineType V2), -> CREATE_COMPLETE; fail template with an explicit V1 -> ROLLBACK_COMPLETE. bench 2026-09-14 us-east-1: PipelineType V1 with a Commands action -> \"InvalidActionDeclarationException: Commands Action can only be used with V2 pipelines.\" (ROLLBACK_COMPLETE); api-probe 2026-09-14 us-east-1: the same error for ECRBuildAndPublish and EKS; pass V2 -> CREATE_COMPLETE"
  expect: "Commands Action can only be used with V2 pipelines"
addedOn: 2026-09-14
