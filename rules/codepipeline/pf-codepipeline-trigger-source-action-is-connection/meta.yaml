  evidence: "bench 2026-09-14 us-east-1: a trigger naming an S3 source action -> \"InvalidStructureException: Triggers for connections must reference a CodeStarSourceConnection action. Note that when you specify a trigger, you can't specify more than one trigger per source action.\" (ROLLBACK_COMPLETE); api-probe 2026-09-14 us-east-1: a trigger naming an action that does not exist returns the same error; pass naming the CodeStarSourceConnection action -> CREATE_COMPLETE"
