id: pf-codepipeline-cat-queryable-max-1
service: codepipeline
benchRegion: us-east-1
resourceTypes: [AWS::CodePipeline::CustomActionType]
severity: ERROR
title: "At most one configuration property of a custom action type may be Queryable"
constraintSource: https://docs.aws.amazon.com/codepipeline/latest/APIReference/API_ActionConfigurationProperty.html
upstream: none
repro:
  method: real-deploy
  evidence: "api-probe 2026-09-14 us-east-1: CreateCustomActionType with two queryable properties -> \"InvalidActionTypeException: Multiple queryable configuration properties found with names 'a, b'. Up to one queryable property may be specified.\"; bench 2026-09-14 us-east-1: fail -> \"Multiple queryable configuration properties found with names 'a, b'. Up to one queryable property may be specified.\" (ROLLBACK_COMPLETE); pass -> CREATE_COMPLETE The pass fixture names the custom action type after the stack id's GUID because DeleteCustomActionType burns the Category/Provider/Version triple permanently (re-creating it returns \"... has been deleted. Create a new version of the action type.\"); the fail fixture creates nothing, so the monthly --fail-only run is unaffected."
addedOn: 2026-09-14
