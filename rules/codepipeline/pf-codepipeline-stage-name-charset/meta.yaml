resourceTypes: [AWS::CodePipeline::Pipeline]
severity: ERROR
title: "A stage name is at most 100 characters of [A-Za-z0-9.@_-]"
constraintSource: https://docs.aws.amazon.com/codepipeline/latest/APIReference/API_CreatePipeline.html
