id: pf-efs-throughput-mode
service: efs
resourceTypes: [AWS::EFS::FileSystem]
severity: ERROR
title: "ProvisionedThroughputInMibps belongs to ThroughputMode: provisioned and nothing else"
constraintSource: https://docs.aws.amazon.com/efs/latest/APIReference/API_CreateFileSystem.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: ProvisionedThroughputInMibps 3415 -> \"The requested provisioned throughput of 3415.000000 MiB/s exceeds the maximum limit 3414.000000 MiB/s.\" ROLLBACK_COMPLETE (the chained file systems carry provisioned mode without a value and elastic mode with one); pass provisioned 1 MiBps and an elastic file system -> CREATE_COMPLETE. The pass cannot sit on 3414: provisioned throughput bills at 6 USD per MiBps-month, so a few minutes at the ceiling would cost about 7 USD. The quota (L-BFB6FB19) is not adjustable, so 3414 is a hard limit."
addedOn: 2026-09-06
