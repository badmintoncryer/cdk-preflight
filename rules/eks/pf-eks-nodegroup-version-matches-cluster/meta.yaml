id: pf-eks-nodegroup-version-matches-cluster
service: eks
resourceTypes: [AWS::EKS::Nodegroup, AWS::EKS::Cluster]
benchRegion: us-east-1
severity: ERROR
title: A node group's Kubernetes version must be within three minors of the cluster's
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-eks-nodegroup.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail template -> \"Cluster Kubernetes version 1.35 supports the following Nodegroup Kubernetes versions: [1.35, 1.34, 1.33, 1.32]\" (ROLLBACK_COMPLETE); fail-only, and the fixture builds its own EKS cluster because CreateNodegroup checks that the cluster exists before it looks at this property."
