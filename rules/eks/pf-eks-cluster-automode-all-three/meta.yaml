id: pf-eks-cluster-automode-all-three
service: eks
resourceTypes: [AWS::EKS::Cluster]
benchRegion: us-east-1
severity: ERROR
title: "EKS Auto Mode needs compute, load balancing and block storage switched together"
constraintSource: https://docs.aws.amazon.com/eks/latest/userguide/automode-get-started-cli.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: ComputeConfig.Enabled true with no ElasticLoadBalancing and no BlockStorage -> ROLLBACK_COMPLETE, \"For EKS Auto Mode, please ensure that all required configs, including computeConfig, kubernetesNetworkConfig, and blockStorage are all either fully enabled or fully disabled.\" (HandlerErrorCode: InvalidRequest); the same template with all three Enabled true reaches the next check. fail-only, no cluster created; omission bench 2026-11-26 us-east-1: pass template without AWS::EKS::Cluster.ComputeConfig -> ROLLBACK_COMPLETE with \"For EKS Auto Mode, please ensure that all required configs, including computeConfig, kubernetesNetworkConfig, and blockStorage are all either fully enabled o...\"; omission bench 2026-11-26 us-east-1: pass template without AWS::EKS::Cluster.KubernetesNetworkConfig.ElasticLoadBalancing -> ROLLBACK_COMPLETE with \"For EKS Auto Mode, please ensure that all required configs, including computeConfig, kubernetesNetworkConfig, and blockStorage are all either fully enabled o...\"; omission bench 2026-11-26 us-east-1: pass template without AWS::EKS::Cluster.KubernetesNetworkConfig.ElasticLoadBalancing.Enabled -> ROLLBACK_COMPLETE with \"For EKS Auto Mode, please ensure that all required configs, including computeConfig, kubernetesNetworkConfig, and blockStorage are all either fully enabled o...\"; omission bench 2026-11-26 us-east-1: pass template without AWS::EKS::Cluster.StorageConfig -> ROLLBACK_COMPLETE with \"For EKS Auto Mode, please ensure that all required configs, including computeConfig, kubernetesNetworkConfig, and blockStorage are all either fully enabled o...\"; omission bench 2026-11-26 us-east-1: pass template without AWS::EKS::Cluster.StorageConfig.BlockStorage -> ROLLBACK_COMPLETE with \"For EKS Auto Mode, please ensure that all required configs, including computeConfig, kubernetesNetworkConfig, and blockStorage are all either fully enabled o...\"; omission bench 2026-11-26 us-east-1: pass template without AWS::EKS::Cluster.ComputeConfig.Enabled -> ROLLBACK_COMPLETE with \"For EKS Auto Mode, please ensure that all required configs, including computeConfig, kubernetesNetworkConfig, and blockStorage are all either fully enabled or fully disabled.\"; omission bench 2026-11-26 us-east-1: pass template without AWS::EKS::Cluster.KubernetesNetworkConfig -> ROLLBACK_COMPLETE with \"For EKS Auto Mode, please ensure that all required configs, including computeConfig, kubernetesNetworkConfig, and blockStorage are all either fully enabled or fully disabled.\"; omission bench 2026-11-26 us-east-1: pass template without AWS::EKS::Cluster.StorageConfig.BlockStorage.Enabled -> ROLLBACK_COMPLETE with \"For EKS Auto Mode, please ensure that all required configs, including computeConfig, kubernetesNetworkConfig, and blockStorage are all either fully enabled or fully disabled.\""
  expect: "For EKS Auto Mode, please ensure that all required configs, including computeConfig, kubernetesNetworkConfig, and blockStorage are all either fully enabled or fully disabled"
addedOn: 2026-09-25
omissionFails:
  - "AWS::EKS::Cluster.ComputeConfig"
  - "AWS::EKS::Cluster.KubernetesNetworkConfig.ElasticLoadBalancing"
  - "AWS::EKS::Cluster.KubernetesNetworkConfig.ElasticLoadBalancing.Enabled"
  - "AWS::EKS::Cluster.StorageConfig"
  - "AWS::EKS::Cluster.StorageConfig.BlockStorage"
  - "AWS::EKS::Cluster.ComputeConfig.Enabled"
  - "AWS::EKS::Cluster.KubernetesNetworkConfig"
  - "AWS::EKS::Cluster.StorageConfig.BlockStorage.Enabled"
