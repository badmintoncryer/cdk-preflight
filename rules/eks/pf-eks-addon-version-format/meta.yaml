id: pf-eks-addon-version-format
service: eks
resourceTypes: [AWS::EKS::Addon]
benchRegion: us-east-1
severity: ERROR
title: "AddonVersion must be of the form vX.Y.Z-eksbuild.N"
constraintSource: https://docs.aws.amazon.com/eks/latest/APIReference/API_CreateAddon.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: AddonVersion \"1.23.1\" (the published version without the v prefix and the -eksbuild suffix) -> ROLLBACK_COMPLETE, \"Addon version specified is not supported\" (HandlerErrorCode: InvalidRequest). Confound: the message does not name the format, it only says the version is unsupported - so the evidence that a malformed version can never be supported comes from the catalogue instead: describe-addon-versions returned 1677 versions in us-east-1 and 1346 in ap-northeast-1 on 2026-09-25 and every one matched ^v[0-9]+\\.[0-9]+\\.[0-9]+-eksbuild\\.[0-9A-Za-z]+$ (the only non-numeric build was v1.4.0-eksbuild.preview, which is why the suffix is alphanumeric rather than digits). fail-only, and the fixture builds its own EKS cluster: CreateAddon reads this only after it has found the cluster, so a fixture pointing at a literal probe cluster would go INCONCLUSIVE the day that cluster is deleted."
addedOn: 2026-09-25
