id: pf-eks-nodegroup-update-config-xor
service: eks
resourceTypes: [AWS::EKS::Nodegroup]
benchRegion: us-east-1
severity: ERROR
title: UpdateConfig accepts MaxUnavailable or MaxUnavailablePercentage, never both
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-eks-nodegroup-updateconfig.html
