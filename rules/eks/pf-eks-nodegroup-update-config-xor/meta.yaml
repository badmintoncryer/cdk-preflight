  evidence: "bench 2026-09-25 us-east-1: fail template -> \"Either provide max-unavailable or max-unavailable-percentage in the request.\" (ROLLBACK_COMPLETE); fail-only, and the fixture builds its own EKS cluster because CreateNodegroup checks that the cluster exists before it looks at this property."
