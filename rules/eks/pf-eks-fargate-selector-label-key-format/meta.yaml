id: pf-eks-fargate-selector-label-key-format
service: eks
resourceTypes: [AWS::EKS::FargateProfile]
benchRegion: us-east-1
severity: ERROR
title: "Fargate selector label keys must be Kubernetes qualified names"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-eks-fargateprofile-label.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: Selectors[0].Labels[0].Key \"bad key!\" -> ROLLBACK_COMPLETE, \"Selector label provided is invalid.\" (HandlerErrorCode: InvalidRequest). The message does not name the offending key; the qualified-name grammar itself is the one EKS reports verbatim for node group labels (pf-eks-nodegroup-label-key-format) and the same validator. fail-only, and the fixture names an absent cluster instead of building one: CreateFargateProfile validates this property before it looks the cluster up (phase B measured the same message against a cluster that does not exist)."
addedOn: 2026-09-25
