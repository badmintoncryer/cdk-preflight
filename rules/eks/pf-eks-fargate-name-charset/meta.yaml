id: pf-eks-fargate-name-charset
service: eks
resourceTypes: [AWS::EKS::FargateProfile]
benchRegion: us-east-1
severity: ERROR
title: "FargateProfileName must start with a letter or digit and hold only letters, digits, hyphens and underscores"
constraintSource: https://docs.aws.amazon.com/eks/latest/APIReference/API_CreateFargateProfile.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: FargateProfileName \"cdkpf.fp\" -> ROLLBACK_COMPLETE, \"The Fargate profile name parameter contains invalid characters. It should begin with letter or digit and can have any of the following characters: the set of Unicode letters, digits, hyphens and underscores.\" (HandlerErrorCode: InvalidRequest). fail-only, and the fixture names an absent cluster instead of building one: CreateFargateProfile validates this property before it looks the cluster up (phase B measured the same message against a cluster that does not exist)."
addedOn: 2026-09-25
