id: pf-eks-fargate-selector-namespace-format
service: eks
resourceTypes: [AWS::EKS::FargateProfile]
benchRegion: us-east-1
severity: ERROR
title: "A Fargate selector namespace must be a DNS-1123 label (wildcards allowed)"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-eks-fargateprofile-selector.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: Selectors[0].Namespace \"bad_ns\" -> ROLLBACK_COMPLETE, \"The namespace provided is invalid.\" (HandlerErrorCode: InvalidRequest). fail-only, and the fixture names an absent cluster instead of building one: CreateFargateProfile validates this property before it looks the cluster up. Each fail fixture needs its own cluster name - the physical id is \"<clusterName>|<name>\" and CloudFormation refuses an id another stack holds."
addedOn: 2026-09-25
