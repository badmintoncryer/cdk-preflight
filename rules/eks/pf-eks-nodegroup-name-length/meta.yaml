id: pf-eks-nodegroup-name-length
service: eks
resourceTypes: [AWS::EKS::Nodegroup]
benchRegion: us-east-1
severity: ERROR
title: NodegroupName may be at most 63 characters
constraintSource: https://docs.aws.amazon.com/eks/latest/userguide/launch-templates.html
upstream: none
repro:
