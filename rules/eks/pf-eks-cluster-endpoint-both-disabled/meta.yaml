severity: ERROR
title: "A cluster must keep at least one of the public and private API endpoints enabled"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-eks-cluster-resourcesvpcconfig.html
