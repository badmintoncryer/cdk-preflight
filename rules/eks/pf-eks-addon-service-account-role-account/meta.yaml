repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: ServiceAccountRoleArn in account 999999999999 -> ROLLBACK_COMPLETE, \"Cross-account pass role is not allowed. (Status Code: 403)\" (HandlerErrorCode: AccessDenied) - a 403 that reads like a missing IAM permission rather than a wrong ARN. fail-only, and the fixture names an absent cluster instead of building one: CreateAddon validates this property before it looks the cluster up (phase B measured the same message against a cluster that does not exist)."
