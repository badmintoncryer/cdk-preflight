id: pf-eks-accessentry-requires-api-auth-mode
service: eks
resourceTypes: [AWS::EKS::AccessEntry, AWS::EKS::Cluster]
benchRegion: us-east-1
severity: ERROR
title: "Access entries need a cluster whose authentication mode includes API"
constraintSource: https://docs.aws.amazon.com/eks/latest/userguide/grant-k8s-access.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: an AWS::EKS::Cluster with no AccessConfig at all (the CloudFormation default, CONFIG_MAP) plus an access entry -> ROLLBACK_COMPLETE, \"The cluster's authentication mode must be set to one of [API, API_AND_CONFIG_MAP] to perform this operation.\" The fail fixture leaves AccessConfig out rather than writing CONFIG_MAP, because that is the shape a template lands in by accident. fail-only; the fixture builds its own cluster."
addedOn: 2026-09-25
