id: pf-eks-cluster-ipv6-forbids-service-ipv4-cidr
service: eks
resourceTypes: [AWS::EKS::Cluster]
benchRegion: us-east-1
severity: ERROR
title: "An ipv6 cluster may not carry a ServiceIpv4Cidr"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-eks-cluster-kubernetesnetworkconfig.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: IpFamily ipv6 with ServiceIpv4Cidr 10.100.0.0/16 -> ROLLBACK_COMPLETE, \"serviceIpv4Cidr cannot be specified when creating an \\\"ipv6\\\" cluster\" (HandlerErrorCode: InvalidRequest); the same template without ServiceIpv4Cidr reaches the next check. fail-only, no cluster created (CreateCluster refuses synchronously)."
addedOn: 2026-09-25
