id: pf-eks-cluster-encryption-kms-key-region
service: eks
resourceTypes: [AWS::EKS::Cluster]
benchRegion: us-east-1
severity: ERROR
title: "The EncryptionConfig KMS key must live in the cluster's own region"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-eks-cluster-encryptionconfig.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: EncryptionConfig.Provider.KeyArn pointing at an ap-northeast-1 key -> ROLLBACK_COMPLETE, \"The keyArn for encryptionConfig is scoped to invalid aws region.\" (HandlerErrorCode: InvalidRequest). An aws-cn key ARN draws the same message (phase B, same day), so the region check covers the cross-partition case and no separate partition rule is needed. fail-only, no cluster created: CreateCluster refuses the request synchronously."
addedOn: 2026-09-25
