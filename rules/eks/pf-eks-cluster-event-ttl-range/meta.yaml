id: pf-eks-cluster-event-ttl-range
service: eks
benchRegion: us-east-1
resourceTypes: [AWS::EKS::Cluster]
severity: ERROR
title: "KubeApiServerConfig.EventTtl must be between 10m and 60m"
constraintSource: https://docs.aws.amazon.com/eks/latest/userguide/control-plane-parameters.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-11-16 us-east-1: EventTtl 9m -> \"kubeApiServerConfig.eventTtl value '9m' is below minimum '10m'.\" (ROLLBACK_COMPLETE); probe with only the 61m cluster -> \"kubeApiServerConfig.eventTtl value '61m' exceeds maximum '60m'.\" (ROLLBACK_COMPLETE); pass 10m and 60m -> CREATE_COMPLETE (standard tier, deleted)."
  expect: "kubeApiServerConfig.eventTtl value '9m' is below minimum '10m'"
addedOn: 2026-11-16
