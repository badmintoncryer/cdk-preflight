id: pf-eks-idp-groups-prefix-system
service: eks
resourceTypes: [AWS::EKS::IdentityProviderConfig]
benchRegion: us-east-1
severity: ERROR
title: "Oidc.GroupsPrefix cannot be the reserved system: prefix"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-eks-identityproviderconfig-oidcidentityproviderconfig.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: Oidc.GroupsPrefix \"system:\" -> ROLLBACK_COMPLETE, \"The prefix system: is reserved for Kubernetes system use\" (HandlerErrorCode: InvalidRequest). Both prefixes report the same sentence, so the rules are told apart by the property they read, not by the message. Only the exact \"system:\" is claimed - whether \"system:foo\" is refused too was not measured. fail-only, and the fixture builds its own EKS cluster: AssociateIdentityProviderConfig reads this only after it has found the cluster, so a fixture pointing at a literal probe cluster would go INCONCLUSIVE the day that cluster is deleted."
addedOn: 2026-09-25
