id: pf-xray-samplingrule-name-or-arn-required
service: xray
benchRegion: us-east-1
resourceTypes: [AWS::XRay::SamplingRule]
severity: ERROR
title: "SamplingRule must set RuleName or RuleARN"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-xray-samplingrule-samplingrule.html
upstream: none
repro:
  method: real-deploy
  evidence: "api-probe 2026-09-24 us-east-1: CreateSamplingRule without ruleName or ruleARN -> \"(InvalidRequestException) ... Request must contain either sampling rule name or sampling rule ARN\" (#71 phase B); bench 2026-09-24 us-east-1: fail (SamplingRule with neither) -> \"Invalid request provided: CreateSamplingRuleRequest(SamplingRule=SamplingRule(ResourceARN=*, Priority=9002, FixedRate=0.05, ...))\" (HandlerErrorCode: InvalidRequest, ROLLBACK_COMPLETE); pass (RuleName pfxr-namereq-p) -> CREATE_COMPLETE. Confounder: the handler echoes the request but drops the service reason text, so the quoted wording comes from the direct API call.; omission bench 2026-11-26 us-east-1: pass template without AWS::XRay::SamplingRule.SamplingRule.RuleName (the same shape as the fail template) -> ROLLBACK_COMPLETE with the same InvalidRequest echo of a CreateSamplingRuleRequest that carries neither RuleName nor RuleARN; the API names the cause (\"Request must contain either sampling rule name or sampling rule ARN\", api-probe above)"
  expect: "CreateSamplingRuleRequest(SamplingRule=SamplingRule(ResourceARN=*, Priority=9002, FixedRate=0.05"
addedOn: 2026-09-24
omissionFails:
  - "AWS::XRay::SamplingRule.SamplingRule.RuleName"
