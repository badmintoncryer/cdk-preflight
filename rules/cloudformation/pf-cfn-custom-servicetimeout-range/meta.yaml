id: pf-cfn-custom-servicetimeout-range
service: cloudformation
benchRegion: us-east-1
resourceTypes: ["*"]
severity: ERROR
title: "A custom resource's ServiceTimeout must be between 1 and 14400 seconds"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudformation-customresource.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: ServiceTimeout \"0\" and \"14401\" on AWS::CloudFormation::CustomResource -> \"ServiceTimeout must be an integer between 1 and 14400 seconds\" (ROLLBACK_COMPLETE); the same fixture with ServiceTimeout \"14400\" and an inline Lambda that answers the custom-resource request -> CREATE_COMPLETE. The documented ceiling of 3600 is wrong - 3601 and 14400 are both accepted (measured the same day)."
addedOn: 2026-09-25
