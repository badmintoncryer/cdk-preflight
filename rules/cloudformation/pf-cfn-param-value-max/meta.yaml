id: pf-cfn-param-value-max
service: cloudformation
benchRegion: us-east-1
resourceTypes: ["*"]
severity: ERROR
title: "A parameter default may be at most 4096 characters"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cloudformation-limits.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-27 us-east-1: a 4097-character parameter Default -> CreateStack rejected synchronously (API_REJECTED): \"Template format error: Parameter 'P' default value '<the whole 4097-character value, echoed back>' length is greater than 4096.\"; the same template with a 4096-character Default -> CREATE_COMPLETE."
  expect: "length is greater than 4096"
addedOn: 2026-09-25
