id: pf-cfn-param-value-max
service: cloudformation
benchRegion: us-east-1
resourceTypes: ["*"]
severity: ERROR
title: "A parameter default may be at most 4096 characters"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cloudformation-limits.html
upstream: none
repro:
  method: real-deploy
  expectApiError: "length is greater than 4096"
  evidence: "CreateStack 2026-09-25 us-east-1 (issue #73 phase B): a 4097-character Default -> An error occurred (ValidationError) when calling the CreateStack operation: Template format error: Parameter 'P' default value '<the whole 4097-character value, echoed back>' length is greater than 4096. The same template with a 4096-character Default was accepted."
addedOn: 2026-09-25
