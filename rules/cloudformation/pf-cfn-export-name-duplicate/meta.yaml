id: pf-cfn-export-name-duplicate
service: cloudformation
benchRegion: us-east-1
resourceTypes: ["*"]
severity: ERROR
title: "Two outputs in one template may not share an export name"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/outputs-section-structure.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-27 us-east-1: two Outputs both exporting cdkpf73-dup-f -> CreateStack rejected synchronously (API_REJECTED): \"Template format error: The Outputs section contains duplicate Export names: [cdkpf73-dup-f]. Specify a unique name for each export.\"; the same Outputs exporting cdkpf73-dup-p1 and cdkpf73-dup-p2 -> CREATE_COMPLETE. CreateChangeSet returns the identical message (hand-run 2026-09-25)."
  expect: "contains duplicate Export names"
addedOn: 2026-09-25
