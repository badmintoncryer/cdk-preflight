id: pf-cfn-stackset-deploymenttargets-ou-servicemanaged
service: cloudformation
benchRegion: us-east-1
resourceTypes: ["AWS::CloudFormation::StackSet"]
severity: ERROR
title: "OrganizationalUnitIds targets require PermissionModel: SERVICE_MANAGED"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-cloudformation-stackset-deploymenttargets.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: a StackInstancesGroup targeting OrganizationalUnitIds on a SELF_MANAGED stack set -> \"Resource handler returned message: \\\"StackSets with SELF_MANAGED permission model can only have accounts as target (Service: CloudFormation, Status Code: 400)\\\" (HandlerErrorCode: InvalidRequest)\". The stack ends ROLLBACK_FAILED (the delete handler re-validates); the pass fixture deploys CREATE_COMPLETE."
addedOn: 2026-09-25
