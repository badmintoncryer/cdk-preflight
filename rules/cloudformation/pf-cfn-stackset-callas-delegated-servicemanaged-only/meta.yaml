id: pf-cfn-stackset-callas-delegated-servicemanaged-only
service: cloudformation
benchRegion: us-east-1
resourceTypes: ["AWS::CloudFormation::StackSet"]
severity: ERROR
title: "CallAs: DELEGATED_ADMIN requires PermissionModel: SERVICE_MANAGED"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudformation-stackset.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: CallAs DELEGATED_ADMIN with PermissionModel SELF_MANAGED -> \"Resource handler returned message: \\\"You can only operate on SERVICE_MANAGED StackSets as a delegated administrator (Service: CloudFormation, Status Code: 400)\\\" (HandlerErrorCode: InvalidRequest)\"; the same stack set with CallAs SELF -> CREATE_COMPLETE."
addedOn: 2026-09-25
