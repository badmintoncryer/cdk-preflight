id: pf-cfn-export-name-charset
service: cloudformation
benchRegion: us-east-1
resourceTypes: ["*"]
severity: ERROR
title: "Export names may use only alphanumerics, colons and hyphens"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/outputs-section-structure.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-27 us-east-1: Export.Name \"cdkpf73-charset_f\" (an underscore) -> CreateStack rejected synchronously (API_REJECTED): \"Template format error: Output A is malformed. The Name field of every Export member must be specified and consist only of alphanumeric characters, colons, or hyphens.\"; the same Output exporting cdkpf73-charset-p -> CREATE_COMPLETE."
  expect: "consist only of alphanumeric characters, colons, or hyphens"
addedOn: 2026-09-25
