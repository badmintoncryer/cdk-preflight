id: pf-cfn-export-name-max
service: cloudformation
benchRegion: us-east-1
resourceTypes: ["*"]
severity: ERROR
title: "An export name may be at most 256 characters"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/outputs-section-structure.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-27 us-east-1: a 257-character Export.Name -> CreateStack rejected synchronously (API_REJECTED): \"Template format error: Output A is malformed. The Name field of every Export member must not be longer than 256 characters.\"; the same Output with a 256-character name -> CREATE_COMPLETE, so the limit is 256, not the 255 the user guide limits page implies."
  expect: "must not be longer than 256 characters"
addedOn: 2026-09-25
