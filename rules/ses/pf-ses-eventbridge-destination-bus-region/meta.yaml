id: pf-ses-eventbridge-destination-bus-region
service: ses
benchRegion: us-east-1
resourceTypes: [AWS::SES::ConfigurationSetEventDestination]
severity: ERROR
title: "An EventBridge event destination must be in the deployment Region"
constraintSource: https://docs.aws.amazon.com/ses/latest/dg/regions.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-24 us-east-1: fail template (the default bus of eu-west-1) -> ROLLBACK_COMPLETE with \"Invalid Event Bridge destination, must be in region <us-east-1>.\"; pass template (default bus of the deployment Region) -> CREATE_COMPLETE. The fail fixture names the *default* bus of the other Region on purpose: a custom bus elsewhere would violate two rules at once. api 2026-09-24 us-east-1: the region check precedes both the default-bus check and the cross-account check."
addedOn: 2026-09-24
