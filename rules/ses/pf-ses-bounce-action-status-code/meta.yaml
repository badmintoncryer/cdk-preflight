id: pf-ses-bounce-action-status-code
service: ses
benchRegion: us-east-1
resourceTypes: [AWS::SES::ReceiptRule]
severity: ERROR
title: "A bounce action's StatusCode must be 4.x.y or 5.x.y with a single-digit subject and detail"
constraintSource: https://docs.aws.amazon.com/ses/latest/APIReference/API_BounceAction.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-24 us-east-1 (--fail-only): fail template (StatusCode \"9.9\" and \"5.10.1\") -> ROLLBACK_COMPLETE with \"Invalid status code: 9.9 (Service: Ses, Status Code: 400)\". api 2026-09-24 us-east-1 pins the shape to 4.x.y / 5.x.y with a single-digit subject and detail: 2.0.0, 5.1, 5.1.1.1, 5.10.1, 5.1.10, 5.7.26, 5.7.99, 4.7.26, 9.9 and 10.1.1 are rejected with the same sentence while 4.4.7, 5.1.1 and 5.9.9 return 200 - note 5.7.26 is a real RFC 3463 code that SES does not take, so the single-digit reading is the service's, not RFC 3463's. Verified fail-only for the same reason as pf-ses-bounce-action-smtp-reply-code, and the code is likewise checked before the sender."
addedOn: 2026-09-24
