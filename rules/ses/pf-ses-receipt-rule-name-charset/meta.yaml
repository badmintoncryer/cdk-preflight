id: pf-ses-receipt-rule-name-charset
service: ses
benchRegion: us-east-1
resourceTypes: [AWS::SES::ReceiptRule]
severity: ERROR
title: "A receipt rule's name takes only letters, digits, underscores, dashes and periods"
constraintSource: https://docs.aws.amazon.com/ses/latest/APIReference/API_ReceiptRule.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-24 us-east-1: fail template (Rule.Name \"-pf-ses-rule-charset\") -> ROLLBACK_FAILED with \"Not a valid ruleName: -pf-ses-rule-charset (Service: Ses, Status Code: 400)\" - the rollback cannot delete a rule that was never created, so the stack is removed with the resource retained and nothing is left in SES. pass template (Rule.Name \"pf-ses-rule.charset\", a period in the middle) -> CREATE_COMPLETE. api 2026-09-24 us-east-1 pins both ends of the name: \"pf-e-\" (trailing dash) and \"_pfe\" (leading underscore) are rejected with the same sentence. The charset half is the service front door, not this rule: \"pf+c2rule\", \"pf~c2rule\" and \"pf:c2rule\" fail earlier with \"Value at 'rule.name' failed to satisfy constraint: Member must satisfy regular expression pattern\"; what only this rule sees is the start/end-alphanumeric check behind it. Unlike a rule set name, the doc here does list periods and \"pf-ses-rule.charset\" deploys."
addedOn: 2026-09-24
