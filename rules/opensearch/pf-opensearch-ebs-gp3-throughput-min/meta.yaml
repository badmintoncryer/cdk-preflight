id: pf-opensearch-ebs-gp3-throughput-min
service: opensearch
benchRegion: us-east-1
resourceTypes: [AWS::OpenSearchService::Domain]
severity: ERROR
title: "gp3 volumes start at 125 MiB/s of throughput"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-opensearchservice-domain-ebsoptions.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail (gp3 10 GiB with Throughput 124 on t3.small.search) -> \"Throughput must be between 125 and 260\" (ROLLBACK_COMPLETE); pass (the same volume at 125) not deployed (--fail-only), but the identical scaffold at 125 reached CREATE_COMPLETE under pf-opensearch-ebs-gp3-iops-min. The upper end is the instance type's; only the floor is shared by every type."
addedOn: 2026-09-25
