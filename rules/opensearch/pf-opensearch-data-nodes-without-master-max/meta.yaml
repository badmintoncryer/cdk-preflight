  evidence: "bench 2026-09-25 us-east-1: fail (InstanceCount 11 on m6g.large.search with no dedicated master) -> \"Dedicated master instances must be enabled for domains with more than 10 instance count.\" (ROLLBACK_COMPLETE); pass (the same template at 10) not deployed (--fail-only; 10 m6g.large data nodes would be the most expensive stack in the slice). m6g rather than t3 on purpose: T2/T3 have their own 10-data-node cap with a different message."
