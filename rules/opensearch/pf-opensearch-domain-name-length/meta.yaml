id: pf-opensearch-domain-name-length
service: opensearch
benchRegion: us-east-1
resourceTypes: [AWS::OpenSearchService::Domain]
severity: ERROR
title: "DomainName is at most 28 characters"
constraintSource: https://docs.aws.amazon.com/opensearch-service/latest/APIReference/API_CreateDomain.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail (DomainName 'pf-probe-domain-name-01234567', 29 characters) -> \"Value 'pf-probe-domain-name-01234567' at 'domainName' failed to satisfy constraint: Member must have length less than or equal to 28\" (ROLLBACK_COMPLETE); pass (the same name at 28) not deployed (--fail-only). Only the upper bound is here: the documented lower bound of 3 is stopped client-side by botocore and has never been seen from the service."
addedOn: 2026-09-25
