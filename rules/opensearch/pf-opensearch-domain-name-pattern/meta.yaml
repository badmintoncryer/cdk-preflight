id: pf-opensearch-domain-name-pattern
service: opensearch
benchRegion: us-east-1
resourceTypes: [AWS::OpenSearchService::Domain]
severity: ERROR
title: "DomainName is lower-case letters, digits and hyphens"
constraintSource: https://docs.aws.amazon.com/opensearch-service/latest/APIReference/API_CreateDomain.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail (DomainName 'PF-Probe-Domain') -> \"Value 'PF-Probe-Domain' at 'domainName' failed to satisfy constraint: Member must satisfy regular expression pattern: [a-z][a-z0-9\\\\-]+\" (ROLLBACK_COMPLETE); pass ('pf-probe-domain') not deployed (--fail-only). The bundled engine's schema carries neither the pattern nor the length, so both templates are clean under the duplicate guard."
addedOn: 2026-09-25
