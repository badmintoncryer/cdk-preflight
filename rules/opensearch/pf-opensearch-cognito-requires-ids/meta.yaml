resourceTypes: [AWS::OpenSearchService::Domain]
severity: ERROR
title: "Cognito authentication needs RoleArn, UserPoolId and IdentityPoolId"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-opensearchservice-domain-cognitooptions.html
