id: pf-opensearch-cognito-role-arn-account
service: opensearch
benchRegion: us-east-1
resourceTypes: [AWS::OpenSearchService::Domain]
severity: ERROR
title: "The Cognito access role must be in the deploying account"
constraintSource: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cognito-auth.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail (RoleArn in account 999999999999, both pool ids in the deploy Region) -> \"Cross-account pass role is not allowed.\" (ROLLBACK_COMPLETE); pass not deployed (--fail-only: an OpenSearch domain takes 15-25 min to build and the constraint is answered by CreateDomain's synchronous validation), but the base scaffold the pass fixture shares - t3.small.search x1, gp3 10 GiB / 3000 IOPS / 125 MiB/s, OpenSearch_2.19 - reached CREATE_COMPLETE the same day under pf-opensearch-ebs-gp3-iops-min. The account check runs before the pool-Region check, so a fixture for any other Cognito rule has to carry a same-account role."
addedOn: 2026-09-25
