  evidence: "bench 2026-09-24 us-west-2: fail -> Resource handler returned message: \"FromPort should be less than or equal to ToPort (Service: AWSGlobalAccelerator; Status Code: 400; Error Code: InvalidPortRangeException; Request ID: a0419899-ebe5-4eb6-94b1-b98f4e28edba; Proxy: null)\" (RequestToken: db1c19d3-7ad1-9001-d267-db1e031d5834, HandlerErrorCode: GeneralServiceException) (ROLLBACK_COMPLETE); pass -> CREATE_COMPLETE. fail FromPort 81 / ToPort 80 (one over the limit); pass 80 / 80 (the limit itself, a single-port range)."
