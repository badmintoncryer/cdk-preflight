repro:
  method: real-deploy
  evidence: "bench 2026-09-12 us-east-1: a scheduling policy ARN in eu-west-1 -> \"SchedulingPolicy arn:aws:batch:eu-west-1:214794239830:scheduling-policy/pf-sp not found.\" (ROLLBACK_COMPLETE); pass template CREATE_COMPLETE. The message quotes the cross-region ARN back, but a policy that is simply absent in-region reports the same way."
