id: pf-batch-ce-vcpus-order
service: batch
resourceTypes: [AWS::Batch::ComputeEnvironment]
severity: ERROR
title: MaxvCpus must be at least MinvCpus
constraintSource: https://docs.aws.amazon.com/batch/latest/APIReference/API_CreateComputeEnvironment.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: MaxvCpus 4 with MinvCpus 5 -> \"maxvCpus should be greater than or equal to minvCpus.\" (ROLLBACK_COMPLETE); pass MaxvCpus 4 with MinvCpus 4 -> CREATE_COMPLETE, so equal is the limit."
addedOn: 2026-09-03
