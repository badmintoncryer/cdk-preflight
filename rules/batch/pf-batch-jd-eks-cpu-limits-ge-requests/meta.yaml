id: pf-batch-jd-eks-cpu-limits-ge-requests
service: batch
resourceTypes: [AWS::Batch::JobDefinition]
benchRegion: us-east-1
severity: ERROR
title: A cpu request must not exceed the cpu limit
constraintSource: https://docs.aws.amazon.com/batch/latest/APIReference/API_EksContainerResourceRequirements.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: cpu request 2 against cpu limit 1 -> \"cpu request must be <= to cpu limit if both are provided.\" (ROLLBACK_COMPLETE); pass request 1 against limit 1 -> CREATE_COMPLETE. The pass carried no request at all before, so the limit was never exercised."
addedOn: 2026-09-12
