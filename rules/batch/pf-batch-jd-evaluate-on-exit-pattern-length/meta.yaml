id: pf-batch-jd-evaluate-on-exit-pattern-length
service: batch
resourceTypes: [AWS::Batch::JobDefinition]
severity: ERROR
title: EvaluateOnExit conditions are limited to 512 characters
constraintSource: https://docs.aws.amazon.com/batch/latest/APIReference/API_EvaluateOnExit.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a 513-character OnStatusReason -> \"Evaluate on exit condition cannot exceed 512 characters.\" (ROLLBACK_COMPLETE); pass 512 characters -> CREATE_COMPLETE"
addedOn: 2026-09-12
