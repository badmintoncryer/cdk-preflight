id: pf-batch-sp-quota-share-idle-strategy-value
service: batch
resourceTypes: [AWS::Batch::SchedulingPolicy]
benchRegion: us-east-1
severity: ERROR
title: QuotaSharePolicy.IdleResourceAssignmentStrategy must be FIFO
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-batch-schedulingpolicy-quotasharepolicy.html
upstream: cfn-schema
repro:
  method: real-deploy
  evidence: "bench 2026-09-12 us-east-1: IdleResourceAssignmentStrategy LIFO -> rollback on CloudFormation early validation (\"Validation failed with 1 error(s). Call DescribeEvents ...\"), while the same template with FIFO reaches CREATE_COMPLETE, so the value is the only difference. The service names the constraint on the API: CreateSchedulingPolicy 2026-09-10 \"Idle resource assignment strategy must be one of [FIFO].\" The bundled engine does not know the enum (checked clean). bench 2026-11-27 us-east-1: fail template -> ROLLBACK_COMPLETE with \"Validation failed with 1 error(s). Call DescribeEvents to retrieve the full list of issues with resource and property details, resolve each error, then retry the operation. [DescribeEvents: PROPERTY_VALIDATION Main /Resources/Main/Properties/QuotaSharePolicy/IdleResourceAssignmentStrategy: LIFO is not a valid enum value. Supported values: [FIFO]]\""
  expect: "QuotaSharePolicy/IdleResourceAssignmentStrategy: LIFO is not a valid enum value"
addedOn: 2026-09-12
