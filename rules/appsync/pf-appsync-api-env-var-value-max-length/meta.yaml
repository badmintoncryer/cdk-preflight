id: pf-appsync-api-env-var-value-max-length
service: appsync
resourceTypes: [AWS::AppSync::GraphQLApi]
benchRegion: us-east-1
severity: ERROR
title: Environment variable values are at most 512 characters
constraintSource: https://docs.aws.amazon.com/appsync/latest/APIReference/API_PutGraphqlApiEnvironmentVariables.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a 513 character value -> \"Property validation failure: [Value for property {/EnvironmentVariables/AB} does not match pattern {.{0,512}}]\" ROLLBACK_COMPLETE; pass a 512 character value -> CREATE_COMPLETE. CloudFormation rejects this one from the registry schema pattern, but the bundled engine copy does not carry it (the bare engine is clean on 513), so the rule is not a duplicate."
addedOn: 2026-09-12
