id: pf-appsync-source-api-merge-type-value
service: appsync
resourceTypes: [AWS::AppSync::SourceApiAssociation]
benchRegion: us-east-1
severity: ERROR
title: MergeType is AUTO_MERGE or MANUAL_MERGE
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-appsync-sourceapiassociation-sourceapiassociationconfig.html
upstream: cfn-schema
repro:
  method: real-deploy
  evidence: "real-deploy 2026-09-12 us-east-1: CREATE_FAILED \"Validation failed with 1 error(s)\"; the change set names the check as [AWS::EarlyValidation::PropertyValidation] — CloudFormation rejects MergeType: AUTOMERGE before the resource is created, but does not print the property. Valid values are AUTO_MERGE and MANUAL_MERGE. bench 2026-11-27 us-east-1: fail template -> ROLLBACK_COMPLETE with \"Validation failed with 1 error(s). Call DescribeEvents to retrieve the full list of issues with resource and property details, resolve each error, then retry the operation. [DescribeEvents: PROPERTY_VALIDATION Target /Resources/Target/Properties/SourceApiAssociationConfig/MergeType: AUTOMERGE is not a valid enum value. Supported values: [AUTO_MERGE, MANUAL_MERGE]]\""
  expect: "SourceApiAssociationConfig/MergeType: AUTOMERGE is not a valid enum value"
addedOn: 2026-09-12
