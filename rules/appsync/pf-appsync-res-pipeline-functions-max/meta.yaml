id: pf-appsync-res-pipeline-functions-max
service: appsync
resourceTypes: [AWS::AppSync::Resolver]
benchRegion: us-east-1
severity: ERROR
title: A pipeline runs at most 10 functions
constraintSource: https://docs.aws.amazon.com/general/latest/gr/appsync.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: 11 functions -> \"A resolver can only be composed of 10 functions.\" ROLLBACK_COMPLETE; pass 10 real AWS::AppSync::FunctionConfiguration resources -> CREATE_COMPLETE. The count is checked before the function ids are resolved, which is why the fail template can list placeholder ids."
addedOn: 2026-09-12
