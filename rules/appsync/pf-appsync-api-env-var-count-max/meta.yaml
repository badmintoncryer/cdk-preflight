id: pf-appsync-api-env-var-count-max
service: appsync
resourceTypes: [AWS::AppSync::GraphQLApi]
benchRegion: us-east-1
severity: ERROR
title: An API carries at most 50 environment variables
constraintSource: https://docs.aws.amazon.com/appsync/latest/APIReference/API_PutGraphqlApiEnvironmentVariables.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: 51 environment variables -> \"1 validation error detected: Value '{K40=v, ...}' at 'environmentVariables' failed to satisfy constraint: Member must have length less than or equal to 50\" ROLLBACK_COMPLETE; pass 50 -> CREATE_COMPLETE. The bare engine is clean on 51, so the bundled schema carries no maxProperties for this map."
addedOn: 2026-09-12
