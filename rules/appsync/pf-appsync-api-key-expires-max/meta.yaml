id: pf-appsync-api-key-expires-max
service: appsync
resourceTypes: [AWS::AppSync::ApiKey]
benchRegion: us-east-1
severity: ERROR
title: An API key expires at most 365 days out
constraintSource: https://docs.aws.amazon.com/appsync/latest/APIReference/API_CreateApiKey.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: Expires 100000000001 (the year 5138 in seconds, i.e. epoch milliseconds by mistake) -> \"API key can be valid for a maximum of 365 days.\" ROLLBACK_COMPLETE; pass without Expires (the API default of 7 days) -> CREATE_COMPLETE. The real cap is 365 days from the deploy, which no fixed value in a template can sit on and the engine has no clock, so the rule only judges values that are over the cap whatever the deploy date."
addedOn: 2026-09-12
