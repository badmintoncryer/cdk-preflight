id: pf-secretsmanager-rotation-rules
service: secretsmanager
resourceTypes: [AWS::SecretsManager::RotationSchedule]
severity: ERROR
title: "RotationRules: AutomaticallyAfterDays (1..1000) or ScheduleExpression, not both; rate() every 4..23 hours or 1..1000 days; cron() with 6 fields, minute 0, year *, one of day-of-month/day-of-week ?, and hours at least 4 apart; Duration Nh in 1..24 that fits the rotation interval and the UTC day"
constraintSource: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_schedule.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: cron(0 1 ? * SUN *) with Duration 24h (1 + 24 = 25 hours) -> \"Starting hour and duration must be within a day.\" ROLLBACK_COMPLETE (the chained secrets carry Duration 25h and rate(3 hours)); pass cron(0 0 ? * SUN *) with Duration 24h (exactly 24) and rate(4 hours) -> CREATE_COMPLETE. The window and the hourly rate each have their own floor and ceiling, so the fail template carries one secret per end."
addedOn: 2026-09-05
