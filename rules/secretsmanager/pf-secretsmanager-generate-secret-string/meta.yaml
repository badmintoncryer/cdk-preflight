id: pf-secretsmanager-generate-secret-string
service: secretsmanager
resourceTypes: [AWS::SecretsManager::Secret]
severity: ERROR
title: "GenerateSecretString must leave at least one character type, a PasswordLength (1..4096) that fits every required type, ExcludeCharacters under 4096 chars that does not wipe out a required type, and SecretStringTemplate (a JSON object) together with GenerateStringKey"
constraintSource: https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetRandomPassword.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: PasswordLength 4097 -> \"1 validation error detected: Value '4097' at 'passwordLength' failed to satisfy constraint: Member must have value less than or equal to 4096\" ROLLBACK_COMPLETE (the chained secrets carry a 4097 character ExcludeCharacters and a PasswordLength of 3 with four required character types); pass 4096 and a 4096 character ExcludeCharacters -> CREATE_COMPLETE. api 2026-09-13 us-east-1 GetRandomPassword: 4097 and a 4097 character ExcludeCharacters are both rejected, 4096 is accepted for both."
addedOn: 2026-09-05
