id: pf-apigwv2-http-route-selection
service: apigatewayv2
resourceTypes: [AWS::ApiGatewayV2::Api]
severity: ERROR
title: HTTP APIs accept only the method-path route selection expression
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-apigatewayv2-api.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: ProtocolType HTTP with RouteSelectionExpression \"$request.body.action\" (v02) -> 'Route selection expression is currently limited to \"${request.method} ${request.path}\"'. ROLLBACK_COMPLETE. The ${...} spelling itself deployed CREATE_COMPLETE (v02b), so both spellings are allowed."
addedOn: 2026-09-03
