  evidence: "bench 2026-09-03 ap-northeast-1: REQUEST authorizer on an HTTP API without AuthorizerPayloadFormatVersion (v07) -> \"AuthorizerPayloadFormatVersion is a required parameter for REQUEST authorizer\". ROLLBACK_COMPLETE. WebSocket REQUEST authorizers do not take the property, hence the HTTP guard."
