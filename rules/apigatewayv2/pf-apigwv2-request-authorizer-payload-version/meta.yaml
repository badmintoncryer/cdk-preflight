resourceTypes: [AWS::ApiGatewayV2::Authorizer]
severity: ERROR
title: REQUEST authorizers on HTTP APIs need AuthorizerPayloadFormatVersion
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-apigatewayv2-authorizer.html
upstream: none
repro:
