id: pf-apigwv2-http-route-key
service: apigatewayv2
resourceTypes: [AWS::ApiGatewayV2::Route]
severity: ERROR
title: HTTP API route keys are "METHOD /path" or $default
constraintSource: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-develop-routes.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: RouteKey \"BADVERB /items\" (v03) and \"TRACE /items\" (v03b) on an HTTP API -> 'The provided route key is not formatted properly for HTTP protocol. Format should be \"[HTTP METHOD] /[RESOURCE PATH]\" or \"$default\"'. Both ROLLBACK_COMPLETE (TRACE proves the method set excludes it)."
addedOn: 2026-09-03
