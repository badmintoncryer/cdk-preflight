id: pf-apigwv2-response-parameter-status-code
service: apigatewayv2
benchRegion: us-east-1
resourceTypes: [AWS::ApiGatewayV2::Integration]
severity: ERROR
title: "Response parameter mappings are keyed by a 200-599 status"
constraintSource: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-parameter-mapping.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: ResponseParameters keyed by 199 and 600 -> \"Invalid mapping expression specified: Validation Result: warnings : [], errors : [Status Code 199 is not valid.]\" (ROLLBACK_COMPLETE; the service reports the first key it rejects, so the 600 end stays hidden behind it); pass keyed by 200 and 599 -> CREATE_COMPLETE."
addedOn: 2026-09-08
