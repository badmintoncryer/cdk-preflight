    basis: deploy
    source: "rules/eks/pf-eks-cluster-automode-all-three/meta.yaml repro.evidence: bench 2026-09-25 us-east-1, ComputeConfig.Enabled true with ElasticLoadBalancing and BlockStorage omitted -> \"... all either fully enabled or fully disabled.\" (the omitted flags were read as disabled)"

