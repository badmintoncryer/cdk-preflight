# 省略時の値の台帳。ルールが「このプロパティを省略したら、サービスはこの値として扱う」と読むのは、
# ここに出典付きで書いた値だけ。ルール本体は object.get の既定値にサービスの値を直書きせず
# （scripts/lint-rules.ts が禁止）、`_pf_default("<owner>", "<key>")` でここを引く。
# 台帳に無い値は未定義なので、省略されたプロパティについてルールは判定しない。
#
#   <owner>:            ルール id、または _lib/<name>（呼び出し元のモジュール自身）
#     <key>:            プロパティ（入れ子は . 区切り。ルールの中で一意なら名前は自由）
#       value:          省略時にサービスが使う値
#       basis:          deploy（実機で確かめた）| docs（AWS のドキュメントに書いてある）| test
#       source:         出典。deploy は証拠の場所、docs は URL と該当の一文
#
# scripts/bundle-rules.ts が、宣言の無い呼び出しと、どこからも読まれない宣言を拒否する。

"_lib/cloudtrail":
  "IncludeManagementEvents":
    value: true
    basis: docs
    source: "https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-cloudtrail-trail-eventselector.html: \"By default, the value is true.\""

