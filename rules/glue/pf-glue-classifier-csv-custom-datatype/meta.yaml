id: pf-glue-classifier-csv-custom-datatype
service: glue
resourceTypes: [AWS::Glue::Classifier]
benchRegion: us-east-1
severity: ERROR
title: Custom CSV datatypes come from the supported set
constraintSource: https://docs.aws.amazon.com/glue/latest/dg/custom-classifier.html
upstream: pending-engine
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail template (ContainsCustomDatatype [\"UUID\"]) -> \"The following types are invalid: UUID\" (ROLLBACK_COMPLETE); pass template (ContainsCustomDatatype [\"STRING\"]) -> CREATE_COMPLETE. CreateClassifier probes the same day accepted all eleven Glue datatypes and the lowercase spelling \"string\", and rejected the SQL spellings BIGINT, TINYINT, SMALLINT, INTEGER, CHAR and VARCHAR by name."
addedOn: 2026-09-14
