id: pf-glue-ml-transform-worker-type-and-number-of-workers
service: glue
resourceTypes: [AWS::Glue::MLTransform]
benchRegion: us-east-1
severity: ERROR
title: MLTransform WorkerType and NumberOfWorkers have to be set together
constraintSource: https://docs.aws.amazon.com/glue/latest/dg/machine-learning.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail template (one transform with WorkerType only and one with NumberOfWorkers only) -> \"Both WorkerType and NumberOfWorkers should be set\" (ROLLBACK_COMPLETE; the stack reports the first failing resource, and CreateMLTransform gives the same sentence for the other half); pass template (both set) -> CREATE_COMPLETE; omission bench 2026-11-26 us-east-1: pass template without AWS::Glue::MLTransform.WorkerType -> ROLLBACK_COMPLETE with \"Both WorkerType and NumberOfWorkers should be set\"; omission bench 2026-11-26 us-east-1: pass template without AWS::Glue::MLTransform.NumberOfWorkers -> ROLLBACK_COMPLETE with \"Both WorkerType and NumberOfWorkers should be set\""
  expect: "Both WorkerType and NumberOfWorkers should be set"
addedOn: 2026-09-14
omissionFails:
  - "AWS::Glue::MLTransform.WorkerType"
  - "AWS::Glue::MLTransform.NumberOfWorkers"
