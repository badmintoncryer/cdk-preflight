id: pf-glue-user-defined-function-resource-uri-type
service: glue
resourceTypes: [AWS::Glue::UserDefinedFunction]
benchRegion: us-east-1
severity: ERROR
title: A function ResourceUri needs a ResourceType of JAR, FILE or ARCHIVE
constraintSource: https://docs.aws.amazon.com/glue/latest/webapi/API_UserDefinedFunctionInput.html
upstream: cfn-schema
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail template (ResourceUris entry with ResourceType LIB) -> ROLLBACK_COMPLETE at CloudFormation's early property validation (\"Validation failed with 1 error(s)\", the registry schema carries the enum); pass template (ResourceType JAR) -> CREATE_COMPLETE. The service sentence was measured with CreateUserDefinedFunction the same day: LIB -> \"Resource Type is not valid\", JAR and ARCHIVE accepted."
addedOn: 2026-09-14
