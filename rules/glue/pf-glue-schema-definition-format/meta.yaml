id: pf-glue-schema-definition-format
service: glue
resourceTypes: [AWS::Glue::Schema]
benchRegion: us-east-1
severity: ERROR
title: SchemaDefinition must parse as the declared DataFormat
constraintSource: https://docs.aws.amazon.com/glue/latest/dg/schema-registry.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail template (AVRO schema with SchemaDefinition {\"type\":\"record\" and a second AVRO schema with {\"type\":\"record\"}) -> \"Schema definition of AVRO data format is invalid: Unexpected end-of-input: expected close marker for Object\" (ROLLBACK_COMPLETE; the stack reports the first failing resource); pass template (a named AVRO record) -> CREATE_COMPLETE. CreateSchema the same day answers the no-name half with \"Schema definition of AVRO data format is invalid: No name in schema: {\\\"type\\\":\\\"record\\\"}\", and a JSON-format schema with broken JSON with \"Schema definition of JSON data format is invalid\"."
addedOn: 2026-09-14
