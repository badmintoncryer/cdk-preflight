id: pf-glue-connection-required-properties
service: glue
resourceTypes: [AWS::Glue::Connection]
benchRegion: us-east-1
severity: ERROR
title: Each connection type needs its own ConnectionProperties entries
constraintSource: https://docs.aws.amazon.com/glue/latest/dg/connection-properties.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail template (JDBC without JDBC_CONNECTION_URL, KAFKA without KAFKA_BOOTSTRAP_SERVERS, MONGODB without CONNECTION_URL, CUSTOM and MARKETPLACE without CONNECTOR_URL) -> \"Validation for connection properties failed\" (ROLLBACK_COMPLETE); pass template (the same five connections with the entry filled in) -> CREATE_COMPLETE. The service answers the same generic sentence for every type, so each entry was attributed with a CreateConnection probe the same day: the complete input is accepted and removing exactly one key flips it to the rejection; omission bench 2026-11-26 us-east-1: pass template without AWS::Glue::Connection.ConnectionInput.ConnectionProperties -> ROLLBACK_COMPLETE with \"ConnectionProperties cannot be null\"; omission bench 2026-11-26 us-east-1: pass template without AWS::Glue::Connection.ConnectionInput.ConnectionProperties.JDBC_CONNECTION_URL -> ROLLBACK_COMPLETE with \"Validation for connection properties failed\"; omission bench 2026-11-26 us-east-1: pass template without AWS::Glue::Connection.ConnectionInput.ConnectionProperties.KAFKA_BOOTSTRAP_SERVERS -> ROLLBACK_COMPLETE with \"Validation for connection properties failed\"; omission bench 2026-11-26 us-east-1: pass template without AWS::Glue::Connection.ConnectionInput.ConnectionProperties.CONNECTION_URL -> ROLLBACK_COMPLETE with \"Validation for connection properties failed\"; omission bench 2026-11-26 us-east-1: pass template without AWS::Glue::Connection.ConnectionInput.ConnectionProperties.CONNECTOR_URL -> ROLLBACK_COMPLETE with \"Validation for connection properties failed\"; omission bench 2026-11-26 us-east-1: pass template without AWS::Glue::Connection.ConnectionInput.ConnectionProperties.CONNECTOR_TYPE -> ROLLBACK_COMPLETE with \"Validation for connection properties failed\"; omission bench 2026-11-26 us-east-1: pass template without AWS::Glue::Connection.ConnectionInput.ConnectionProperties.CONNECTOR_CLASS_NAME -> ROLLBACK_COMPLETE with \"Validation for connection properties failed\""
  expect: "Validation for connection properties failed"
addedOn: 2026-09-14
omissionFails:
  - "AWS::Glue::Connection.ConnectionInput.ConnectionProperties"
  - "AWS::Glue::Connection.ConnectionInput.ConnectionProperties.JDBC_CONNECTION_URL"
  - "AWS::Glue::Connection.ConnectionInput.ConnectionProperties.KAFKA_BOOTSTRAP_SERVERS"
  - "AWS::Glue::Connection.ConnectionInput.ConnectionProperties.CONNECTION_URL"
  - "AWS::Glue::Connection.ConnectionInput.ConnectionProperties.CONNECTOR_URL"
  - "AWS::Glue::Connection.ConnectionInput.ConnectionProperties.CONNECTOR_TYPE"
  - "AWS::Glue::Connection.ConnectionInput.ConnectionProperties.CONNECTOR_CLASS_NAME"
