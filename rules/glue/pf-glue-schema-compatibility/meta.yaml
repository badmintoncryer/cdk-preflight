id: pf-glue-schema-compatibility
service: glue
resourceTypes: [AWS::Glue::Schema]
benchRegion: us-east-1
severity: WARN
title: Schema Compatibility must be one of the seven documented modes
constraintSource: https://docs.aws.amazon.com/glue/latest/dg/schema-registry.html
upstream: cfn-schema
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail template (Compatibility BACKWARDS) -> ROLLBACK_COMPLETE at CloudFormation's early property validation (\"Validation failed with 1 error(s)\", the registry schema carries the enum); pass template (BACKWARD) -> CREATE_COMPLETE. The service sentence was measured with CreateSchema the same day: BACKWARDS -> \"Compatibility is not valid.\", and NONE, DISABLED, FULL and FULL_ALL are all accepted (FULL_ALL is missing from the API reference list). bench 2026-11-27 us-east-1: fail template -> ROLLBACK_COMPLETE with \"Validation failed with 1 error(s). Call DescribeEvents to retrieve the full list of issues with resource and property details, resolve each error, then retry the operation. [DescribeEvents: PROPERTY_VALIDATION Main /Resources/Main/Properties/Compatibility: BACKWARDS is not a valid enum value. Supported values: [NONE, DISABLED, BACKWARD, BACKWARD_ALL, FORWARD, FORWARD_ALL, FULL, FULL_ALL]]\""
  expect: "Compatibility: BACKWARDS is not a valid enum value"
addedOn: 2026-09-14
