id: pf-glue-crawler-event-mode-requires-event-queue
service: glue
resourceTypes: [AWS::Glue::Crawler]
benchRegion: us-east-1
severity: ERROR
title: CRAWL_EVENT_MODE needs an S3 target with EventQueueArn
constraintSource: https://docs.aws.amazon.com/glue/latest/webapi/API_CreateCrawler.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail template (CRAWL_EVENT_MODE, S3 target without EventQueueArn) -> \"Event queue ARN is required when event crawler is selected.\" (ROLLBACK_COMPLETE); pass template (CRAWL_EVERYTHING) -> CREATE_COMPLETE. The positive branch (CRAWL_EVENT_MODE with a real queue) is not deployable on the bench: the crawler role only carries AWSGlueServiceRole and CreateCrawler answers \"SQS queue ... does not exist or the role provided does not have access to it.\" even for a queue that exists (API probe, same day)."
addedOn: 2026-09-14
