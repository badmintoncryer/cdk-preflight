id: pf-glue-custom-entity-type-regex-string-required
service: glue
resourceTypes: [AWS::Glue::CustomEntityType]
benchRegion: us-east-1
severity: ERROR
title: A custom entity type needs a RegexString
constraintSource: https://docs.aws.amazon.com/glue/latest/webapi/API_CreateCustomEntityType.html
upstream: pending-engine
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail template (custom entity type with ContextWords but no RegexString) -> \"1 validation error detected: Value null at 'regexString' failed to satisfy constraint: Member must not be null\" (ROLLBACK_COMPLETE); pass template (RegexString [0-9]{3}) -> CREATE_COMPLETE. The CloudFormation reference documents RegexString as Required: No, and the botocore model already calls it required."
