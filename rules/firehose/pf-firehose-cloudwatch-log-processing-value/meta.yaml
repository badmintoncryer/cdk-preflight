id: pf-firehose-cloudwatch-log-processing-value
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: DataMessageExtraction takes True or False
constraintSource: https://docs.aws.amazon.com/firehose/latest/APIReference/API_ProcessorParameter.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-10 us-east-1 CreateDeliveryStream: DataMessageExtraction \"yes\", and a CloudWatchLogProcessing processor with no parameters at all, both -> InvalidArgumentException \"Invalid parameter value for DataMessageExtraction. Allowed values are True and False.\" Lower case \"true\" is accepted."
addedOn: 2026-09-10
