id: pf-firehose-opensearch-endpoint-exclusive
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: An OpenSearch destination takes a domain ARN or an endpoint, not both
constraintSource: https://docs.aws.amazon.com/firehose/latest/APIReference/API_AmazonopensearchserviceDestinationConfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 ap-northeast-1: Cannot provide both Elasticsearch cluster endpoint and domain ARN. Provide either the cluster endpoint or domain arn. Must specify cluster endpoint for cross account elasticsearch cluster. -> ROLLBACK_COMPLETE. api 2026-09-10 us-east-1 CreateDeliveryStream: DomainARN and ClusterEndpoint together -> InvalidArgumentException \"Cannot provide both Elasticsearch cluster endpoint and domain ARN. Provide either the cluster endpoint or domain arn. Must specify cluster endpoint for cross account elasticsearch cluster.\" The check runs before the domain is looked up."
addedOn: 2026-09-10
