id: pf-firehose-s3-encryption-exclusive
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: S3 encryption takes exactly one configuration
constraintSource: https://docs.aws.amazon.com/firehose/latest/APIReference/API_EncryptionConfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 ap-northeast-1: Exactly one of NoEncryptionConfig or KMSEncryptionConfig must be specified -> ROLLBACK_COMPLETE. api 2026-09-10 us-east-1 CreateDeliveryStream: EncryptionConfiguration with both NoEncryptionConfig and KMSEncryptionConfig -> InvalidArgumentException \"Exactly one of NoEncryptionConfig or KMSEncryptionConfig must be specified\"; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::KinesisFirehose::DeliveryStream.ExtendedS3DestinationConfiguration.EncryptionConfiguration.NoEncryptionConfig -> ROLLBACK_COMPLETE with \"Exactly one of NoEncryptionConfig or KMSEncryptionConfig must be specified\""
  expect: "Exactly one of NoEncryptionConfig or KMSEncryptionConfig must be specified"
addedOn: 2026-09-10
omissionFails:
  - "AWS::KinesisFirehose::DeliveryStream.ExtendedS3DestinationConfiguration.EncryptionConfiguration.NoEncryptionConfig"
