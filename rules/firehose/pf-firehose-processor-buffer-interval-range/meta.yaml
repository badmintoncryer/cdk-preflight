id: pf-firehose-processor-buffer-interval-range
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: A Lambda processor buffers for 0 to 900 seconds
constraintSource: https://docs.aws.amazon.com/firehose/latest/dev/data-transformation.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: BufferIntervalInSeconds 901 -> \"BufferIntervalInSeconds for lambda processor must be between 0 and 900.\" ROLLBACK_COMPLETE; pass 900 and 0 -> CREATE_COMPLETE. api 2026-09-13 us-east-1 CreateDeliveryStream: 901 and -1 are rejected with that message, 900 and 0 are accepted. Both BufferSizeInMBs and BufferIntervalInSeconds have to be present or the create fails first with \"Both BufferSizeInMBs and BufferIntervalInSeconds are required to configure buffering for lambda processor.\" - a fixture that carries only one of them reproduces the wrong error."
addedOn: 2026-09-10
