  evidence: "bench 2026-09-03 ap-northeast-1: DeliveryStreamType KinesisStreamAsSource without KinesisStreamSourceConfiguration (f05) -> \"KinesisSourceStreamConfig is mandatory for KinesisStreamAsSource stream type.\" ROLLBACK_COMPLETE. The reverse is legal: DirectPut WITH a source configuration (even a nonexistent stream arn) deployed CREATE_COMPLETE (f06) - the config is ignored, so no reverse rule."
