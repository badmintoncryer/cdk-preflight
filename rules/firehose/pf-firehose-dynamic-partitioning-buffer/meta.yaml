id: pf-firehose-dynamic-partitioning-buffer
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: Dynamic partitioning needs a 64 MB buffer floor
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-kinesisfirehose-deliverystream-dynamicpartitioningconfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: dynamic partitioning enabled with BufferingHints.SizeInMBs 63 -> \"BufferingHints.SizeInMBs must be at least 64 when Dynamic Partitioning is enabled.\" ROLLBACK_COMPLETE; pass 64 -> CREATE_COMPLETE. api 2026-09-13 us-east-1 CreateDeliveryStream: 63 is rejected with the same message and 64 is accepted. The schema minimum is 1 (the bare engine is clean on 63) - the 64 floor exists only conditionally in the service."
addedOn: 2026-09-03
