id: pf-firehose-bucket-arn-format
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: A destination BucketARN must be an S3 bucket ARN
constraintSource: https://docs.aws.amazon.com/firehose/latest/APIReference/API_ExtendedS3DestinationConfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-10 us-east-1 CreateDeliveryStream: BucketARN \"arn:aws:s3:us-east-1:<account>:<bucket>\" -> ValidationException \"Value at 'extendedS3DestinationConfiguration.bucketARN' failed to satisfy constraint: Member must satisfy regular expression pattern: arn:.*:s3:::[\\\\w\\\\.\\\\-]{1,255}\". The bundled schema carries no pattern for this property."
addedOn: 2026-09-10
