id: pf-firehose-http-buffer-size
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: HTTP endpoint buffering is capped at 64 MB
constraintSource: https://docs.aws.amazon.com/firehose/latest/APIReference/API_HttpEndpointBufferingHints.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: SizeInMBs 65 -> \"Value at 'httpEndpointDestinationConfiguration.bufferingHints.sizeInMBs' failed to satisfy constraint: Member must have value less than or equal to 64\" ROLLBACK_COMPLETE; pass 64 -> CREATE_COMPLETE. api 2026-09-13 us-east-1 CreateDeliveryStream: 65 is rejected with that message and 64 is accepted. The bundled schema carries the minimum but not the maximum: the bare engine blocks SizeInMBs 0 with F3034 and lets 65 through, so the rule only checks the ceiling (principle 1)."
addedOn: 2026-09-10
