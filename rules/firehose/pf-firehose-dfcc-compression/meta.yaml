id: pf-firehose-dfcc-compression
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: Format conversion needs an uncompressed S3 destination
constraintSource: https://docs.aws.amazon.com/firehose/latest/dev/record-format-conversion.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 ap-northeast-1: The S3 destination's compression format must be set to UNCOMPRESSED when data format conversion is enabled. To enable compression within the converted output format, set the appropriate serialization option in the output format configuration. -> ROLLBACK_COMPLETE. api 2026-09-10 us-east-1 CreateDeliveryStream: DataFormatConversionConfiguration.Enabled true with CompressionFormat GZIP -> InvalidArgumentException \"The S3 destination's compression format must be set to UNCOMPRESSED when data format conversion is enabled. To enable compression within the converted output format, set the appropriate serialization option in the output format configuration.\""
addedOn: 2026-09-10
