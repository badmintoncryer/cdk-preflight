id: pf-firehose-processor-retries-range
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: A Lambda processor retries at most 300 times
constraintSource: https://docs.aws.amazon.com/firehose/latest/APIReference/API_ProcessorParameter.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: NumberOfRetries 301 -> \"Number of retries for lambda must be between 0 and 300.\" ROLLBACK_COMPLETE; pass 300 and 0 -> CREATE_COMPLETE. api 2026-09-13 us-east-1 CreateDeliveryStream: 301 and -1 are rejected with that message, 300 and 0 are accepted."
addedOn: 2026-09-10
