id: pf-firehose-iceberg-backup-mode
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: Iceberg S3 backup only supports FailedDataOnly
constraintSource: https://docs.aws.amazon.com/firehose/latest/APIReference/API_IcebergDestinationConfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 ap-northeast-1: S3BackupMode.AllData is not supported for Iceberg as destination. -> ROLLBACK_COMPLETE. api 2026-09-10 us-east-1 CreateDeliveryStream: s3BackupMode AllData -> InvalidArgumentException \"S3BackupMode.AllData is not supported for Iceberg as destination.\" CloudFormation spells this property s3BackupMode (lower case s), unlike every other destination. bench 2026-09-29 ap-northeast-1: pass (in-template Glue database and table, CatalogArn in the stack's region, the role allowed glue:GetTable) -> CREATE_COMPLETE. The table is a plain Glue table: Firehose checks GetTable at creation, not the table format."
  expect: "S3BackupMode.AllData is not supported for Iceberg as destination"
addedOn: 2026-09-10
