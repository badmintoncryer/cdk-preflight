id: pf-firehose-iceberg-backup-mode
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: Iceberg S3 backup only supports FailedDataOnly
constraintSource: https://docs.aws.amazon.com/firehose/latest/APIReference/API_IcebergDestinationConfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-10 us-east-1 CreateDeliveryStream: s3BackupMode AllData -> InvalidArgumentException \"S3BackupMode.AllData is not supported for Iceberg as destination.\" CloudFormation spells this property s3BackupMode (lower case s), unlike every other destination."
addedOn: 2026-09-10
