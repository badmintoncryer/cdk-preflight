id: pf-firehose-iceberg-default-table-config
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: An Iceberg destination without routing needs a default table
constraintSource: https://docs.aws.amazon.com/firehose/latest/dev/apache-iceberg-destination.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-10 us-east-1 CreateDeliveryStream: IcebergDestinationConfiguration with no DestinationTableConfigurationList and no Lambda / MetadataExtraction processor -> InvalidArgumentException \"A single default destination table configuration must be provided when both Lambda and MetadataExtraction processors are not provided\"."
addedOn: 2026-09-10
