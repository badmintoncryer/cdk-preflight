id: pf-firehose-prefix-no-error-output-type
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: Prefix cannot interpolate the error output type
constraintSource: https://docs.aws.amazon.com/firehose/latest/dev/s3-prefixes.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 ap-northeast-1: The supplied prefix(es) do not satisfy the following constraint: Prefix must not contain any occurrence of !{firehose:error-output-type} -> ROLLBACK_COMPLETE. api 2026-09-10 us-east-1 CreateDeliveryStream: Prefix \"a/!{firehose:error-output-type}/\" -> InvalidArgumentException \"Prefix must not contain any occurrence of !{firehose:error-output-type}\"."
addedOn: 2026-09-10
