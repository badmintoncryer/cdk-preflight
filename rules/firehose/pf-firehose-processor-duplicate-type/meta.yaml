id: pf-firehose-processor-duplicate-type
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: A destination takes at most one Lambda processor
constraintSource: https://docs.aws.amazon.com/firehose/latest/APIReference/API_ProcessingConfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-10 us-east-1 CreateDeliveryStream: two Lambda processors with different LambdaArn values -> InvalidArgumentException \"Cannot have more than 1 Lambda processor.\" Identical processors are already caught by the engine (F3037, array items not unique); two different ones are not."
addedOn: 2026-09-10
