id: pf-firehose-opensearch-type-name
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: An OpenSearch 7+ destination takes no type name
constraintSource: https://docs.aws.amazon.com/firehose/latest/APIReference/API_AmazonopensearchserviceDestinationConfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-10 us-east-1 CreateDeliveryStream: TypeName \"_doc\" against an OpenSearch 2.11 domain -> InvalidArgumentException \"Types are deprecated in Elasticsearch version 7+ and all OpenSearch versions. TypeName must be empty.\" The rule only fires when the domain is in the same template and declares an OpenSearch / Elasticsearch 7+ engine, because the API doc still describes TypeName as usable with Elasticsearch 6.x, which an imported domain ARN cannot rule out."
addedOn: 2026-09-10
