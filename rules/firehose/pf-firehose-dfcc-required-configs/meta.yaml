id: pf-firehose-dfcc-required-configs
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: Enabled format conversion needs input, output, and schema configs
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-kinesisfirehose-deliverystream-dataformatconversionconfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: Enabled true with no sub-configs (f07) -> \"InputFormatConfiguration must not be null\"; input present, output missing (f07b) -> \"OutputFormatConfiguration must not be null\"; input+output present, schema missing (f07c) -> \"SchemaConfiguration must not be null\". All ROLLBACK_COMPLETE - each of the three keys individually verified.; omission bench 2026-11-25 ap-northeast-1: pass template without AWS::KinesisFirehose::DeliveryStream.ExtendedS3DestinationConfiguration.DataFormatConversionConfiguration.SchemaConfiguration -> ROLLBACK_COMPLETE with \"SchemaConfiguration must not be null\"; bench 2026-11-26 ap-northeast-1, fixtures now building their own Glue table and pointing SchemaConfiguration at the stack's role: fail -> \"InputFormatConfiguration must not be null\" (ROLLBACK_COMPLETE); pass -> CREATE_COMPLETE; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::KinesisFirehose::DeliveryStream.ExtendedS3DestinationConfiguration.DataFormatConversionConfiguration.InputFormatConfiguration -> ROLLBACK_COMPLETE with \"InputFormatConfiguration must not be null\"; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::KinesisFirehose::DeliveryStream.ExtendedS3DestinationConfiguration.DataFormatConversionConfiguration.OutputFormatConfiguration -> ROLLBACK_COMPLETE with \"OutputFormatConfiguration must not be null\""
addedOn: 2026-09-03
omissionFails:
  - "AWS::KinesisFirehose::DeliveryStream.ExtendedS3DestinationConfiguration.DataFormatConversionConfiguration.SchemaConfiguration"
  - "AWS::KinesisFirehose::DeliveryStream.ExtendedS3DestinationConfiguration.DataFormatConversionConfiguration.InputFormatConfiguration"
  - "AWS::KinesisFirehose::DeliveryStream.ExtendedS3DestinationConfiguration.DataFormatConversionConfiguration.OutputFormatConfiguration"
