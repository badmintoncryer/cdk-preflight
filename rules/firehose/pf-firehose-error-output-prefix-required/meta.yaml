id: pf-firehose-error-output-prefix-required
service: firehose
resourceTypes: [AWS::KinesisFirehose::DeliveryStream]
severity: ERROR
title: A prefix with expressions needs an ErrorOutputPrefix
constraintSource: https://docs.aws.amazon.com/firehose/latest/dev/s3-prefixes.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-10 us-east-1 CreateDeliveryStream: Prefix \"a/!{timestamp:yyyy}/\" with no ErrorOutputPrefix -> InvalidArgumentException \"ErrorOutputPrefix cannot be null or empty when Prefix contains expressions\". A plain literal ErrorOutputPrefix (\"plainerror/\") satisfies it; only absent or empty fails."
addedOn: 2026-09-10
