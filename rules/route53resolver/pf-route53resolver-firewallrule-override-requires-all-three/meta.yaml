id: pf-route53resolver-firewallrule-override-requires-all-three
service: route53resolver
benchRegion: us-east-1
resourceTypes: [AWS::Route53Resolver::FirewallRuleGroup]
severity: ERROR
title: "An OVERRIDE DNS Firewall rule must set all three BlockOverride properties"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-route53resolver-firewallrulegroup-firewallrule.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 us-east-1: fail template -> Invalid request provided: CreateFirewallRuleRequest(CreatorRequestId=rslvr-frg-f3457cc488de44e0:rslvr-fdl-63c3996a8ccb4eaf, FirewallRuleGroupId=rslvr-frg-f3457cc488de44e0, FirewallDomainListId=rslvr-fdl-63c3996a8ccb4eaf, Priority=101, Action=BLOCK, BlockResponse=OVERRIDE, BlockOverrideDomain=cdkpf-example.com., BlockOverrideTtl=60, Name=rule-for-rslvr-fdl-63c3996a8ccb4eaf) (ROLLBACK_COMPLETE); bench 2026-11-26 us-east-1: fail -> the same InvalidRequest echo (ROLLBACK_COMPLETE); pass -> CREATE_COMPLETE. api 2026-11-26 us-east-1 CreateFirewallRule with BlockResponse OVERRIDE: no BlockOverrideDnsType -> \"[RSLVR-02014] Your block option DNS type is not valid.\"; no BlockOverrideDomain, or no BlockOverrideTtl -> \"[RSLVR-02013] You must specify an override DNS type, an override domain, and an override Ttl when you are using OVERRIDE.\"; omission bench 2026-11-26 us-east-1: pass template without AWS::Route53Resolver::FirewallRuleGroup.FirewallRules.*.BlockOverrideDnsType -> ROLLBACK_COMPLETE with \"Invalid request provided: CreateFirewallRuleRequest(... BlockResponse=OVERRIDE, BlockOverrideDomain=cdkpf-example.com., BlockOverrideTtl=60 ...)\"; CreateFirewallRule names it (\"[RSLVR-02014] Your block option DNS type is not valid.\", api above); omission bench 2026-11-26 us-east-1: pass template without AWS::Route53Resolver::FirewallRuleGroup.FirewallRules.*.BlockOverrideDomain -> ROLLBACK_COMPLETE with \"Invalid request provided: CreateFirewallRuleRequest(... BlockResponse=OVERRIDE, BlockOverrideDnsType=CNAME, BlockOverrideTtl=60 ...)\"; CreateFirewallRule names it (\"[RSLVR-02013] You must specify an override DNS type, an override domain, and an override Ttl when you are using OVERRIDE.\", api above); omission bench 2026-11-26 us-east-1: pass template without AWS::Route53Resolver::FirewallRuleGroup.FirewallRules.*.BlockOverrideTtl -> ROLLBACK_COMPLETE with \"Invalid request provided: CreateFirewallRuleRequest(... BlockResponse=OVERRIDE, BlockOverrideDomain=cdkpf-example.com., BlockOverrideDnsType=CNAME ...)\"; CreateFirewallRule names it (RSLVR-02013, api above)"
  expect: "Priority=101, Action=BLOCK, BlockResponse=OVERRIDE"
addedOn: 2026-09-10
omissionFails:
  - "AWS::Route53Resolver::FirewallRuleGroup.FirewallRules.*.BlockOverrideDnsType"
  - "AWS::Route53Resolver::FirewallRuleGroup.FirewallRules.*.BlockOverrideDomain"
  - "AWS::Route53Resolver::FirewallRuleGroup.FirewallRules.*.BlockOverrideTtl"
