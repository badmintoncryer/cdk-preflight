  expect: "FirewallRule must specify one of: FirewallRuleType, DnsThreatProtection with ConfidenceThreshold, or FirewallDomainListId"
addedOn: 2026-09-10
omissionFails:
  - "AWS::Route53Resolver::FirewallRuleGroup.FirewallRules.*.DnsThreatProtection"
  - "AWS::Route53Resolver::FirewallRuleGroup.FirewallRules.*.ConfidenceThreshold"
