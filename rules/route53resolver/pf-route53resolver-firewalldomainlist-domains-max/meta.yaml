id: pf-route53resolver-firewalldomainlist-domains-max
service: route53resolver
benchRegion: us-east-1
resourceTypes: [AWS::Route53Resolver::FirewallDomainList]
severity: ERROR
title: "A DNS Firewall domain list cannot take more than 1000 domains in one request"
constraintSource: https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_UpdateFirewallDomains.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 us-east-1: fail template -> UpdateFirewallDomains が \"Invalid request provided\" で ROLLBACK_COMPLETE。2026-09-14 に API を直叩きして境界を確定: 1000 個の ADD は COMPLETE、1001 個は ValidationException \"[RSLVR-02028] You must provide less than \\\"1000\\\" domains in a request\"。1000 に対応するクォータは無い（Domains per account は 100000、Domains in a file imported from S3 は 250000）ので原則 6 の対象外。"
addedOn: 2026-09-10
