id: pf-route53resolver-firewalldomainlist-domains-max
service: route53resolver
benchRegion: us-east-1
resourceTypes: [AWS::Route53Resolver::FirewallDomainList]
severity: ERROR
title: "A DNS Firewall domain list cannot take more than 1000 domains in one request"
constraintSource: https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_UpdateFirewallDomains.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: 1001 domains -> \"1 validation error detected: Value 'Invalid request provided: UpdateFirewallDomainsRequest(...)'\" ROLLBACK_COMPLETE; pass 1000 domains -> CREATE_COMPLETE. api 2026-09-13 us-east-1 UpdateFirewallDomains: 1001 domains -> ValidationException \"[RSLVR-02028] You must provide less than \\\"1000\\\" domains in a request.\" The limit is per UpdateFirewallDomains call, which is what the Domains property of one resource becomes; 1000 goes through. Service Quotas lists no quota for domains per list (only 100000 per account and 1000 domain lists per account), so this is not an adjustable limit."
addedOn: 2026-09-10
