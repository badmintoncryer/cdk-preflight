id: pf-scheduler-universal-target
service: scheduler
resourceTypes: [AWS::Scheduler::Schedule]
severity: ERROR
title: Universal targets need the bare ARN shape, an Input, and an API that changes state
constraintSource: https://docs.aws.amazon.com/scheduler/latest/UserGuide/managing-targets-universal.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-07 us-east-1: a universal target calling listQueues -> ROLLBACK_COMPLETE \"listQueues API is not supported.\" Measured the same day via scheduler:CreateSchedule: getQueueUrl and describeInstances give the same error while sendMessage and startInstances deploy; an ARN carrying a Region and account gives \"scheduler is not a supported service for a target\"; and omitting Input gives \"You must provide an input to set this target for your schedule\"."
addedOn: 2026-09-07
