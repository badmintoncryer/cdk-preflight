id: pf-logs-filter-pattern-bracket
service: logs
resourceTypes: [AWS::Logs::MetricFilter, AWS::Logs::SubscriptionFilter]
severity: ERROR
title: A filter pattern starting with '[' must end with ']'
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/FilterAndPatternSyntax.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1: FilterPattern '[unclosed' on MetricFilter (c01) and SubscriptionFilter (c06) both -> \"If a filter pattern starts with '[' it must end with ']'\". ROLLBACK_COMPLETE. The parse runs before destination validation (c06 used a nonexistent stream ARN). Full pattern grammar is out of scope: '{ $.status = }' fails as \"Invalid metric filter pattern\" (c02) but needs a real parser."
addedOn: 2026-09-02
