  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"Policy can only have two statements. One for Audit Operation and one for Deidentify Operation\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutDataProtectionPolicy with a single statement -> \"Policy can only have two statements. One for Audit Operation and one for Deidentify Operation\". Bare engine clean (the policy is typed as Json)."
