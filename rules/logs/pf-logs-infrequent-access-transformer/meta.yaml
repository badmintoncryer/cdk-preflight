id: pf-logs-infrequent-access-transformer
service: logs
resourceTypes: [AWS::Logs::LogGroup, AWS::Logs::Transformer]
severity: ERROR
title: "A transformer needs a Standard-class log group"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-logs-loggroup.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_FAILED with \"This operation is only supported on the Standard log class.\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutTransformer against an INFREQUENT_ACCESS log group -> \"This operation is only supported on the Standard log class.\"; the log-class check runs before the destination is looked up, so the fixture needs no real destination. Bare engine clean (nothing links the two resources)."
addedOn: 2026-09-08
