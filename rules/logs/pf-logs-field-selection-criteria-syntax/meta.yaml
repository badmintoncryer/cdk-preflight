id: pf-logs-field-selection-criteria-syntax
service: logs
resourceTypes: [AWS::Logs::MetricFilter]
severity: ERROR
title: "FieldSelectionCriteria must reference an @aws system field"
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutMetricFilter.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"Invalid request provided: AWS::Logs::MetricFilter. The provided field selection criteria is invalid\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutMetricFilter with fieldSelectionCriteria \"bogus criteria\" -> \"The provided field selection criteria is invalid\". The documented grammar selects on system fields (@aws.region = \"us-east-1\", @aws.account IN [...]). Bare engine clean (the property is a plain string)."
addedOn: 2026-09-08
