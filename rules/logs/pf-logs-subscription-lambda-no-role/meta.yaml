id: pf-logs-subscription-lambda-no-role
service: logs
resourceTypes: [AWS::Logs::SubscriptionFilter]
severity: ERROR
title: "A Lambda destination must not carry RoleArn"
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/SubscriptionFilters.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"Invalid request provided: AWS::Logs::SubscriptionFilter. destinationArn for vendor lambda cannot be used with roleArn\"; the pass side is not benched: it needs a real destination or would create an account-wide policy. api probe 2026-09-08 us-east-1: PutSubscriptionFilter with a lambda destinationArn and a roleArn -> \"destinationArn for vendor lambda cannot be used with roleArn\". Lambda destinations are authorised by a resource policy on the function, not a passed role. Bare engine clean."
addedOn: 2026-09-08
