repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"Invalid request provided: AWS::Logs::SubscriptionFilter. destinationArn for vendor firehose cannot be used without roleArn\"; the pass side is not benched: it needs a real destination or would create an account-wide policy. api probe 2026-09-08 us-east-1: PutSubscriptionFilter with a firehose destinationArn and no roleArn -> \"destinationArn for vendor firehose cannot be used without roleArn\" (the check runs before the delivery stream is looked up). Bare engine clean; pf-logs-subscription-kinesis-role covers only the kinesis vendor."
