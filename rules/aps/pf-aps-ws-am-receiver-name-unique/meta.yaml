id: pf-aps-ws-am-receiver-name-unique
service: aps
resourceTypes: [AWS::APS::Workspace]
benchRegion: us-east-1
severity: ERROR
title: "Alertmanager receiver names are distinct"
constraintSource: https://docs.aws.amazon.com/prometheus/latest/userguide/AMP-alertmanager-config.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-26 us-east-1: fail (two receivers both named r1) -> ROLLBACK_COMPLETE \"AlertManagerDefinition status: CREATION_FAILED. Reason: status=400, message=error validating Alertmanager config: notification config name \"r1\" is not unique\"; pass (r1 and r2) not deployed (--fail-only) and silent under rule-check; the control for the asynchronous band (a bare receiver \"receivers: [{name: r1}]\" with a matching route, stack cdkpf-c2a-am-ctl) -> CREATE_COMPLETE with the definition ACTIVE, so the base config is valid and the AWS::APS::Workspace handler does stabilize on the definition status"
addedOn: 2026-09-26
