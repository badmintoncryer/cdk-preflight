id: pf-aps-rgn-data-rule-record-alert-exclusive
service: aps
resourceTypes: [AWS::APS::RuleGroupsNamespace]
benchRegion: us-east-1
severity: ERROR
title: "A rule item sets either record or alert, never both"
constraintSource: https://docs.aws.amazon.com/prometheus/latest/userguide/AMP-Ruler-Config.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-26 us-east-1: fail (one rule item carrying both record: and alert:) -> ROLLBACK_COMPLETE \"AlreadyExists: In-flight idempotent request already exists.\"; pass (record: only) not deployed (--fail-only) and silent under rule-check; the CloudFormation handler retries the rejected CreateRuleGroupsNamespace with the same clientToken, so CloudFormation reports \"AlreadyExists: In-flight idempotent request already exists.\" instead of the service sentence; the control (this rule's pass Data in the same two-resource shape, stack cdkpf-probe-rgn-control) -> CREATE_COMPLETE, and the service names the constraint one layer down: aws amp create-rule-groups-namespace us-east-1 -> \"Invalid RuleGroupsNamespace data: [4:17: 5:16: group \"g1\", rule 1, \"AlsoAnAlert\": only one of 'record' and 'alert' must be set]\""
addedOn: 2026-09-26
