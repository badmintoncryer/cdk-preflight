  evidence: "bench 2026-09-26 us-east-1: fail (IgnoreNearExpectedFromAbove {}) -> ROLLBACK_COMPLETE at CloudFormation's early property validation, before the handler runs: \"Properties validation failed for resource CdkpfApsAd with message: #/Configuration/RandomCutForest/IgnoreNearExpectedFromAbove: #: only 1 subschema matches out of 2 / #: 0 subschemas matched instead of one / required key [Amount] not found / required key [Ratio] not found\". The registry schema carries the union's oneOf but the bundled engine is silent on the zero-member side (it does stop both members at once, F3018), hence upstream: cfn-schema. The service sentence was measured at the API layer in phase B: \"Invalid ignoreNearExpectedFromAbove, must specify an action\". pass (Ratio 0.1) not deployed (--fail-only) and silent under rule-check. cdk renders { ratio: undefined } as {}, so plain CDK reaches this. monthly-verify 2026-11 us-east-1: fail -> \"Validation failed with 2 error(s). Call DescribeEvents to retrieve the full list of issues with resource and property details, resolve each error, then retry the operation. [DescribeEvents: PROPERTY_VALIDATION CdkpfApsAd /Resources/CdkpfApsAd/Properties/Configuration/RandomCutForest/IgnoreNearExpectedFromAbove: Required property [Ratio] not found / PROPERTY_VALIDATION CdkpfApsAd /Resources/CdkpfApsAd/Properties/Configuration/RandomCutForest/IgnoreNearExpectedFromAbove: Required property [Amount] not found]\"; the server-side validator now reports the oneOf miss as one missing member per branch, in no fixed order, so expect stops at the bracket"
