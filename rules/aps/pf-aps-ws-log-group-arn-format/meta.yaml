id: pf-aps-ws-log-group-arn-format
service: aps
resourceTypes: [AWS::APS::Workspace]
benchRegion: us-east-1
severity: ERROR
title: "A logging destination is a log-group ARN ending in :*"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-aps-workspace-loggingconfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-26 us-east-1: fail (LoggingConfiguration.LogGroupArn arn:aws:logs:us-east-1:214794239830:log-group:/aws/vendedlogs/cdkpf, well formed but without the :* tail) -> ROLLBACK_COMPLETE \"ValidationException: Invalid logGroupArn: Member must satisfy regular expression pattern: arn:aws[a-z0-9-]*:logs:[a-z0-9-]+:[0-9]{12}:log-group:[A-Za-z0-9\\.\\-\\_\\#/]{1,512}\\:\\*\"; pass (the same ARN with the :* tail) not deployed (--fail-only) and silent under rule-check Extended to QueryLoggingConfiguration on 2026-09-26 (stack cdkpf-c2b-qlfmt, us-east-1): the same ARN without the :* tail under QueryLoggingConfiguration.Destinations[0].CloudWatchLogs.LogGroupArn -> CREATE_FAILED \"ValidationException: Invalid destinations.1.member.cloudWatchLogs.logGroupArn: Member must satisfy regular expression pattern: arn:aws[a-z0-9-]*:logs:[a-z0-9-]+:[0-9]{12}:log-group:[A-Za-z0-9\\.\\-\\_\\#/]{1,512}\\:\\*\" -- the same pattern verbatim, only the property name differs."
addedOn: 2026-09-26
