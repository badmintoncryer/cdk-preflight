id: pf-agentcore-gateway-target-caller-iam-authorizer
service: bedrock-agentcore
benchRegion: us-east-1
resourceTypes: [AWS::BedrockAgentCore::Gateway, AWS::BedrockAgentCore::GatewayTarget]
severity: ERROR
title: "CALLER_IAM_CREDENTIALS needs a gateway whose AuthorizerType is AWS_IAM or AUTHENTICATE_ONLY"
constraintSource: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-building-adding-targets-authorization.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-17 us-east-1 (c2/verify.sh): fail Http Passthrough target with CALLER_IAM_CREDENTIALS on a CUSTOM_JWT gateway (ProtocolType unset) -> CREATE_FAILED (Resource handler returned message: CALLER_IAM_CREDENTIALS credential provider type requires the gateway authorizer type to be AWS_IAM, or AUTHENTICATE_ONLY. (Service: BedrockAgentCoreControl, Status Code: 400), HandlerErrorCode InvalidRequest) -> ROLLBACK_COMPLETE; pass the same target on an AWS_IAM gateway -> CREATE_COMPLETE and deleted."
  expect: "CALLER_IAM_CREDENTIALS credential provider type requires the gateway authorizer type to be AWS_IAM"
addedOn: 2026-10-17
