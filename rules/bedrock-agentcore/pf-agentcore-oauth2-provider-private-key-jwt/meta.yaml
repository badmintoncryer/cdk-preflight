id: pf-agentcore-oauth2-provider-private-key-jwt
service: bedrock-agentcore
benchRegion: us-east-1
resourceTypes: [AWS::BedrockAgentCore::OAuth2CredentialProvider]
severity: ERROR
title: "ClientAuthenticationMethod PRIVATE_KEY_JWT needs PrivateKeyJwtConfig"
constraintSource: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/private-key-jwt.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-17 us-east-1 (#354 c2/verify.sh, narrowed): fail PRIVATE_KEY_JWT without PrivateKeyJwtConfig -> CREATE_FAILED (Resource handler returned message: privateKeyJwtConfig is required when clientAuthenticationMethod is PRIVATE_KEY_JWT. (Service: Bedrock AgentCore Control; Operation: CreateOauth2CredentialProvider; Status Code: 400; Error Code: ValidationException)) -> ROLLBACK_COMPLETE; pass PRIVATE_KEY_JWT with PrivateKeyJwtConfig (in-stack RSA_2048 SIGN_VERIFY key, RS256) -> CREATE_COMPLETE and deleted. Until 2026-09 the resource had no PrivateKeyJwtConfig and the rule fired on every PRIVATE_KEY_JWT (bench 2026-09-05, same rejection); since the property landed in the schema the rule fires only when it is missing."
  expect: "privateKeyJwtConfig is required when clientAuthenticationMethod is PRIVATE_KEY_JWT"
addedOn: 2026-09-05
