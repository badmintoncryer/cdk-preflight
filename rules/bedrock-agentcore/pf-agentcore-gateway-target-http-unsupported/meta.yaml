id: pf-agentcore-gateway-target-http-unsupported
service: bedrock-agentcore
benchRegion: us-east-1
resourceTypes: [AWS::BedrockAgentCore::Gateway, AWS::BedrockAgentCore::GatewayTarget]
severity: ERROR
title: "An Http target cannot be added to a gateway with ProtocolType MCP"
constraintSource: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-http-runtime.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-17 us-east-1 (#354 c2/verify.sh, narrowed): fail Http AgentcoreRuntime target on a gateway with ProtocolType MCP -> CREATE_FAILED (Resource handler returned message: HTTP target configuration is not supported for gateways with MCP protocol type. Provide an MCP-compatible target configuration and retry the request. (Service: BedrockAgentCoreControl, Status Code: 400)) -> ROLLBACK_COMPLETE; pass Http Passthrough (A2A) target on an AWS_IAM gateway with ProtocolType unset -> CREATE_COMPLETE and deleted, so CloudFormation does not send the schema default MCP. The 2026-09-10 measurement only used ProtocolType MCP and the rule then fired on every Http target."
  expect: "HTTP target configuration is not supported for gateways with MCP protocol type"
addedOn: 2026-09-10
