id: pf-agentcore-memory-deterministic-key-extraction-config
service: bedrock-agentcore
benchRegion: us-east-1
resourceTypes: [AWS::BedrockAgentCore::Memory]
severity: ERROR
title: "STRICTLY_CONSISTENT metadata keys cannot carry an ExtractionConfig"
constraintSource: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/long-term-memory-metadata.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-17 us-east-1 (c1/verify.sh): fail STRICTLY_CONSISTENT key dept with ExtractionConfig.LlmExtractionConfig -> CREATE_FAILED (Resource handler returned message: Validation failed during CreateMemory: extractionConfig is not currently supported for key 'dept' in strategy 's1' with extractionType STRICTLY_CONSISTENT (Service: BedrockAgentCoreControl, Status Code: 400), HandlerErrorCode InvalidRequest) -> ROLLBACK_COMPLETE; pass same key without ExtractionConfig next to an LLM_INFERRED key with it -> CREATE_COMPLETE and deleted. CreateMemory direct (#354 B) returned the same text."
  expect: "extractionConfig is not currently supported for key"
addedOn: 2026-10-17
