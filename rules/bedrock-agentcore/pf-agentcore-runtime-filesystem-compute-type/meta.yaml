id: pf-agentcore-runtime-filesystem-compute-type
service: bedrock-agentcore
benchRegion: us-east-1
resourceTypes: [AWS::BedrockAgentCore::Runtime]
severity: ERROR
title: "CapacityProviderVolume needs a capacity provider; SessionStorage, EFS and S3 Files need a runtime without one"
constraintSource: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-filesystem-configurations.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-17 us-east-1 (c3/verify.sh): fail CapacityProviderVolume on a runtime without a capacity provider -> CREATE_FAILED (Resource handler returned message: Invalid request provided: capacityProviderVolume configurations require capacityProviderConfiguration to be specified, HandlerErrorCode InvalidRequest) -> ROLLBACK_COMPLETE; pass SessionStorage /mnt/data without a capacity provider -> CREATE_COMPLETE and deleted. Variant (fail-only) SessionStorage on a capacity provider runtime -> sessionStorage, EFS, and S3 Files storage types are not supported with capacityProviderConfiguration."
  expect: "configurations require capacityProviderConfiguration to be specified"
addedOn: 2026-10-17
