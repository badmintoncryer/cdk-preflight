id: pf-agentcore-oauth2-provider-client-secret
service: bedrock-agentcore
benchRegion: us-east-1
resourceTypes: [AWS::BedrockAgentCore::OAuth2CredentialProvider]
severity: ERROR
title: A custom OAuth2 provider takes ClientSecret when the secret is MANAGED and ClientSecretConfig when it is EXTERNAL, never both
constraintSource: https://docs.aws.amazon.com/bedrock-agentcore-control/latest/APIReference/API_CustomOauth2ProviderConfigInput.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 us-east-1 (probe): no ClientSecret (MANAGED/default) -> CREATE_FAILED (Bedrock AgentCore Control 400: clientSecret is required for CLIENT_SECRET_BASIC and CLIENT_SECRET_POST authentication methods); ClientSecretSource EXTERNAL without ClientSecretConfig -> 400: clientSecretConfig is required for CLIENT_SECRET_BASIC and CLIENT_SECRET_POST authentication methods; EXTERNAL with ClientSecret -> 400: ClientSecret must not be provided when secret source is EXTERNAL. verify-rule.sh 2026-09-05 us-east-1: fail ROLLBACK_COMPLETE, pass CREATE_COMPLETE and deleted. Log: bench/logs/pf-agentcore-oauth2-provider-client-secret.log"
addedOn: 2026-09-05
