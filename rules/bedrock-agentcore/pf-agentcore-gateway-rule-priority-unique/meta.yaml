resourceTypes: [AWS::BedrockAgentCore::GatewayRule]
severity: ERROR
title: "Gateway rules on one gateway must not share a Priority"
constraintSource: https://docs.aws.amazon.com/bedrock-agentcore-control/latest/APIReference/API_CreateGatewayRule.html
