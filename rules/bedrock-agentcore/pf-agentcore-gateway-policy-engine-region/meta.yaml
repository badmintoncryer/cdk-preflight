id: pf-agentcore-gateway-policy-engine-region
service: bedrock-agentcore
benchRegion: us-east-1
resourceTypes: [AWS::BedrockAgentCore::Gateway]
severity: ERROR
title: "PolicyEngineConfiguration.Arn must name a policy engine in the deploy region"
constraintSource: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-building-adding-targets-authorization.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-17 us-east-1 (c2/verify.sh): fail PolicyEngineConfiguration.Arn in us-west-2 (an engine that does not exist) -> CREATE_FAILED (Resource handler returned message: Policy Engine ARN region 'us-west-2' does not match gateway region 'us-east-1' (Service: BedrockAgentCoreControl, Status Code: 400), HandlerErrorCode InvalidRequest) -> ROLLBACK_COMPLETE; pass an in-stack AWS::BedrockAgentCore::PolicyEngine (GetAtt PolicyEngineArn, LOG_ONLY, gateway role allowed bedrock-agentcore:*) -> CREATE_COMPLETE and deleted. The region is checked before the engine is looked up."
  expect: "does not match gateway region"
addedOn: 2026-10-17
