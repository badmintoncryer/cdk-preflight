id: pf-agentcore-gateway-target-jwt-passthrough-http-only
service: bedrock-agentcore
benchRegion: us-east-1
resourceTypes: [AWS::BedrockAgentCore::Gateway, AWS::BedrockAgentCore::GatewayTarget]
severity: ERROR
title: "JWT_PASSTHROUGH cannot be used on an McpServer target"
constraintSource: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-building-adding-targets-authorization.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-17 us-east-1 (c2/verify.sh): fail McpServer target with JWT_PASSTHROUGH on a CUSTOM_JWT MCP gateway -> CREATE_FAILED (Resource handler returned message: MCP server target does not support JWT_PASSTHROUGH credential provider type (Service: BedrockAgentCoreControl, Status Code: 400), HandlerErrorCode InvalidRequest) -> ROLLBACK_COMPLETE; pass Http Passthrough target with JWT_PASSTHROUGH on a CUSTOM_JWT gateway with ProtocolType unset -> CREATE_COMPLETE and deleted."
  expect: "MCP server target does not support JWT_PASSTHROUGH credential provider type"
addedOn: 2026-10-17
