severity: ERROR
title: "A CapacityProviderVolume must name a volume defined on the runtime's capacity provider"
constraintSource: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-filesystem-configurations.html
upstream: none
repro:
