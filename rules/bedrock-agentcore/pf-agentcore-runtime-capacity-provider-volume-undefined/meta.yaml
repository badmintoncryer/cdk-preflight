  evidence: "bench 2026-10-17 us-east-1 (c3/verify.sh): fail CapacityProviderVolume nope on a provider with volume scratch -> CREATE_FAILED (Resource handler returned message: Invalid request provided: Volume name 'nope' does not exist in the CapacityProvider. Available volumes: [scratch], HandlerErrorCode InvalidRequest) -> ROLLBACK_COMPLETE; pass CapacityProviderVolume scratch -> CREATE_COMPLETE and deleted."
  expect: "does not exist in the CapacityProvider"
