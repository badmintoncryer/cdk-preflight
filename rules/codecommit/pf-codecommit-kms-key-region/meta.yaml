id: pf-codecommit-kms-key-region
service: codecommit
benchRegion: us-east-1
resourceTypes: [AWS::CodeCommit::Repository]
severity: ERROR
title: "KmsKeyId must name a KMS key in the repository's Region"
constraintSource: https://docs.aws.amazon.com/codecommit/latest/APIReference/API_CreateRepository.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail KmsKeyId arn:aws:kms:eu-west-1:214794239830:key/1234abcd-12ab-34cd-56ef-1234567890ab -> \"KMS key arn:aws:kms:eu-west-1:214794239830:key/1234abcd-12ab-34cd-56ef-1234567890ab is not found\" (ROLLBACK_COMPLETE); pass with no KmsKeyId (AWS managed key) -> CREATE_COMPLETE. Confound: the service says the key is not found rather than naming the region, and the key id in the fail fixture is fabricated on purpose so no CMK is created; from us-east-1 a key in another region is exactly what 'not found' looks like. bench 2026-11-27 us-east-1: fail template -> ROLLBACK_COMPLETE with \"\"KMS key arn:aws:kms:eu-west-1:214794239830:key/1234abcd-12ab-34cd-56ef-1234567890ab is not found (Service: CodeCommit, Status Code: 400, Request ID: ad3f6b0d-4dee-4c68-9034-eb8e78340b85) (SDK Attempt Count: 1)\" (RequestToken: c7f81fd9-a816-2b42-cb9d-9b1f2a4a7edc, HandlerErrorCode: InvalidRequest)\""
  expect: "is not found (Service: CodeCommit"
addedOn: 2026-09-14
