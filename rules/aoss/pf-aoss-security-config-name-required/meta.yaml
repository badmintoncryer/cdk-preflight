id: pf-aoss-security-config-name-required
service: aoss
benchRegion: us-east-1
resourceTypes: [AWS::OpenSearchServerless::SecurityConfig]
severity: ERROR
title: "A security config must name itself"
constraintSource: https://docs.aws.amazon.com/opensearch-service/latest/ServerlessAPIReference/API_CreateSecurityConfig.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail (SecurityConfig with Type saml and valid SamlOptions but no Name) -> the CloudFormation handler's own \"Name cannot be empty\" (ROLLBACK_COMPLETE, HandlerErrorCode InvalidRequest); pass (the same plus Name) -> CREATE_COMPLETE. So the handler does NOT generate a name, which is what made this candidate INCONCLUSIVE after phase B: the API says \"1 validation error detected: Value null at 'name' failed to satisfy constraint: Member must not be null\", but only a real stack could show whether CloudFormation fills the gap in first. It does not."
addedOn: 2026-09-25
