id: pf-aoss-encryption-policy-kms-arn-region
service: aoss
benchRegion: us-east-1
resourceTypes: [AWS::OpenSearchServerless::SecurityPolicy]
severity: ERROR
title: "An encryption policy KmsARN must name the deploy Region"
constraintSource: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-encryption.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail (encryption policy KmsARN arn:aws:kms:eu-west-1:214794239830:key/93fd6da4-... - the deploy account, only the Region differs) -> \"Invalid kmsKeyId arn:aws:kms:eu-west-1:214794239830:key/93fd6da4-a317-4c17-bfe9-382b5d988b36\" (ROLLBACK_COMPLETE); pass not deployed (--fail-only: it would need a real CMK and the bench account keeps none). api 2026-09-25 us-east-1 CreateSecurityPolicy pinned the single variable with a real key: same ARN in us-east-1 -> ACCEPTED, Region swapped to eu-west-1 -> the same \"Invalid kmsKeyId\", partition swapped to aws-cn -> the same. The ARN is rejected before the key is looked up, so the fixture's key id need not exist."
addedOn: 2026-09-25
