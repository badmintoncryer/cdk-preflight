id: pf-aoss-encryption-policy-resource-type
service: aoss
benchRegion: us-east-1
resourceTypes: [AWS::OpenSearchServerless::SecurityPolicy]
severity: ERROR
title: "An encryption policy rule only covers collection/<name>"
constraintSource: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-encryption.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: fail carries two policies, each one variable off the pass. ResourceType index over collection/probe-d -> \"Policy json is invalid, error: [$.Rules[0].ResourceType: must be a constant value collection]\" (ROLLBACK_COMPLETE). The other arm (ResourceType collection over index/probe-d/logs) is proven alone by api 2026-09-25 us-east-1 CreateSecurityPolicy: \"[$.Rules[0].Resource[0]: does not match the regex pattern ^collection/(?:[a-z][a-z0-9_-]{2,63}\\\\*?|\\\\*)$]\". pass not deployed (--fail-only: the policy resources are free, but the run is kept to the fail side; api 2026-09-25 us-east-1 deployed the matching control through CreateAccessPolicy/CreateSecurityPolicy/CreateLifecyclePolicy and it was ACCEPTED)"
addedOn: 2026-09-25
