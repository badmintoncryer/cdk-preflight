id: pf-cassandra-encryption-kms-key-symmetric
service: cassandra
benchRegion: us-east-1
resourceTypes: [AWS::Cassandra::Table]
severity: ERROR
title: "The customer managed key of a table is a symmetric encryption key"
constraintSource: https://docs.aws.amazon.com/keyspaces/latest/devguide/encryption.customermanaged.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-01 us-east-1: table CUSTOMER_MANAGED_KMS_KEY pointing (GetAtt Arn) at an AWS::KMS::Key RSA_2048 / ENCRYPT_DECRYPT in the same template -> ROLLBACK_COMPLETE, Resource handler returned message: Specified encryption key is not symmetric HandlerErrorCode: InvalidRequest; pass SYMMETRIC_DEFAULT key -> CREATE_COMPLETE (keys are created with PendingWindowInDays 7 and end PendingDeletion); CFN rejection: Specified encryption key is not symmetric"
  expect: "Specified encryption key is not symmetric"
addedOn: 2026-10-01
