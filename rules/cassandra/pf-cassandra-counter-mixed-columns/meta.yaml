id: pf-cassandra-counter-mixed-columns
service: cassandra
benchRegion: us-east-1
resourceTypes: [AWS::Cassandra::Table]
severity: ERROR
title: "A table with a counter column has only counter regular columns"
constraintSource: https://docs.aws.amazon.com/keyspaces/latest/devguide/cql.elements.html#cql.data-types.numeric.counters
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-01 us-east-1: RegularColumns cn counter + nm text -> ROLLBACK_COMPLETE, HandlerErrorCode: InvalidRequest; pass cn counter + c2 counter -> CREATE_COMPLETE; CFN rejection: Cannot mix counter and non counter columns in the same table"
  expect: "Cannot mix counter and non counter columns in the same table"
addedOn: 2026-10-01
