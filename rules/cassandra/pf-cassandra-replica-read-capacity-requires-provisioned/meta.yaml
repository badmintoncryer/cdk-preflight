severity: ERROR
title: "ReplicaSpecifications read capacity settings are only used on a PROVISIONED table"
constraintSource: https://docs.aws.amazon.com/keyspaces/latest/devguide/tables-mrr-autoscaling.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-01 us-east-1: MULTI_REGION keyspace (us-east-1, eu-west-1) + ON_DEMAND table with ReplicaSpecifications [{Region: eu-west-1, ReadCapacityUnits: 1}] -> ROLLBACK_COMPLETE, Resource handler returned message: Unrecognized option 'READ_CAPACITY_UNITS' inside 'replica_updates'. Set 'throughput_mode' explicitly as'PROVISIONED' HandlerErrorCode: InvalidRequest; pass ReplicaSpecifications [{Region: eu-west-1}] -> CREATE_COMPLETE; CFN rejection: Unrecognized option 'READ_CAPACITY_UNITS' inside 'replica_updates'"
  expect: "Unrecognized option 'READ_CAPACITY_UNITS' inside 'replica_updates'"
