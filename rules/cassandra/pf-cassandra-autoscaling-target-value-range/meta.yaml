id: pf-cassandra-autoscaling-target-value-range
service: cassandra
benchRegion: us-east-1
resourceTypes: [AWS::Cassandra::Table]
severity: ERROR
title: "Auto scaling TargetValue is between 10 and 90"
constraintSource: https://docs.aws.amazon.com/keyspaces/latest/devguide/autoscaling.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-01 us-east-1: PROVISIONED 1/1 table with WriteCapacityAutoScaling TargetValue 9 and ReadCapacityAutoScaling TargetValue 91 -> ROLLBACK_COMPLETE, Resource handler returned message: 'target_value' must be value between 10 to 90, got '9'. HandlerErrorCode: InvalidRequest (CreateTable called directly rejects 91 with the same sentence and accepts 19, so the docs' 20-90 is wrong); --fail-only: the pass template (10 / 90) needs a billed PROVISIONED table and is not deployed; CFN rejection: 'target_value' must be value between 10 to 90"
  expect: "'target_value' must be value between 10 to 90"
addedOn: 2026-10-01
