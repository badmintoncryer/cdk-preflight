id: pf-cassandra-table-keyspace-dependency
service: cassandra
benchRegion: us-east-1
resourceTypes: [AWS::Cassandra::Table, AWS::Cassandra::Type]
severity: ERROR
title: "A table or type that names an in-template keyspace by string depends on it"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-cassandra-table.html#cfn-cassandra-table-keyspacename
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-01 us-east-1, a race, run 3 times: Table with literal KeyspaceName and no DependsOn on the in-template keyspace -> run 1 ROLLBACK_COMPLETE, HandlerErrorCode: InvalidRequest; run 2 CREATE_COMPLETE (the keyspace won the race; stack delete then hit DELETE_FAILED because the keyspace and table were deleted in parallel, keyspace retained and removed by hand); run 3 void (NAME_CONFLICT on the retained keyspace). pass (same + DependsOn Ks) -> CREATE_COMPLETE; CFN rejection: Keyspace cdkpf_table_keyspace_dependency does not exist"
  expect: "Keyspace cdkpf_table_keyspace_dependency does not exist"
addedOn: 2026-10-01
