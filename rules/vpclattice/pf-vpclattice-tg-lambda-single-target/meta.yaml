  evidence: "bench 2026-10-18 us-east-1 (#363 c1/verify-rerun.sh; the 2026-10-17 run failed with the same text): fail LAMBDA TG with two in-stack functions as Targets -> ROLLBACK_COMPLETE (Invalid request provided: TargetGroup of type LAMBDA can't have more than 1 Target registered); pass one in-stack function -> CREATE_COMPLETE. The CloudFormation handler rejects this itself; the RegisterTargets API text differs (Maximum of 1 targets are supported per request)."
