id: pf-vpclattice-rc-arn-port-ranges
service: vpclattice
benchRegion: us-east-1
resourceTypes: [AWS::VpcLattice::ResourceConfiguration]
severity: ERROR
title: "An ARN resource configuration must not set PortRanges"
constraintSource: https://docs.aws.amazon.com/vpc-lattice/latest/ug/resource-configuration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-18 us-east-1 (#363 c4/verify.sh): fail ARN with PortRanges ['443'] (ArnResource a missing RDS instance) -> ROLLBACK_COMPLETE (Unexpected attribute portRanges for type ARN); pass ARN without PortRanges, ArnResource of an in-stack RDS instance -> CREATE_COMPLETE."
  expect: "Unexpected attribute portRanges for type ARN"
addedOn: 2026-10-18
