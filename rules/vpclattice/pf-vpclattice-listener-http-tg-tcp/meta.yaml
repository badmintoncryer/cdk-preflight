id: pf-vpclattice-listener-http-tg-tcp
service: vpclattice
benchRegion: us-east-1
resourceTypes: [AWS::VpcLattice::Listener]
severity: ERROR
title: "An HTTP or HTTPS listener cannot forward to a TCP target group"
constraintSource: https://docs.aws.amazon.com/vpc-lattice/latest/ug/tls-listeners.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-18 us-east-1 (#363 c2/verify.sh): fail HTTPS listener forwarding to a TCP TG -> ROLLBACK_COMPLETE (Incompatible target group protocol TCP with listener protocol HTTPS.); pass forwarding to an HTTP TG -> CREATE_COMPLETE. Variant an HTTP listener forwarding to the TCP TG -> ROLLBACK_FAILED (Incompatible target group protocol TCP with listener protocol HTTP.)."
  expect: "Incompatible target group protocol TCP with listener protocol"
addedOn: 2026-10-18
