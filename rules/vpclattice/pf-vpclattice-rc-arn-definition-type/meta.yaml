id: pf-vpclattice-rc-arn-definition-type
service: vpclattice
benchRegion: us-east-1
resourceTypes: [AWS::VpcLattice::ResourceConfiguration]
severity: ERROR
title: "An ARN resource configuration is defined by ArnResource only"
constraintSource: https://docs.aws.amazon.com/vpc-lattice/latest/ug/resource-configuration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-18 us-east-1 (#363 c4/verify.sh): fail ARN with IpResource 172.31.<n>.10 (one address per stack) -> ROLLBACK_COMPLETE (ARN resource required when the type is ARN); pass ARN with ArnResource of an in-stack RDS instance (db.t4g.micro) -> CREATE_COMPLETE. Variant ARN with DnsResource -> ROLLBACK_COMPLETE (ARN resource required when the type is ARN). Baseline (#363 B, API 2026-10-17): an ArnResource of a missing RDS instance gives 'Error describing RDS Instance', so the text tracks the definition kind."
  expect: "ARN resource required when the type is ARN"
addedOn: 2026-10-18
