id: pf-vpclattice-rc-dns-domain-format
service: vpclattice
benchRegion: us-east-1
resourceTypes: [AWS::VpcLattice::ResourceConfiguration]
severity: ERROR
title: "DnsResource.DomainName must be an ASCII hostname"
constraintSource: https://docs.aws.amazon.com/vpc-lattice/latest/APIReference/API_CreateResourceConfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-18 us-east-1 (#363 c5/verify.sh): fail SINGLE DnsResource.DomainName 'api example.com' -> ROLLBACK_COMPLETE (`api example.com` is not a valid resource configuration domain name); pass db.example.com -> CREATE_COMPLETE. Variant a non-ASCII character (a-umlaut) -> ROLLBACK_COMPLETE (`db.ex?mple.com` is not a valid resource configuration domain name)."
  expect: "is not a valid resource configuration domain name"
addedOn: 2026-10-18
