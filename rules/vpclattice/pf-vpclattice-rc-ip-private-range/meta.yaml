id: pf-vpclattice-rc-ip-private-range
service: vpclattice
benchRegion: us-east-1
resourceTypes: [AWS::VpcLattice::ResourceConfiguration]
severity: ERROR
title: "An IPv4 IpResource must be in 10/8, 100.64/10, 172.16/12 or 192.168/16"
constraintSource: https://docs.aws.amazon.com/vpc-lattice/latest/ug/resource-configuration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-18 us-east-1 (#363 c4/verify.sh): fail SINGLE IpResource 172.15.255.255 -> ROLLBACK_COMPLETE (IP address 172.15.255.255 is not in allowed ranges.); pass IpResource 172.31.255.254 -> CREATE_COMPLETE. Variant SINGLE IpResource 172.32.0.10 -> ROLLBACK_COMPLETE (IP address 172.32.0.10 is not in allowed ranges.). Both sides of 172.16.0.0/12 are rejected (172.15.255.255 and 172.32.0.10)."
  expect: "is not in allowed ranges"
addedOn: 2026-10-18
