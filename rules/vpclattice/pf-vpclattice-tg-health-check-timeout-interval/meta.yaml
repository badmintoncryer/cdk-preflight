id: pf-vpclattice-tg-health-check-timeout-interval
service: vpclattice
benchRegion: us-east-1
resourceTypes: [AWS::VpcLattice::TargetGroup]
severity: ERROR
title: "A target group health check timeout must not exceed its interval"
constraintSource: https://docs.aws.amazon.com/vpc-lattice/latest/ug/target-group-health-checks.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-17 us-east-1 (#363 c1/verify.sh): fail HealthCheckTimeoutSeconds 31 / HealthCheckIntervalSeconds 30 -> ROLLBACK_COMPLETE (Health check timeout value must be less than or equal to the health check interval.); pass Timeout 30 / Interval 30 -> CREATE_COMPLETE."
  expect: "Health check timeout value must be less than or equal to the health check interval"
addedOn: 2026-10-17
