id: pf-iam-policy-action-required
service: iam
resourceTypes: [AWS::IAM::Role, AWS::IAM::Policy, AWS::IAM::ManagedPolicy, AWS::IAM::User, AWS::IAM::Group]
severity: ERROR
title: Every statement needs an Action or NotAction
constraintSource: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_action.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-07 ap-northeast-1: fail -> ROLLBACK_COMPLETE \"Resource handler returned message: 'Policy statement must contain actions. (Service: Iam, Status Code: 400, Request ID: f22cec96-f3e9-4315-be9d-7285543fa785) (SDK Attempt Count: 1)' (RequestToken: bb4622d6-6ef7-e621-d7f8-bf91390c2408, HandlerErrorCode: InvalidRequest)\"; pass -> CREATE_COMPLETE. api 2026-09-07: PutRolePolicy with a statement carrying only Effect and Resource -> MalformedPolicyDocument \"Policy statement must contain actions.\"; an empty \"Action\": [] fails identically."
addedOn: 2026-09-07
