id: pf-iam-policy-resource-format
service: iam
resourceTypes: [AWS::IAM::Role, AWS::IAM::Policy, AWS::IAM::ManagedPolicy]
severity: ERROR
title: Resources must be ARNs or *
constraintSource: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: Resource \"my-bucket\" in a Role inline policy (i02) and in an AWS::IAM::Policy (i20) -> \"Resource my-bucket must be in ARN format or \\\"*\\\".\" Both ROLLBACK_COMPLETE. Intrinsics appear as marker objects in the preprocessed document (measured), so unresolvable values mute the rule."
addedOn: 2026-09-03
