id: pf-iam-managed-policy-size
service: iam
resourceTypes: [AWS::IAM::ManagedPolicy]
severity: ERROR
title: Managed policy documents are limited to 6144 characters (whitespace excluded)
constraintSource: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_iam-quotas.html
upstream: none
repro:
  method: research-case
  evidence: "bench 2026-09-13 ap-northeast-1: a 6145-byte policy document -> \"Cannot exceed quota for PolicySize: 6144\" (ROLLBACK_COMPLETE); pass 6144 bytes -> CREATE_COMPLETE"
addedOn: 2026-09-01
