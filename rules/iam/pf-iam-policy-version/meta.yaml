id: pf-iam-policy-version
service: iam
resourceTypes: [AWS::IAM::Role, AWS::IAM::Policy, AWS::IAM::ManagedPolicy]
severity: ERROR
title: Policy Version must be 2012-10-17 or 2008-10-17
constraintSource: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_version.html
upstream: retired
supersededBy:
  engine: 1.8.0-beta
  cdk: 2.268.0
  engineRules: [E3510]
repro:
  method: real-deploy
  evidence: "bench 2026-11-25 us-east-1: verify-rule.sh with a pass template that adds an inline policy without Version -> CREATE_COMPLETE, fail -> ROLLBACK_COMPLETE (Syntax errors in policy.); probe stacks: a role inline policy and AWS::IAM::Policy without Version or with 2008-10-17 -> CREATE_COMPLETE, AWS::IAM::ManagedPolicy without Version or with 2008-10-17 -> \"Policy document must be version 2012-10-17 or greater.\" bench 2026-09-03 ap-northeast-1: Version \"2012-10-18\" (i06) -> \"Syntax errors in policy.\" ROLLBACK_COMPLETE (controlled shape: only Version differs from a valid policy). 2008-10-17 is the documented legacy value and stays in the allow set."
  expect: "Syntax errors in policy."
