id: pf-iam-permissions-boundary-policy-arn
service: iam
resourceTypes: [AWS::IAM::Role, AWS::IAM::User]
severity: ERROR
title: A permissions boundary is a policy ARN
constraintSource: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
