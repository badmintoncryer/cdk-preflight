id: pf-iam-policy-action-single-colon
service: iam
resourceTypes: [AWS::IAM::Role, AWS::IAM::Policy, AWS::IAM::ManagedPolicy, AWS::IAM::User, AWS::IAM::Group]
severity: ERROR
title: An action carries exactly one colon
constraintSource: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_action.html
