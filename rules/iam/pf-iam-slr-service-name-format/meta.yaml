id: pf-iam-slr-service-name-format
service: iam
resourceTypes: [AWS::IAM::ServiceLinkedRole]
severity: ERROR
title: AWSServiceName is a service principal
constraintSource: https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateServiceLinkedRole.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-07 ap-northeast-1: fail -> ROLLBACK_COMPLETE \"Resource handler returned message: 'elasticloadbalancing is not a valid AWS service name (Service Principal) (Service: Iam, Status Code: 403, Request ID: f29fd6d3-652e-412b-bb24-911ba01c32b3) (SDK Attempt Count: 1)' (RequestToken: 8d1ebee0-d0fe-3991-44b0-b3a12cf77935, HandlerErrorCode: AccessDenied)\"; pass -> CREATE_COMPLETE. api 2026-09-07: CreateServiceLinkedRole with --aws-service-name elasticloadbalancing -> AccessDenied \"elasticloadbalancing is not a valid AWS service name (Service Principal)\"; notreal.amazonaws.com is rejected the same way."
addedOn: 2026-09-07
