id: pf-iam-policy-action-vendor-wildcard
service: iam
resourceTypes: [AWS::IAM::Role, AWS::IAM::Policy, AWS::IAM::ManagedPolicy, AWS::IAM::User, AWS::IAM::Group]
severity: ERROR
title: The service prefix of an action takes no wildcard
constraintSource: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_action.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-07 ap-northeast-1: fail -> ROLLBACK_COMPLETE \"Resource handler returned message: 'Action vendors (e.g., aws, ec2, etc.) must not contain wildcards. (Service: Iam, Status Code: 400, Request ID: 73262c28-ad8b-4bac-b3fd-81cd05e7b992) (SDK Attempt Count: 1)' (RequestToken: eab4ddaa-5002-5111-cdf1-210a4d2c24ce, HandlerErrorCode: InvalidRequest)\"; pass -> CREATE_COMPLETE. api 2026-09-07: PutRolePolicy with \"Action\": \"*:GetObject\" -> MalformedPolicyDocument \"Action vendors (e.g., aws, ec2, etc.) must not contain wildcards.\"; \"s3*:GetObject\" and \"s3?:Get\" fail the same way, while \"s3:Get*\", \"s3:*\" and a bare \"*\" are accepted."
addedOn: 2026-09-07
