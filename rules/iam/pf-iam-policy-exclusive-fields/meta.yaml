id: pf-iam-policy-exclusive-fields
service: iam
resourceTypes: [AWS::IAM::Role, AWS::IAM::Policy, AWS::IAM::ManagedPolicy]
severity: ERROR
title: Action/NotAction and Resource/NotResource are exclusive pairs
constraintSource: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: statement with both Action and NotAction (i16), and with both Resource and NotResource (i16b) -> both \"Syntax errors in policy.\" ROLLBACK_COMPLETE (controlled shapes: only the extra field differs from a valid policy)."
addedOn: 2026-09-03
