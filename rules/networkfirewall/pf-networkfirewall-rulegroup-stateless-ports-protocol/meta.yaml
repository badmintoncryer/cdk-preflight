id: pf-networkfirewall-rulegroup-stateless-ports-protocol
service: networkfirewall
benchRegion: us-east-1
resourceTypes: [AWS::NetworkFirewall::RuleGroup]
severity: ERROR
title: "Stateless port matching needs TCP or UDP among the protocols"
constraintSource: https://docs.aws.amazon.com/network-firewall/latest/APIReference/API_MatchAttributes.html
