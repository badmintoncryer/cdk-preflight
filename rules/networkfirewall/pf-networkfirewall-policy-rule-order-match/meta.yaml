 without AWS::NetworkFirewall::RuleGroup.RuleGroup.StatefulRuleOptions.RuleOrder -> ROLLBACK_COMPLETE with \"ResourceArn has invalid rule order, context: StatefulRuleGroupReferences[0].ResourceArn\""
  expect: "context: StatefulRuleGroupReferences[0].ResourceArn"
