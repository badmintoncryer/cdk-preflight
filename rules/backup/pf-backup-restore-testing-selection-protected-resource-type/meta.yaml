  evidence: "bench 2026-09-24 us-east-1: fail (ProtectedResourceType \"CDKPFNOSUCH69\") -> \"Invalid resource type. Valid options: [NEPTUNE, S3, EBS, DYNAMODB, EC2, RDS, FSX, AURORA, DOCUMENTDB, EFS].\" (ROLLBACK_COMPLETE); pass (ProtectedResourceType \"EBS\") -> CREATE_COMPLETE. Severity is WARN because AWS keeps adding restore-testing resource types to that list"
