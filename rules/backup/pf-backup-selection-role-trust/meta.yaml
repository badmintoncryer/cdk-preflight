id: pf-backup-selection-role-trust
service: backup
resourceTypes: [AWS::Backup::BackupSelection, AWS::IAM::Role]
severity: ERROR
title: "A backup selection's IamRoleArn must be a role that trusts backup.amazonaws.com"
constraintSource: https://docs.aws.amazon.com/aws-backup/latest/devguide/iam-service-roles.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-17 ap-northeast-1: a BackupSelection whose IamRoleArn trusts only lambda.amazonaws.com -> IAM Role cannot be assumed by AWS Backup (Service: Backup, Status Code: 400), ROLLBACK_COMPLETE; pass with the role trusting backup.amazonaws.com -> CREATE_COMPLETE"
  expect: "IAM Role cannot be assumed by AWS Backup"
addedOn: 2026-10-17
