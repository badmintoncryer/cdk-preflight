id: pf-backup-restore-testing-selection-arns-xor-conditions
service: backup
benchRegion: us-east-1
resourceTypes: [AWS::Backup::RestoreTestingSelection]
severity: ERROR
title: "A restore testing selection uses either protected resource ARNs or conditions, not both"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-backup-restoretestingselection.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-24 us-east-1: fail (ProtectedResourceArns and ProtectedResourceConditions together) -> \"A selection can have either protected resource ARNs or conditions, not both.\" (ROLLBACK_COMPLETE); pass (ProtectedResourceConditions only) -> CREATE_COMPLETE. The ARN has to be syntactically valid to reach this check: a malformed volume id is rejected first with \"The selection contains [1] invalid protected resource ARN(s) for resource type [EBS]\""
addedOn: 2026-09-24
