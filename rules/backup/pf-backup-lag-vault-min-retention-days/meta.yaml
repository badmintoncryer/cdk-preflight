id: pf-backup-lag-vault-min-retention-days
service: backup
benchRegion: us-east-1
resourceTypes: [AWS::Backup::LogicallyAirGappedBackupVault]
severity: ERROR
title: "A logically air-gapped vault must retain recovery points for at least 7 days"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-backup-logicallyairgappedbackupvault.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-24 us-east-1: fail (MinRetentionDays 6 / MaxRetentionDays 30) -> \"LogicallyAirGappedBackup vault Lock configuration retention days must be between 7 and 36,500, and minimum must be less than or equal to maximum.\" (ROLLBACK_COMPLETE, no vault created; 6 <= 30 holds, so the 7-day floor is the only constraint the template violates); --fail-only: an air-gapped vault is compliance-locked the moment it exists, so the MinRetentionDays 7 pass template is not deployed"
addedOn: 2026-09-24
