id: pf-backup-report-setting-framework-arns-required
service: backup
benchRegion: us-east-1
resourceTypes: [AWS::Backup::ReportPlan]
severity: ERROR
title: "A compliance report plan must list the framework ARNs it reports on"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-backup-reportplan-reportsetting.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-24 us-east-1: fail (ReportTemplate CONTROL_COMPLIANCE_REPORT, no FrameworkArns) -> \"A collection of framework ARNs is required.\" (ROLLBACK_COMPLETE); pass (ReportTemplate BACKUP_JOB_REPORT, no FrameworkArns) -> CREATE_COMPLETE. RESOURCE_COMPLIANCE_REPORT returns the same message from CreateReportPlan (CLI, same day), which is why the rule covers both compliance templates"
addedOn: 2026-09-24
