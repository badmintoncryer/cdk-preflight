id: pf-backup-lifecycle-cold-to-delete-gap
service: backup
benchRegion: us-east-1
resourceTypes: [AWS::Backup::BackupPlan]
severity: ERROR
title: "A backup rule lifecycle must keep DeleteAfterDays at least 90 days after MoveToColdStorageAfterDays"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-backup-backupplan-lifecycleresourcetype.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-24 us-east-1: fail (MoveToColdStorageAfterDays 30 / DeleteAfterDays 119) -> \"Error in some rules due to : Invalid lifecycle. DeleteAfterDays cannot be less than 90 days apart from MoveToColdStorageAfterDays\" (ROLLBACK_COMPLETE); pass (30 / 120) -> CREATE_COMPLETE"
addedOn: 2026-09-24
