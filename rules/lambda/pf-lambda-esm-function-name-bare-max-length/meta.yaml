id: pf-lambda-esm-function-name-bare-max-length
service: lambda
resourceTypes: [AWS::Lambda::EventSourceMapping]
severity: ERROR
title: "A bare function name in FunctionName is limited to 64 characters"
constraintSource: https://docs.aws.amazon.com/lambda/latest/api/API_CreateEventSourceMapping.html
benchRegion: us-east-1
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a 65-character bare function name -> \"Function does not exist\" (ROLLBACK_COMPLETE). Unremovable confound: a bare name over 64 characters cannot name a function that exists. pass a real function named with 64 characters -> CREATE_COMPLETE"
addedOn: 2026-09-07
