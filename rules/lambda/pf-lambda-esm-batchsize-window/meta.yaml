  evidence: "bench 2026-09-13 ap-northeast-1: BatchSize 11 with no batching window -> \"Maximum batch window in seconds must be greater than 0 if maximum batch size is greater than 10\" (ROLLBACK_COMPLETE); pass BatchSize 10 with no window -> CREATE_COMPLETE"
