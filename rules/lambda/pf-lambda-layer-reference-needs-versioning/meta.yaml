repro:
  method: doc-only
  evidence: 'REFERENCE content needs a versioned bucket. Not benched: the rule can only judge a bucket declared in the same template, so the fixture needs an in-template bucket, and there is no way to put the layer archive into it without a custom resource (2026-09-07).'
