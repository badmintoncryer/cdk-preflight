id: pf-lambda-layer-reference-needs-versioning
service: lambda
resourceTypes: [AWS::Lambda::LayerVersion]
severity: WARN
title: "REFERENCE content needs a versioned bucket"
constraintSource: https://docs.aws.amazon.com/lambda/latest/dg/configuration-self-managed-storage.html
benchRegion: us-east-1
upstream: none
repro:
  method: doc-only
  evidence: "REFERENCE content needs a versioned bucket. Not benched: the rule can only judge a bucket declared in the same template, so the fixture needs an in-template bucket, and there is no way to put the layer archive into it without a custom resource (2026-09-07). api 2026-11-26 us-east-1 (CloudFormation over existing buckets): an unversioned bucket holding the object and a policy granting lambda.amazonaws.com s3:GetObject and s3:GetObjectVersion -> CREATE_FAILED with \"You must enable S3 versioning for your S3 bucket when S3ObjectStorageMode is set to REFERENCE.\", with and without S3ObjectVersion; the same object in a versioned bucket -> CREATE_COMPLETE. Lambda checks access and the object before versioning: with no policy the sentence is the bucket-policy one, and with a policy but no object (bench 2026-11-26 us-east-1, the in-template fixture plus a BucketPolicy) it is \"The specified S3 object does not exist\". An in-template bucket is always empty at deploy time, so the committed fixture cannot draw the versioning sentence and the rule stays doc-only."
addedOn: 2026-09-07
