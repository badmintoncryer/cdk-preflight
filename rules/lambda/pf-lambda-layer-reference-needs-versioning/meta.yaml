id: pf-lambda-layer-reference-needs-versioning
service: lambda
resourceTypes: [AWS::Lambda::LayerVersion]
severity: ERROR
title: "REFERENCE content needs a versioned bucket"
constraintSource: https://docs.aws.amazon.com/lambda/latest/dg/configuration-self-managed-storage.html
