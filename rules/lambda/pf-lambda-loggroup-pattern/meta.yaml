id: pf-lambda-loggroup-pattern
service: lambda
resourceTypes: [AWS::Lambda::Function]
severity: ERROR
title: "A log group name follows the CloudWatch Logs naming rules"
constraintSource: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs-loggroups.html
benchRegion: us-east-1
upstream: none
repro:
  method: real-deploy
  evidence: 'CreateFunction (us-east-1, 2026-09-07): "1 validation error detected: Value ''my group!'' at ''loggingConfig.logGroup'' failed to satisfy constraint: Member must satisfy regular expression pattern: [\.\-_/#A-Za-z0-9]+"'
addedOn: 2026-09-07
