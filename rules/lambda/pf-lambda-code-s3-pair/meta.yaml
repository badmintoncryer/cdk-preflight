resourceTypes: [AWS::Lambda::Function]
severity: ERROR
title: S3-based Code needs both S3Bucket and S3Key
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-lambda-function-code.html
