id: pf-lambda-layerperm-arn-length
service: lambda
resourceTypes: [AWS::Lambda::LayerVersionPermission]
severity: ERROR
title: "A layer version ARN is at most 140 characters"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-lambda-layerversionpermission.html
benchRegion: us-east-1
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a 141-character LayerVersionArn -> \"Layer version arn:aws:lambda:...:layer:lll...:1 does not exist.\" (ROLLBACK_COMPLETE). Unremovable confound: a layer name is capped at 64 characters, so no ARN that long can name a layer that exists. pass a real layer ARN -> CREATE_COMPLETE"
addedOn: 2026-09-07
