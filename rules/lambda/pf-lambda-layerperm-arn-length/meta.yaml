id: pf-lambda-layerperm-arn-length
service: lambda
resourceTypes: [AWS::Lambda::LayerVersionPermission]
severity: ERROR
title: "A layer version ARN is at most 140 characters"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-lambda-layerversionpermission.html
benchRegion: us-east-1
upstream: none
repro:
  method: real-deploy
  evidence: 'AddLayerVersionPermission (us-east-1, 2026-09-07): "Layer version arn:aws:lambda:us-east-1:214794239830:layer:lllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll:1 does not exist." CONFOUND: the over-long layer ARN cannot name a layer that exists, so the service reports the lookup miss rather than the length limit.'
addedOn: 2026-09-07
