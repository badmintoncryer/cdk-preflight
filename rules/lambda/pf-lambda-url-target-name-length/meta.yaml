id: pf-lambda-url-target-name-length
service: lambda
resourceTypes: [AWS::Lambda::Url]
severity: ERROR
title: "A bare target function name is at most 64 characters"
constraintSource: https://docs.aws.amazon.com/lambda/latest/api/API_CreateFunctionUrlConfig.html
benchRegion: us-east-1
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a 65-character bare target name -> \"Internal error occurred.\" (ROLLBACK_COMPLETE). CONFOUND: the service answers with an opaque internal error rather than naming the length limit. pass a real function named with 64 characters -> CREATE_COMPLETE"
addedOn: 2026-09-07
