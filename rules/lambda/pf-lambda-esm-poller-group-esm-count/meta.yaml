repro:
  method: doc-only
  evidence: 'A poller group tops out at 100 event source mappings. Not benched: the fail fixture needs 101 EventSourceMappings (57 KB), past CloudFormation''s 51,200-byte inline template limit, and each one needs a real MSK cluster (2026-09-07).'
