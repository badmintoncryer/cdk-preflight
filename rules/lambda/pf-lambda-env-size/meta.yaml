id: pf-lambda-env-size
service: lambda
benchRegion: us-east-1
resourceTypes: [AWS::Lambda::Function]
severity: ERROR
title: Lambda environment variables are limited to 4096 bytes in total
constraintSource: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: environment variables serializing to 4097 bytes -> \"exceeded the 4KB limit. Measured size: 4097 bytes\" (ROLLBACK_COMPLETE); pass 4096 bytes -> CREATE_COMPLETE. The service counts the serialized map, so a 4096-byte sum of keys and values (4103 serialized) is already rejected"
addedOn: 2026-09-01
