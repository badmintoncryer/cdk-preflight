id: pf-sns-fifo-queue-on-standard-topic
service: sns
resourceTypes: [AWS::SNS::Subscription, AWS::SNS::Topic]
severity: ERROR
title: "A FIFO SQS queue cannot subscribe to a standard topic (a FIFO topic may fan out to standard queues, not the reverse)"
constraintSource: https://docs.aws.amazon.com/sns/latest/dg/sns-fifo-topics.html
upstream: none
repro:
