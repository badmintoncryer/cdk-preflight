id: pf-sns-fifo-only-attributes
service: sns
resourceTypes: [AWS::SNS::Topic]
severity: ERROR
title: "ContentBasedDeduplication, ArchivePolicy and FifoThroughputScope are FIFO-only topic attributes, and ArchivePolicy.MessageRetentionPeriod is 1..365 days"
constraintSource: https://docs.aws.amazon.com/sns/latest/api/API_CreateTopic.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: ArchivePolicy.MessageRetentionPeriod 366 on a FIFO topic -> \"Invalid parameter: Attributes Reason: ArchivePolicy: MessageRetentionPeriod value is invalid\" ROLLBACK_COMPLETE (the chained topics carry 0 and a non-FIFO topic with ContentBasedDeduplication); pass two FIFO topics without an ArchivePolicy -> CREATE_COMPLETE. The pass cannot carry the retention limit itself: a topic with an ArchivePolicy cannot be deleted (\"Invalid state: Cannot delete a topic with an ArchivePolicy\"), so the stack delete fails and the topic is left behind on every run - the policy has to be emptied first. Both ends are established by the fail instead."
addedOn: 2026-09-05
