id: pf-cloudwatch-alarm-threshold
service: cloudwatch
resourceTypes: [AWS::CloudWatch::Alarm]
severity: ERROR
title: Standard operators need Threshold, range operators need ThresholdMetricId
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-cloudwatch-alarm.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1: GreaterThanThreshold without Threshold (w07) -> \"PutMetricAlarm request should have valid Threshold parameter\"; LessThanLowerOrGreaterThanUpperThreshold without ThresholdMetricId (w08) -> \"ComparisonOperators for ranges require ThresholdMetricId to be set\". Both ROLLBACK_COMPLETE."
addedOn: 2026-09-02
