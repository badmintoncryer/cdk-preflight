id: pf-cloudwatch-anomaly-detector-stat-syntax
service: cloudwatch
resourceTypes: [AWS::CloudWatch::AnomalyDetector]
severity: ERROR
title: "The anomaly detector Stat must be a CloudWatch statistic"
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutAnomalyDetector.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"Property validation failure: [Value for property {/SingleMetricAnomalyDetector/Stat} does not match pattern {^(Minimum|Maximum|Sum|Average|SampleCount|(p|tm)[0-9]{1,2}|(p|tm)[0-9]{1,2}.[0-9]{1,2}|(p|tm)100)$}]\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutAnomalyDetector with Stat \"Avg\" -> \"Value 'Avg' at 'stat' failed to satisfy constraint: Member must satisfy regular expression pattern: (SampleCount|Average|...)\". Bare engine clean (the schema types Stat as a plain string)."
addedOn: 2026-09-08
