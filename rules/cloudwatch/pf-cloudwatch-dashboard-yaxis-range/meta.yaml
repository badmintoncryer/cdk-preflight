id: pf-cloudwatch-dashboard-yaxis-range
service: cloudwatch
resourceTypes: [AWS::CloudWatch::Dashboard]
severity: ERROR
title: "A widget yAxis min must be below its max"
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/CloudWatch-Dashboard-Body-Structure.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"Resource handler returned message: \"The dashboard body is invalid, there are 2 validation errors:\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutDashboard with yAxis.left {min: 100, max: 10} -> InvalidParameterInput \"Should be <= 10\" and \"Should be >= 100\" at /widgets/0/properties/yAxis/left. Bare engine clean."
