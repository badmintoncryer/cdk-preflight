id: pf-cloudwatch-threshold-metric-id
service: cloudwatch
resourceTypes: [AWS::CloudWatch::Alarm]
severity: ERROR
title: ThresholdMetricId must match a metric query that returns data
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-cloudwatch-alarm.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1 (w12): ThresholdMetricId 'ad1' while the ad1 query has ReturnData false -> PutMetricAlarm \"Metrics list must contain exactly one metric matching the ThresholdMetricId parameter\". Flipping ad1 to ReturnData true clears this check (w12b reached the next validation). Only the zero-match side is claimed; duplicate matches are unbenched. Bare engine clean on the no-Threshold shape (F3020 covers Threshold+ThresholdMetricId coexistence, a separate constraint)."
addedOn: 2026-09-03
