id: pf-cloudwatch-alarm-expressions-max
service: cloudwatch
resourceTypes: [AWS::CloudWatch::Alarm]
severity: ERROR
title: "An alarm takes at most 10 math expressions"
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutMetricAlarm.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: 11 math expressions -> \"Too many expressions in alarm, maximum is 10\" ROLLBACK_COMPLETE; pass 10 -> CREATE_COMPLETE. api 2026-09-13 us-east-1 PutMetricAlarm: 11 expressions are rejected with that message and 10 are accepted. The count is checked before the rest of the request, so an 11-expression call is rejected even when EvaluationPeriods is missing."
addedOn: 2026-09-08
