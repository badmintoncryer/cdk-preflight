repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"Too many expressions in alarm, maximum is 10\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutMetricAlarm with 11 Expression queries -> \"Too many expressions in alarm, maximum is 10\"; 10 expressions alongside 10 MetricStat queries is accepted. Bare engine clean."
