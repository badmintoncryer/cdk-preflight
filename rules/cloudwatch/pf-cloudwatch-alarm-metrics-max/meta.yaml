id: pf-cloudwatch-alarm-metrics-max
service: cloudwatch
resourceTypes: [AWS::CloudWatch::Alarm]
severity: ERROR
title: "An alarm takes at most 10 MetricStat queries"
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutMetricAlarm.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"Too many metrics in alarm, maximum is 10\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutMetricAlarm with 11 MetricStat queries -> \"Too many metrics in alarm, maximum is 10\". The doc's \"20 MetricDataQuery\" is the combined total; 10 metrics + 10 expressions is accepted. Bare engine clean."
addedOn: 2026-09-08
