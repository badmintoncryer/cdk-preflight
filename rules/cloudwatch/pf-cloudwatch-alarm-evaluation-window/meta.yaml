id: pf-cloudwatch-alarm-evaluation-window
service: cloudwatch
resourceTypes: [AWS::CloudWatch::Alarm]
severity: ERROR
title: "The evaluation window caps at 7 days (Period >= 3600) or 1 day (Period < 3600)"
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutMetricAlarm.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"Metrics cannot be checked across more than a week (EvaluationPeriods * Period must be <= 604800) for alarms using period >= 3600\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutMetricAlarm Period 3600 x EvaluationPeriods 200 -> \"Metrics cannot be checked across more than a week (EvaluationPeriods * Period must be <= 604800) for alarms using period >= 3600\"; Period 60 x 1500 -> \"... more than a day (EvaluationPeriods * Period must be <= 86400) for alarms using period < 3600\". Bare engine clean."
addedOn: 2026-09-08
