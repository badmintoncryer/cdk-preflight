  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"INVALID_RULE_BODY: MissingKey encountered at Filters in the RuleBody.\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutInsightRule with a Contribution that has Keys but no Filters -> \"INVALID_RULE_BODY: MissingKey encountered at Filters in the RuleBody.\" Filters may be an empty array, but the key has to be there. Bare engine clean."
