id: pf-cloudwatch-alarm-search-expression
service: cloudwatch
resourceTypes: [AWS::CloudWatch::Alarm]
severity: ERROR
title: "SEARCH() cannot be used in a metric alarm"
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutMetricAlarm.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"SEARCH is not supported on Metric Alarms.\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutMetricAlarm with Expression SEARCH('{AWS/EC2,InstanceId} MetricName=\"CPUUtilization\"', 'Average', 300) -> \"SEARCH is not supported on Metric Alarms.\" Bare engine clean."
addedOn: 2026-09-08
