id: pf-cloudwatch-anomaly-detector-namespace-colon
service: cloudwatch
resourceTypes: [AWS::CloudWatch::AnomalyDetector]
severity: ERROR
title: "A metric namespace must not start with a colon"
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutAnomalyDetector.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"Property validation failure: [Value for property {/SingleMetricAnomalyDetector/Namespace} does not match pattern {[^:].*}]\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutAnomalyDetector with Namespace \":bad\" -> \"Value ':bad' at 'namespace' failed to satisfy constraint: Member must satisfy regular expression pattern: [^:].*\". Bare engine clean."
addedOn: 2026-09-08
