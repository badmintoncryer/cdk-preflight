id: pf-cloudwatch-alarm-ec2-action-region
service: cloudwatch
resourceTypes: [AWS::CloudWatch::Alarm]
severity: ERROR
title: "An EC2 automate action must name the stack's own region"
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutMetricAlarm.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"Invalid region eu-west-1 specified. Only ap-northeast-1 is supported.\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutMetricAlarm with AlarmActions [\"arn:aws:automate:eu-west-1:ec2:stop\"] -> \"Invalid region eu-west-1 specified. Only us-east-1 is supported.\"; the same ARN with the caller's region succeeded. Bare engine clean."
addedOn: 2026-09-08
