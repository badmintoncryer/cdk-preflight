  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"INVALID_RULE_BODY: InvalidValueType encountered at LogFormat in the RuleBody.\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutInsightRule with LogFormat \"TEXT\" -> \"INVALID_RULE_BODY: InvalidValueType encountered at LogFormat in the RuleBody.\" Bare engine clean (the value lives inside the opaque RuleBody string, so W3030 never sees it)."
