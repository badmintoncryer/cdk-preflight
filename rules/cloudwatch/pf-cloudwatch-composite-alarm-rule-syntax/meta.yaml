id: pf-cloudwatch-composite-alarm-rule-syntax
service: cloudwatch
resourceTypes: [AWS::CloudWatch::CompositeAlarm]
severity: ERROR
title: An AlarmRule must start with a valid expression token
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-cloudwatch-alarm.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1 (w01): AlarmRule 'GARBAGE(not a rule' -> \"Error in AlarmRule [Unsupported token 'GARBAGE' at char 0, must be: '(', 'NOT', AT_LEAST, TRUE or FALSE, ALARM, OK, or INSUFFICIENT_DATA]\". ROLLBACK_COMPLETE. First token only — the full grammar is out of scope. Referenced alarms must also exist (w02) but that is account state, not template-provable."
addedOn: 2026-09-02
