id: pf-cloudwatch-dashboard-widget-stat-syntax
service: cloudwatch
resourceTypes: [AWS::CloudWatch::Dashboard]
severity: ERROR
title: "A widget stat must be a CloudWatch statistic"
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/CloudWatch-Dashboard-Body-Structure.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"Resource handler returned message: \"The dashboard body is invalid, there are 1 validation errors:\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutDashboard with a metric widget stat \"Avg\" -> InvalidParameterInput 'Should match pattern \"^((SampleCount|Average|Sum|Minimum|Maximum|IQM)|(p|tc|tm|ts|wm)...' at /widgets/0/properties/stat. Bare engine clean."
addedOn: 2026-09-08
