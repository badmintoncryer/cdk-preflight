id: pf-cloudwatch-dashboard-name
service: cloudwatch
resourceTypes: [AWS::CloudWatch::Dashboard]
severity: ERROR
title: Dashboard names allow only alphanumerics, dash and underscore
constraintSource: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutDashboard.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1 (dw06): DashboardName \"bad/name here\" -> PutDashboard \"The value for field DashboardName contains invalid characters. It can only contain alphanumerics, dash (-) and underscore (_).\" CREATE_FAILED, and the rollback DELETE fails with the same 400 (stack stuck in ROLLBACK_FAILED until delete with retain). Bare engine clean (no pattern in the registry schema)."
addedOn: 2026-09-03
