  evidence: "bench 2026-09-08 ap-northeast-1: fail -> ROLLBACK_COMPLETE with \"ActionsSuppressor must be a valid CloudWatch Alarm ARN or an Alarm name\"; pass -> CREATE_COMPLETE. api probe 2026-09-08 us-east-1: PutCompositeAlarm with ActionsSuppressor \"arn:aws:sns:us-east-1:...:pf-topic\" -> \"ActionsSuppressor must be a valid CloudWatch Alarm ARN or an Alarm name\" - the format check runs before the alarm is looked up. Bare engine clean."
