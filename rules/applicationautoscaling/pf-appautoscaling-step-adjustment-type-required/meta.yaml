id: pf-appautoscaling-step-adjustment-type-required
service: applicationautoscaling
benchRegion: us-east-1
resourceTypes: [AWS::ApplicationAutoScaling::ScalingPolicy]
severity: ERROR
title: "A step scaling policy needs an AdjustmentType"
constraintSource: https://docs.aws.amazon.com/autoscaling/application/APIReference/API_StepScalingPolicyConfiguration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-24 us-east-1: StepScalingPolicyConfiguration with one valid step adjustment and no AdjustmentType -> \"Adjustment type must be specified\" (ROLLBACK_COMPLETE); pass the same configuration with AdjustmentType ChangeInCapacity -> CREATE_COMPLETE (fail and pass both register an ecs:service:DesiredCount target on a LaunchType EC2 service with DesiredCount 0, because PutScalingPolicy looks the target up before it validates the configuration)"
addedOn: 2026-09-24
