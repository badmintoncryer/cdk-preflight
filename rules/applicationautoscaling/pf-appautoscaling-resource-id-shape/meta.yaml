id: pf-appautoscaling-resource-id-shape
service: applicationautoscaling
benchRegion: us-east-1
resourceTypes: [AWS::ApplicationAutoScaling::ScalableTarget]
severity: ERROR
title: "ResourceId must carry the resource type its ScalableDimension names"
constraintSource: https://docs.aws.amazon.com/autoscaling/application/APIReference/API_RegisterScalableTarget.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-24 us-east-1: ScalableDimension dynamodb:table:ReadCapacityUnits with the bare ResourceId 'cdkpf-aas-ris-f' -> \"Resource handler returned message: \"Unsupported service namespace, resource type or scalable dimension (Service: ApplicationAutoScaling, Status Code: 400, Request ID: 2acd3e4a-1198-4296-9329-6ab2d0352790) (SDK Attempt Count: 1)\" (RequestToken: c0502ce0-a12e-c041-79db-d511ad8f0b13, HandlerErrorCode: InvalidRequest)\" (ROLLBACK_COMPLETE); pass the same target with ResourceId table/cdkpf-aas-ris-p on a real table -> CREATE_COMPLETE. The sentence covers three branches, but namespace and dimension are both valid and agree in the fixture, so only the resource-type branch can fire"
addedOn: 2026-09-24
