id: pf-appautoscaling-customized-metric-exclusive
service: applicationautoscaling
benchRegion: us-east-1
resourceTypes: [AWS::ApplicationAutoScaling::ScalingPolicy]
severity: ERROR
title: "A customized metric uses metric math or a single metric, never both"
constraintSource: https://docs.aws.amazon.com/autoscaling/application/APIReference/API_CustomizedMetricSpecification.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-24 us-east-1: a CustomizedMetricSpecification carrying the metric-math Metrics array together with MetricName / Namespace / Statistic, on an ECS service -> \"The customized metric specification is not valid. You can use a specification with metric math or a specification without metric math, but not a combination of both.\" (ROLLBACK_COMPLETE); pass the same specification with MetricName / Namespace / Statistic only -> CREATE_COMPLETE. The fixture is on ECS on purpose: a DynamoDB dimension refuses CustomizedMetricSpecification outright with a different sentence"
addedOn: 2026-09-24
