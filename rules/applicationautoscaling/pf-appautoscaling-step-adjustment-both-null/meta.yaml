id: pf-appautoscaling-step-adjustment-both-null
service: applicationautoscaling
benchRegion: us-east-1
resourceTypes: [AWS::ApplicationAutoScaling::ScalingPolicy]
severity: ERROR
title: "A step adjustment must carry at least one bound"
constraintSource: https://docs.aws.amazon.com/autoscaling/application/APIReference/API_StepAdjustment.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-24 us-east-1: a single StepAdjustment carrying only ScalingAdjustment 1, with neither MetricIntervalLowerBound nor MetricIntervalUpperBound -> \"Both lower and upper bounds of a step adjustment cannot be left unspecified\" (ROLLBACK_COMPLETE); pass the same adjustment with MetricIntervalLowerBound 0 -> CREATE_COMPLETE. api-probe 2026-09-24 us-east-1 (#68 phase B): the same sentence comes back when the unbounded adjustment is one of two (fail and pass both register an ecs:service:DesiredCount target on a LaunchType EC2 service with DesiredCount 0, because PutScalingPolicy looks the target up before it validates the configuration)"
addedOn: 2026-09-24
