id: pf-appautoscaling-step-adjustment-two-null-upper
service: applicationautoscaling
benchRegion: us-east-1
resourceTypes: [AWS::ApplicationAutoScaling::ScalingPolicy]
severity: ERROR
title: "Only one step adjustment may leave MetricIntervalUpperBound out"
constraintSource: https://docs.aws.amazon.com/autoscaling/application/APIReference/API_StepAdjustment.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-24 us-east-1: StepAdjustments [upper 0, lower 0, lower 10] - two adjustments with no MetricIntervalUpperBound -> \"At most one step adjustment may have an unspecified upper bound\" (ROLLBACK_COMPLETE); pass the same policy with one open-top adjustment [upper 0, lower 0] -> CREATE_COMPLETE (fail and pass both register an ecs:service:DesiredCount target on a LaunchType EC2 service with DesiredCount 0, because PutScalingPolicy looks the target up before it validates the configuration)"
addedOn: 2026-09-24
