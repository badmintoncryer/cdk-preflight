id: pf-msk-replicator-enhanced-sync-requires-identical
service: msk
benchRegion: us-east-1
resourceTypes: [AWS::MSK::Replicator]
severity: ERROR
title: "ENHANCED consumer-group offset sync needs IDENTICAL topic names"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-msk-replicator.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-13 us-east-1: create-replicator with ConsumerGroupOffsetSyncMode ENHANCED and TopicNameConfiguration.Type PREFIXED_WITH_SOURCE_CLUSTER_ALIAS -> \"The consumerGroupOffsetSyncMode value ENHANCED is only supported when topicNameConfiguration type is IDENTICAL. ... Additional error details: InvalidParameter: consumerGroupOffsetSyncMode\"; bench 2026-09-13 us-east-1: fail template -> \"The consumerGroupOffsetSyncMode value ENHANCED is only supported when topicNameConfiguration type is IDENTICAL. To resolve this, either set topicNameConfiguration type to IDENTICAL, or change consumerGroupOffsetSyncMode to a value that is compatible with your current topicNameConfiguration type. 'consumerGroupOffsetSyncMode'\" (ROLLBACK_COMPLETE); pass not deployed (--fail-only: a pass template needs two ACTIVE MSK clusters, ~31 min each, which one stack cannot stand up) — the rule judges an explicitly declared TopicNameConfiguration.Type only; whether the documented default (PREFIXED_WITH_SOURCE_CLUSTER_ALIAS, property omitted) is rejected the same way was not measured"
addedOn: 2026-09-13
