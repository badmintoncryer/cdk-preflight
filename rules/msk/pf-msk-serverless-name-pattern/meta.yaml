resourceTypes: [AWS::MSK::ServerlessCluster]
severity: ERROR
title: "A serverless MSK cluster name must be alphanumeric and may only contain hyphens after the first character"
constraintSource: https://docs.aws.amazon.com/msk/latest/developerguide/serverless.html
upstream: none
repro:
