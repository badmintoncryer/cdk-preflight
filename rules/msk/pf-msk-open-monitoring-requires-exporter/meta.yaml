id: pf-msk-open-monitoring-requires-exporter
service: msk
benchRegion: us-east-1
resourceTypes: [AWS::MSK::Cluster]
severity: ERROR
title: "Prometheus open monitoring needs an exporter"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-msk-cluster-prometheus.html
