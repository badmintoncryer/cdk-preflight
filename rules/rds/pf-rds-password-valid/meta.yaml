id: pf-rds-password-valid
service: rds
resourceTypes: [AWS::RDS::DBInstance, AWS::RDS::DBCluster]
severity: ERROR
title: "MasterUserPassword must be at least 8 characters without '/', '@', '\\\"' or spaces"
constraintSource: https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_CreateDBInstance.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: 5-char password (r09) -> \"The parameter MasterUserPassword is not a valid password because it is shorter than 8 characters.\"; password with @ (r09b) -> \"Only printable ASCII characters besides '/', '@', '\\\"', ' ' may be used.\" Both ROLLBACK_COMPLETE on DBInstance; the forbidden set is quoted from the service message. Secrets Manager dynamic references arrive as marker objects and stay silent."
addedOn: 2026-09-03
