id: pf-rds-password-valid
service: rds
resourceTypes: [AWS::RDS::DBInstance, AWS::RDS::DBCluster]
severity: ERROR
title: "MasterUserPassword must be at least 8 characters without '/', '@', '\\\"' or spaces"
constraintSource: https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_CreateDBInstance.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: a 7-character MasterUserPassword -> \"The parameter MasterUserPassword is not a valid password because it is shorter than 8 characters.\" (ROLLBACK_COMPLETE); pass 8 characters -> CREATE_COMPLETE. The character-set branch (\"/\", \"@\", \"\\\"\" and spaces are not allowed) is the other half of this rule and is not what the fixture reports."
addedOn: 2026-09-03
