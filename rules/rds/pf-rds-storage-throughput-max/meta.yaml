id: pf-rds-storage-throughput-max
service: rds
resourceTypes: [AWS::RDS::DBInstance]
severity: ERROR
title: "gp3 StorageThroughput is capped at 4000 MiBps"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-rds-dbinstance.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: gp3 StorageThroughput 4001 with Iops 16000 -> \"Invalid storage throughput value for engine name postgres and storage type gp3: 4001\" (ROLLBACK_COMPLETE); pass 4000 -> CREATE_COMPLETE. The pass needs Iops 16000 as well: storage throughput may not exceed a quarter of the provisioned IOPS."
addedOn: 2026-09-08
