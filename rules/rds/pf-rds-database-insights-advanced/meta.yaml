id: pf-rds-database-insights-advanced
service: rds
resourceTypes: [AWS::RDS::DBCluster]
severity: ERROR
title: "DatabaseInsightsMode: advanced requires Performance Insights with at least 31 days retention"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-rds-dbcluster.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: DatabaseInsightsMode advanced with Performance Insights on and a 30-day retention -> \"You can't enable the Advanced mode of Database Insights until you set the retention period for Performance Insights to at least 31 days.\" (ROLLBACK_COMPLETE); pass the same with 31 days -> CREATE_COMPLETE; omission bench 2026-11-26 us-east-1: pass template without AWS::RDS::DBCluster.PerformanceInsightsEnabled -> ROLLBACK_COMPLETE with \"You can't enable the Advanced mode of Database Insights until you enable Performance Insights and set the retention period for Performance Insights to at lea...\"; omission bench 2026-11-26 us-east-1: pass template without AWS::RDS::DBCluster.PerformanceInsightsRetentionPeriod -> ROLLBACK_COMPLETE with \"You can't enable the Advanced mode of Database Insights until you set the retention period for Performance Insights to at least 31 days.\""
  expect: "You can't enable the Advanced mode of Database Insights until you set the retention period for Performance Insights to at least 31 days"
addedOn: 2026-09-08
omissionFails:
  - "AWS::RDS::DBCluster.PerformanceInsightsEnabled"
  - "AWS::RDS::DBCluster.PerformanceInsightsRetentionPeriod"
