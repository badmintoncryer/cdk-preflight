id: pf-rds-io1-iops-ratio
service: rds
resourceTypes: [AWS::RDS::DBInstance]
severity: ERROR
title: postgres io1 Iops may not exceed 50 per GiB of storage
constraintSource: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: postgres io1 100 GiB + Iops 6000 (r02b) -> \"Invalid iops to storage (GiB) ratio for engine name postgres and storage type io1: 60.0000\". 100 GiB + 80000 (r02) also fails. 2000 GiB + 80000 at ratio 40 deployed CLEAN (r02c) - there is no 64000 absolute cap, so only the ratio is claimed. ROLLBACK_COMPLETE for the fail benches."
addedOn: 2026-09-03
