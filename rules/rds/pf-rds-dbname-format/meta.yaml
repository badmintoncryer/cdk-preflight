id: pf-rds-dbname-format
service: rds
resourceTypes: [AWS::RDS::DBInstance]
severity: ERROR
title: postgres DBName must begin with a letter
constraintSource: https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_CreateDBInstance.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: postgres DBName \"1abc\" (r15) -> \"DBName must begin with a letter and contain only alphanumeric characters.\" ROLLBACK_COMPLETE. BUT DBName \"bench_db\" deployed CLEAN (r15b) - the \"only alphanumeric\" half of the service message is wrong (underscores are legal), so this rule claims ONLY the verified letter-start requirement and judges no other characters."
addedOn: 2026-09-03
