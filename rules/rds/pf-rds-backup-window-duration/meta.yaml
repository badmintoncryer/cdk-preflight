id: pf-rds-backup-window-duration
service: rds
resourceTypes: [AWS::RDS::DBInstance]
severity: ERROR
title: The backup window must be at least 30 minutes
constraintSource: https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_CreateDBInstance.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: PreferredBackupWindow 03:00-03:29, a 29-minute window -> \"Backup window must be at least 30 minutes.\" (ROLLBACK_COMPLETE); pass 03:00-03:30, exactly 30 minutes -> CREATE_COMPLETE"
addedOn: 2026-09-03
