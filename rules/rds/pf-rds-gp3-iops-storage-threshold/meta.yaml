id: pf-rds-gp3-iops-storage-threshold
service: rds
resourceTypes: [AWS::RDS::DBInstance]
severity: ERROR
title: gp3 below 400 GiB cannot take custom Iops or StorageThroughput (postgres/mysql)
constraintSource: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: gp3 with Iops 12000 and AllocatedStorage 399 -> \"You can't specify IOPS or storage throughput for engine postgres and a storage size less than 400.\" (ROLLBACK_COMPLETE); pass the same with 400 -> CREATE_COMPLETE"
addedOn: 2026-09-03
