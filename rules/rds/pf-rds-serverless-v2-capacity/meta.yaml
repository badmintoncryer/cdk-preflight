id: pf-rds-serverless-v2-capacity
service: rds
resourceTypes: [AWS::RDS::DBCluster]
severity: ERROR
title: Serverless v2 MinCapacity must not exceed MaxCapacity, and MaxCapacity is at most 256
constraintSource: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.setting-capacity.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: MaxCapacity 257 -> \"Serverless v2 capacity value 257.0 is not valid. The valid scaling range for this cluster is 0.0 to 256.0.\"; a second cluster in the same template at MinCapacity 1.5 / MaxCapacity 1 -> \"Serverless v2 minimum capacity must be less than or equal to maximum capacity\" (ROLLBACK_COMPLETE). pass: one cluster at 0.5 / 256 (the literal limit) and one at 0.5 / 0.5 (the equal limit) -> CREATE_COMPLETE. Min and Max move in 0.5 ACU steps, so the closest violating pair is half a unit apart and the machine check asks for a whole one — see rules/_boundary-exceptions.txt."
addedOn: 2026-09-03
