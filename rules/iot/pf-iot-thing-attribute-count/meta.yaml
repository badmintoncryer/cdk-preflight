id: pf-iot-thing-attribute-count
service: iot
benchRegion: us-east-1
resourceTypes: [AWS::IoT::Thing]
severity: ERROR
title: "A thing may carry at most 3 attributes"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-iot-thing.html
