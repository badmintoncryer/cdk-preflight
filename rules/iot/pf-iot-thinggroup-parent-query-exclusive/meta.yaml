id: pf-iot-thinggroup-parent-query-exclusive
service: iot
benchRegion: us-east-1
resourceTypes: [AWS::IoT::ThingGroup]
severity: ERROR
title: "A thing group cannot have both a parent and a QueryString"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-iot-thinggroup.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-25 us-east-1: a ThingGroup with ParentGroupName plus QueryString -> \"Resource handler returned message: \\\"Thing group cannot have a QueryString and a ParentGroup\\\" (HandlerErrorCode: InvalidRequest)\" (ROLLBACK_COMPLETE); the same group with ParentGroupName only -> CREATE_COMPLETE. This one is a handler-only check: CreateDynamicThingGroup has no parentGroupName argument, so the API cannot express the combination (#270 phase B handed it to C unresolved)"
addedOn: 2026-09-25
