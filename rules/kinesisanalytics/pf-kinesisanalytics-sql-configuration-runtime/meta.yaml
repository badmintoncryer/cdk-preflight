id: pf-kinesisanalytics-sql-configuration-runtime
service: kinesisanalytics
resourceTypes: [AWS::KinesisAnalyticsV2::Application]
severity: ERROR
title: "SqlApplicationConfiguration belongs to the SQL runtime only"
constraintSource: https://docs.aws.amazon.com/managed-flink/latest/apiv2/API_ApplicationConfiguration.html
upstream: cfn-schema
repro:
  method: real-deploy
  evidence: "bench 2026-09-06 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"SQLApplicationConfiguration is not valid with a FLINK runtime environment type. If you want to create a SQL application, please set the RunTimeEnvironmentType to SQL-1_0\"; pass template -> CREATE_COMPLETE. monthly-verify 2026-11 us-east-1: fail -> \"Validation failed with 1 error(s). Call DescribeEvents to retrieve the full list of issues with resource and property details, resolve each error, then retry the operation. [DescribeEvents: PROPERTY_VALIDATION App /Resources/App/Properties/ApplicationConfiguration: Unsupported property [SqlApplicationConfiguration]]\"; the registry schema dropped SqlApplicationConfiguration with the end of Kinesis Data Analytics for SQL, so CloudFormation now refuses the property itself before CreateApplication; a SQL-1_0 runtime is reported by pf-kinesisanalytics-sql-runtime-unsupported, so the two rules together still cover every template carrying it"
  expect: "Unsupported property [SqlApplicationConfiguration]"
addedOn: 2026-09-06
