id: pf-route53-zonename-trailing-dot
service: route53
resourceTypes: [AWS::Route53::RecordSet]
severity: ERROR
title: HostedZoneName must end with a trailing dot
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-route53-recordset.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1: HostedZoneName without the trailing dot -> ROLLBACK_COMPLETE, \"No hosted zone with name 'd21-zonename-no-dot.cdkpf-verify.com' found.\" (HandlerErrorCode NotFound) while the zone existed; control with the trailing dot on the same shape: CREATE_COMPLETE. CloudFormation does not normalize the dot."
addedOn: 2026-09-02
