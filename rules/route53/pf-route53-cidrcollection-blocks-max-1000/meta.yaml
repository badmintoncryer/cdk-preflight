id: pf-route53-cidrcollection-blocks-max-1000
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::CidrCollection]
severity: ERROR
title: "One CIDR collection location holds at most 1000 CIDR blocks"
constraintSource: https://docs.aws.amazon.com/Route53/latest/APIReference/API_ChangeCidrCollection.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: 1001 CIDR blocks in one location -> \"cvc-complex-type.2.4.d: Invalid content was found starting with element 'Cidr'. No child element is expected at this point\" (ROLLBACK_COMPLETE, the API's XML schema bound on a single CidrList); pass 1000 -> CREATE_COMPLETE. 2026-09-14 に ChangeCidrCollection を直叩きしても 1 リクエスト 1000 個は成功、1001 個は同じスキーマエラー。コレクション全体の 1000 は別物で、2 ロケーションに分けて 1001 個目を足すと LimitsExceeded が返る（引き上げ可能なクォータ L-945D15E5）ので数えない（原則 6）。"
addedOn: 2026-09-10
