id: pf-route53-set-identifier-length
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::RecordSet, AWS::Route53::RecordSetGroup]
severity: ERROR
title: "SetIdentifier must be 1-128 characters"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-route53-recordset.html
upstream: pending-engine
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 us-east-1: CloudFormation stops it before provisioning (stack CREATE_FAILED, DetailedStatus VALIDATION_FAILED, \"Validation failed with 1 error(s)\"), so the message names no property; the same record put straight to the Route 53 API names the constraint: \"cvc-maxLength-valid: Value 'xxx...' with length = '129' is not facet-valid with respect to maxLength '128' for type 'SetIdentifier'\". The bundled engine (1.7.0-beta) is silent on it, hence upstream: pending-engine."
addedOn: 2026-09-10
