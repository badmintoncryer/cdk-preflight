id: pf-route53-healthcheck-alarm-high-resolution
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::HealthCheck, AWS::CloudWatch::Alarm]
severity: ERROR
title: "A CloudWatch alarm health check cannot watch a high-resolution alarm"
constraintSource: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-creating-values.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: alarm Period 30 -> CREATE_FAILED, but the CloudFormation handler for AWS::Route53::HealthCheck only says \"Invalid request provided: AWS::Route53::HealthCheck\"; the same HealthCheckConfig put straight to CreateHealthCheck answers InvalidInput: \"Route 53 does not support high-resolution CloudWatch alarms\" (ROLLBACK_COMPLETE); pass Period 60 -> CREATE_COMPLETE. Period is quantised to 10, 20, 30 or a multiple of 60, so 30 is the largest violator that can be built."
addedOn: 2026-09-10
