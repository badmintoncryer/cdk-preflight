id: pf-route53-hostedzone-name-total-253
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::HostedZone]
severity: ERROR
title: "A hosted zone name must be 253 characters or fewer"
constraintSource: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/DomainNameFormat.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: 254-character name -> \"Error occurred: InvalidDomainNameException - FATAL problem: DomainNameTooLong (Domain name is too long)\" (ROLLBACK_COMPLETE); pass 253-character name -> CREATE_COMPLETE. CreateHostedZone turns 254 away and takes 253 both with and without the trailing dot, so the limit is 253 characters of labels and separators - not the 255 the Route 53 doc quotes."
addedOn: 2026-09-10
