id: pf-route53-healthcheck-childhealthchecks-quota-255
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::HealthCheck]
severity: WARN
title: "A CALCULATED health check can aggregate at most 255 child health checks"
constraintSource: https://docs.aws.amazon.com/general/latest/gr/r53.html
upstream: none
repro:
  method: doc-only
  evidence: "doc-only 2026-09-10: the 255-child quota cannot be reproduced - the account limit is 200 health checks, so a stack with 256 children cannot be created, and CreateHealthCheck with 256 synthetic child ids answers \"Invalid parameter : Child health check IDs do not exist or are deleted\" (us-east-1), which names the ids and not the count. The limit is published in the Route 53 service quotas (API doc says 256, the quota page says 255). The fixtures sit on the boundary anyway - 256 ids fail, 255 pass - so they pin the constant even though neither can be deployed. api 2026-11-26 us-east-1: with one real HTTPS health check as the child, a CALCULATED check listing it once is created; listing it 2, 255 or 256 times is refused with \"Calculated health checks must not have duplicate child health check IDs.\", and 257 entries fail XML schema validation (\"Invalid content was found starting with element 'ChildHealthCheck'. No child element is expected at this point.\"). The wire format therefore caps the list at 256; whether the quota table's 255 is enforced below that needs 256 distinct live health checks, which a 200-health-check account cannot hold."
addedOn: 2026-09-10
