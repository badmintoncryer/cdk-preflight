id: pf-route53-alias-apex-to-cname
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::RecordSet, AWS::Route53::RecordSetGroup]
severity: ERROR
title: "A zone-apex alias cannot target a CNAME record set"
constraintSource: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resource-record-sets-values-alias.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 us-east-1: the apex alias points at a name this template creates as a CNAME -> \"Tried to create an alias that targets b.cdkpf-example.com., type A in zone Z08045372MCWOQTLGHJY8, but that target was not found\" (ROLLBACK_COMPLETE). An alias needs a record of its own type at the target name, and a CNAME there does not satisfy it."
addedOn: 2026-09-10
