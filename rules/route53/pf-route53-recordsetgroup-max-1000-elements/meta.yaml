id: pf-route53-recordsetgroup-max-1000-elements
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::RecordSetGroup]
severity: ERROR
title: "One RecordSetGroup may carry at most 1000 ResourceRecords values in total"
constraintSource: https://docs.aws.amazon.com/general/latest/gr/r53.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: 1001 ResourceRecords values over three record sets -> \"[Number of records limit of 1000 exceeded.]\" (ROLLBACK_COMPLETE); pass 1000 -> CREATE_COMPLETE. The values have to be spread over several record sets either way - one record set takes at most 400."
addedOn: 2026-09-10
