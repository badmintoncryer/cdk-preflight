id: pf-route53-ttl-range
service: route53
resourceTypes: [AWS::Route53::RecordSet]
severity: ERROR
title: TTL must fit in 32 bits (0..2147483647 seconds)
constraintSource: https://docs.aws.amazon.com/Route53/latest/APIReference/API_ChangeResourceRecordSets.html
upstream: pending-engine
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1: ROLLBACK_COMPLETE, \"Value '9999999999' at 'changeBatch.changes.1.member.resourceRecordSet.tTL' failed to satisfy constraint: Member must have value less than or equal to 2147483647\" (Status Code 400). Range is schema-expressible; engine silent (1.7.0-beta) -> upstream: pending-engine."
addedOn: 2026-09-02
