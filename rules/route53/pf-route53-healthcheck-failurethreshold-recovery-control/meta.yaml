id: pf-route53-healthcheck-failurethreshold-recovery-control
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::HealthCheck]
severity: WARN
title: "FailureThreshold cannot be set on a RECOVERY_CONTROL health check"
constraintSource: https://docs.aws.amazon.com/Route53/latest/APIReference/API_HealthCheckConfig.html
upstream: none
repro:
  method: doc-only
  evidence: "bench 2026-11-26 us-east-1 with a real, DEPLOYED Application Recovery Controller routing control (created for the run and deleted after): CreateHealthCheck RECOVERY_CONTROL with only RoutingControlArn succeeds, and adding FailureThreshold 3 -> InvalidInput \"Invalid parameter : Calculated health checks must not have a failure threshold specified.\" (the service says Calculated even for RECOVERY_CONTROL). Through CloudFormation, the committed pass template with the real ARN -> CREATE_COMPLETE and the fail template with the real ARN -> CREATE_FAILED with the same sentence. It stays doc-only for the monthly gate only: the committed fixtures carry a placeholder RoutingControlArn, which fails on its own as \"Invalid request provided: AWS::Route53::HealthCheck\", and an ARC cluster is billed by the hour."
addedOn: 2026-09-10
