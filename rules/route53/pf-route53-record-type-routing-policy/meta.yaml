id: pf-route53-record-type-routing-policy
service: route53
resourceTypes: [AWS::Route53::RecordSet]
severity: ERROR
title: NS records take no routing policy; CNAME cannot be multivalue
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-route53-recordset.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1: weighted NS -> \"RRSet with DNS name ..., type NS, SetIdentifier one cannot be created because this type of RRSet is not supported\"; multivalue CNAME -> same message with type CNAME. Both ROLLBACK_COMPLETE, Status Code 400. SOA/DS with a policy are documented as unsupported too but were not measured, so the rule leaves them alone (issue #8)."
addedOn: 2026-09-02
