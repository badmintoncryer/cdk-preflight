id: pf-route53-healthcheck-alarmidentifier-required-cloudwatch
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::HealthCheck]
severity: ERROR
title: "A CLOUDWATCH_METRIC health check needs an AlarmIdentifier"
constraintSource: https://docs.aws.amazon.com/Route53/latest/APIReference/API_HealthCheckConfig.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 us-east-1: fail template -> CREATE_FAILED, but the CloudFormation handler for AWS::Route53::HealthCheck only says \"Invalid request provided: AWS::Route53::HealthCheck\"; the same HealthCheckConfig put straight to CreateHealthCheck answers InvalidInput: \"Alarm identifier must not be null.\" (ROLLBACK_COMPLETE); omission bench 2026-11-26 us-east-1: pass template without AWS::Route53::HealthCheck.HealthCheckConfig.AlarmIdentifier -> ROLLBACK_COMPLETE with \"Alarm identifier must not be null.\""
  expect: "Alarm identifier must not be null."
addedOn: 2026-09-10
omissionFails:
  - "AWS::Route53::HealthCheck.HealthCheckConfig.AlarmIdentifier"
