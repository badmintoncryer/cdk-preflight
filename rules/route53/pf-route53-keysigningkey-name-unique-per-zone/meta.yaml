id: pf-route53-keysigningkey-name-unique-per-zone
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::KeySigningKey]
severity: ERROR
title: "Two key signing keys in one hosted zone cannot share a name"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-route53-keysigningkey.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 us-east-1: fail template -> CREATE_FAILED, CloudFormation refuses the duplicate physical id itself (\"Z07333131XS2VZUJ317HS|ksk1 already exists in stack ...\"); the same pair put straight to CreateKeySigningKey answers KeySigningKeyAlreadyExists: \"Key Signing Key with the same Name and/or KMS ARN already exist. Please make sure the Key Signing Key name and KMS ARN parameters of this request are not being used by another Key Signing Key in this Hosted Zone\" (ROLLBACK_COMPLETE)"
addedOn: 2026-09-10
