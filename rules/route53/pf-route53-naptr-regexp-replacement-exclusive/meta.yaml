  evidence: "bench 2026-09-10 us-east-1: fail template -> [type='NAPTR'] but it was not found, Invalid Resource Record: 'WARNING problem: NAPTRRRDATARegexpAndReplacementError (NAPTR record can have only one field in regexp and replacement) encountered with '100 50 \"U\" \"E2U+sip\" \"!^.*$!sip:info@example.com!\" replacement.example.com.''] (ROLLBACK_COMPLETE)"
