id: pf-route53-recordsetgroup-max-32000-chars
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::RecordSetGroup]
severity: ERROR
title: "One RecordSetGroup may carry at most 32000 characters of record data"
constraintSource: https://docs.aws.amazon.com/general/latest/gr/r53.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: 32001 characters of record data over nine TXT record sets -> \"[RDATA character limit of 32000 exceeded.]\" (ROLLBACK_COMPLETE); pass 32000 -> CREATE_COMPLETE. The count is the presentation string exactly as written, quotes and separators included."
addedOn: 2026-09-10
