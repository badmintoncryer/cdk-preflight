id: pf-route53-geoproximity-bias-range
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::RecordSet, AWS::Route53::RecordSetGroup]
severity: ERROR
title: "GeoProximityLocation.Bias must be -99 to 99"
constraintSource: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resource-record-sets-values-geoproximity.html
upstream: retired
supersededBy:
  engine: 1.9.0-beta
  cdk: 2.269.0
  engineRules: [F3034]
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: Bias 100 -> CloudFormation stops it before provisioning (stack CREATE_FAILED, DetailedStatus VALIDATION_FAILED, \"Validation failed with 1 error(s)\"), so the message names no property; pass Bias 99 -> CREATE_COMPLETE. A 2026-09-10 probe of the same record straight to the Route 53 API names the constraint: \"cvc-maxInclusive-valid: Value '150' is not facet-valid with respect to maxInclusive '99' for type 'Bias'\". The bundled engine (1.7.0-beta) is silent on it, hence upstream: pending-engine. bench 2026-11-27 us-east-1: fail template -> ROLLBACK_COMPLETE with \"Validation failed with 1 error(s). Call DescribeEvents to retrieve the full list of issues with resource and property details, resolve each error, then retry the operation. [DescribeEvents: PROPERTY_VALIDATION Rec /Resources/Rec/Properties/GeoProximityLocation/Bias: #/GeoProximityLocation/Bias: 100 is not less or equal to 99]\""
  expect: "GeoProximityLocation/Bias: #/GeoProximityLocation/Bias: 100 is not less or equal to 99"
addedOn: 2026-09-10
