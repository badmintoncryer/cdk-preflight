id: pf-route53-cidr-location-name-format
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::RecordSet, AWS::Route53::RecordSetGroup, AWS::Route53::CidrCollection]
severity: ERROR
title: "CidrRoutingConfig.LocationName is limited to 16 characters of [0-9A-Za-z_-*]"
constraintSource: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 us-east-1: fail template -> Invalid XML ; javax.xml.stream.XMLStreamException: org.xml.sax.SAXParseException; lineNumber: 1; columnNumber: 496; cvc-pattern-valid: Value 'bad location!' is not facet-valid with respect to pattern '[0-9A-Za-z_\\-\\*]+' for type 'CidrLocationNameDefaultAllowed'. (ROLLBACK_COMPLETE) Extended 2026-09-10 to AWS::Route53::CidrCollection: LocationName 'loc 1' on a collection answers \"cvc-pattern-valid: Value 'loc 1' is not facet-valid with respect to pattern '[0-9A-Za-z_\\\\-]+' for type 'CidrLocationNameDefaultNotAllowed'\" (stack cdkpf-extb-cidrloc, ROLLBACK_COMPLETE) - note the collection side forbids '*', the record side allows it. The 16-character bound inside the pattern is hard too: bench 2026-09-14 us-east-1, ChangeCidrCollection with a 17-character LocationName -> \"cvc-maxLength-valid: Value 'aaaaaaaaaaaaaaaaa' with length = '17' is not facet-valid with respect to maxLength '16' for type 'CidrLocationNameDefaultNotAllowed'\", 16 accepted. That end has no comparison operator so boundaryProblem cannot see it; it is pinned by a targeted case in test/rules.test.ts instead."
addedOn: 2026-09-10
