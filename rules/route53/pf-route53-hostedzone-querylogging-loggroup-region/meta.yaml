id: pf-route53-hostedzone-querylogging-loggroup-region
service: route53
benchRegion: us-east-1
resourceTypes: [AWS::Route53::HostedZone]
severity: ERROR
title: "The query logging log group must live in us-east-1"
constraintSource: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/query-logs.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-10 us-east-1: fail template (a well-formed log group ARN in eu-west-1) -> CREATE_FAILED, InvalidInputException: \"The ARN for the CloudWatch Logs log group is invalid.\" The region is what it objects to: the same call with a us-east-1 ARN for a log group that does not exist gets past that check and answers InsufficientCloudWatchLogsResourcePolicy instead (ROLLBACK_COMPLETE)"
addedOn: 2026-09-10
