id: pf-s3-lifecycle-object-size-order
service: s3
benchRegion: us-east-1
resourceTypes: [AWS::S3::Bucket]
severity: ERROR
title: "ObjectSizeGreaterThan must be smaller than ObjectSizeLessThan"
constraintSource: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: ObjectSizeGreaterThan 1000 with ObjectSizeLessThan 1000 -> \"'ObjectSizeLessThan' has to be a value greater than 'ObjectSizeGreaterThan'.\" (ROLLBACK_COMPLETE); pass 999 / 1000 -> CREATE_COMPLETE. Equal is the closest violating pair because the rule fires at `>=`."
addedOn: 2026-09-06
