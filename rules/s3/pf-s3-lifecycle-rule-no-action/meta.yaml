id: pf-s3-lifecycle-rule-no-action
service: s3
resourceTypes: [AWS::S3::Bucket]
severity: ERROR
title: A lifecycle rule needs at least one action
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-s3-bucket-rule.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1 (s02): rule with Status+Prefix only -> \"At least one of [ExpirationDate,ExpirationInDays,AbortIncompleteMultipartUpload,Transition,Transitions,NoncurrentVersionExpirationInDays,NoncurrentVersionTransition,NoncurrentVersionTransitions,NoncurrentVersionExpiration,ExpiredObjectDeleteMarker] needs to be specified\". ROLLBACK_COMPLETE. The field list in the rule is verbatim from this error; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::S3::Bucket.LifecycleConfiguration.Rules.*.ExpirationInDays -> ROLLBACK_COMPLETE with \"Invalid request provided: At least one of [ExpirationDate,ExpirationInDays,AbortIncompleteMultipartUpload,Transition,Transitions,NoncurrentVersionExpirationI...\""
  expect: "Invalid request provided: At least one of [ExpirationDate,ExpirationInDays"
addedOn: 2026-09-02
omissionFails:
  - "AWS::S3::Bucket.LifecycleConfiguration.Rules.*.ExpirationInDays"
