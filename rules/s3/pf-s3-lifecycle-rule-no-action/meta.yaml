  evidence: "bench 2026-09-02 ap-northeast-1 (s02): rule with Status+Prefix only -> \"At least one of [ExpirationDate,ExpirationInDays,AbortIncompleteMultipartUpload,Transition,Transitions,NoncurrentVersionExpirationInDays,NoncurrentVersionTransition,NoncurrentVersionTransitions,NoncurrentVersionExpiration,ExpiredObjectDeleteMarker] needs to be specified\". ROLLBACK_COMPLETE. The field list in the rule is verbatim from this error."
