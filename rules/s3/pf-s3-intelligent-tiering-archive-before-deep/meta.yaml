severity: ERROR
title: "ARCHIVE_ACCESS must come before DEEP_ARCHIVE_ACCESS"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-s3-bucket-intelligenttieringconfiguration.html
