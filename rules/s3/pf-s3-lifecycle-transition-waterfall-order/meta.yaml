id: pf-s3-lifecycle-transition-waterfall-order
service: s3
benchRegion: us-east-1
resourceTypes: [AWS::S3::Bucket]
severity: ERROR
title: "Lifecycle transitions may only move down the storage-class waterfall"
constraintSource: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: GLACIER at 89 days behind STANDARD_IA at 90 -> \"'Days' in the 'Transition' action for StorageClass 'GLACIER' for filter '(prefix=)' must be greater than 'Days' in the 'Transition' action for StorageClass 'STANDARD_IA'\" (ROLLBACK_COMPLETE); pass STANDARD_IA 30, GLACIER 90 -> CREATE_COMPLETE. The pass cannot sit on the limit (the two transitions on the same day): S3 wants the later class strictly later and at least 30 days after an IA transition, so the exact limit is not a deployable template — see rules/_boundary-exceptions.txt."
addedOn: 2026-09-06
