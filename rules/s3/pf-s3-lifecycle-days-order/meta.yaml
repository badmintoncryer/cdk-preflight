id: pf-s3-lifecycle-days-order
service: s3
benchRegion: us-east-1
resourceTypes: [AWS::S3::Bucket]
severity: ERROR
title: Lifecycle archive transitions must come 30+ days after IA, and expiration after every transition
constraintSource: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: STANDARD_IA at 30 days with GLACIER at 59 and ExpirationInDays 59 -> \"'Days' in the 'Transition' action for StorageClass 'GLACIER' for filter '(prefix=)' must be 30 days more than 'filter '(prefix=)'' in the 'Transition' action for StorageClass 'STANDARD_IA'\" (ROLLBACK_COMPLETE; S3 reports the 30-day gap first, so the ExpirationInDays <= TransitionInDays branch stays hidden behind it even though 59/59 sits on its boundary too); pass STANDARD_IA 30, GLACIER 60, ExpirationInDays 61 -> CREATE_COMPLETE."
addedOn: 2026-09-01
