repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1 (s07): in-template destination bucket without VersioningConfiguration (Destination.Bucket via Fn::GetAtt) -> \"Destination bucket must have versioning enabled.\" ROLLBACK_COMPLETE. Fn::GetAtt Arn resolves to the target's logical ID (probe 2026-09-02), enabling the cross-resource read. Suspended-status variant not deployed; inferred from the same state check."
