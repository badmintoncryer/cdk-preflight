id: pf-s3-lifecycle-min-storage-duration-chain
service: s3
benchRegion: us-east-1
resourceTypes: [AWS::S3::Bucket]
severity: ERROR
title: "A transition must wait out the minimum storage duration of the class it leaves"
constraintSource: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-18 us-east-1: fail GLACIER_IR at 4 days and DEEP_ARCHIVE at 93 days (89 days apart) -> ROLLBACK_COMPLETE \"'Days' in the 'Transition' action for StorageClass 'DEEP_ARCHIVE' for filter '(prefix=)' must be 90 days more than 'filter '(prefix=)'' in the 'Transition' action for StorageClass 'GLACIER_IR'\"; pass GLACIER_IR at 30 days and DEEP_ARCHIVE at 120 days (90 days apart) -> CREATE_COMPLETE"
  expect: "Days' in the 'Transition' action for StorageClass 'DEEP_ARCHIVE' for filter '(prefix=)' must be 90 days more than 'filter '(prefix=)'' in the 'Transition' action for StorageClass 'GLACIER_IR"
addedOn: 2026-09-06
