id: pf-s3-policy-public-with-block-public-policy
service: s3
benchRegion: us-east-1
resourceTypes: [AWS::S3::BucketPolicy, AWS::S3::Bucket]
severity: ERROR
title: "A public bucket policy cannot be put on a bucket that blocks public policies"
constraintSource: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
