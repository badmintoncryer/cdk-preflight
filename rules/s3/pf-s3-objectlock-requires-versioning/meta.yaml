id: pf-s3-objectlock-requires-versioning
service: s3
resourceTypes: [AWS::S3::Bucket]
severity: ERROR
title: ObjectLockConfiguration needs versioning enabled
constraintSource: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1: ObjectLockConfiguration alone (s05) -> \"Versioning must be 'Enabled' on the bucket to apply a Object Lock configuration\" (409), ROLLBACK_COMPLETE. Same config with VersioningConfiguration Enabled and no ObjectLockEnabled (s05b) -> CREATE_COMPLETE, killing the 'ObjectLockConfiguration requires ObjectLockEnabled' hypothesis (BROKEN-EXPECTATION; S3 allows Object Lock on existing versioned buckets since 2023). Suspended-status variant inferred from the same state check."
addedOn: 2026-09-02
