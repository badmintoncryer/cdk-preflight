id: pf-s3-bucket-policy-principal
service: s3
resourceTypes: [AWS::S3::BucketPolicy]
severity: ERROR
title: Bucket policy statements need a Principal
constraintSource: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-policies.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 ap-northeast-1 (s09): statement without Principal -> \"Missing required field Principal\". ROLLBACK_COMPLETE after ~15 min of handler retries — the slow failure mode is part of the pain this rule removes; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::S3::BucketPolicy.PolicyDocument.Statement.*.Principal -> ROLLBACK_COMPLETE with \"Missing required field Principal\""
addedOn: 2026-09-02
omissionFails:
  - "AWS::S3::BucketPolicy.PolicyDocument.Statement.*.Principal"
