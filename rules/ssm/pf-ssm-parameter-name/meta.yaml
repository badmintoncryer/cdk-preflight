id: pf-ssm-parameter-name
service: ssm
resourceTypes: [AWS::SSM::Parameter]
severity: ERROR
title: "Parameter Name must not start with aws or ssm (case-insensitive), must not end with / or contain empty segments, uses only [A-Za-z0-9_.-] per segment, and with the ARN prefix must stay within 1011 characters"
constraintSource: https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_PutParameter.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a 967 character name (1012 characters once the us-east-1 ARN prefix is counted) -> \"Access denied for operation 'PutParameter'.\" ROLLBACK_COMPLETE (the chained resources carry the reserved /ssm/ prefix, a trailing slash and a space inside a segment); pass 966 characters -> CREATE_COMPLETE. api 2026-09-13 us-east-1 PutParameter: 966 is accepted and 967 is rejected with AccessDeniedException on the oversized ARN. The limit is on the ARN, so the allowed name length depends on the length of the region name."
addedOn: 2026-09-05
