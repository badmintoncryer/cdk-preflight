id: pf-ssm-document-content
service: ssm
resourceTypes: [AWS::SSM::Document]
severity: ERROR
title: "Document Content must be JSON for DocumentFormat JSON, have mainSteps (2.x/0.3) or runtimeConfig (1.2), name every step uniquely with a known plugin/action, declare typed parameters that every {{ ref }} resolves to, and keep Automation step links (nextStep, onFailure, isEnd, outputs) consistent"
constraintSource: https://docs.aws.amazon.com/systems-manager/latest/userguide/documents-schemas-features.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Invalid request provided: Unknown plugin name: aws:doesNotExist\"; pass template -> CREATE_COMPLETE"
addedOn: 2026-09-05
