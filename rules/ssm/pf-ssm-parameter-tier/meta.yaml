id: pf-ssm-parameter-tier
service: ssm
resourceTypes: [AWS::SSM::Parameter]
severity: ERROR
title: "Standard-tier parameters (Tier omitted uses the account default, normally Standard) hold at most 4096 characters and no Policies; Advanced and Intelligent-Tiering hold at most 8192"
constraintSource: https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_PutParameter.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a Standard parameter with a 4097 character value -> \"Error occurred during operation 'PutParameter'.\" ROLLBACK_COMPLETE (the CloudFormation handler masks the service error; the chained resources carry an Advanced parameter of 8193 characters and a Standard parameter with policies); pass Standard 4096 and Advanced 8192 with a policy -> CREATE_COMPLETE. api 2026-09-13 us-east-1 PutParameter: 4097 -> \"Standard tier parameters support a maximum parameter value of 4096 characters.\", 8193 -> \"Advanced-tier parameters support a maximum parameter value of 8192 characters.\", 4096 and 8192 accepted."
addedOn: 2026-09-05
