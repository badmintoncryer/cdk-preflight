id: pf-ssm-parameter-policies
service: ssm
resourceTypes: [AWS::SSM::Parameter]
severity: ERROR
title: "Policies is a JSON array of at most 10 {Type, Version \"1.0\", Attributes} entries: one Expiration with an ISO-8601 Timestamp, ExpirationNotification (Before + Unit) only alongside it, NoChangeNotification (After + Unit), Unit Days or Hours"
constraintSource: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-policies.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: 11 policies -> \"Error occurred during operation 'PutParameter'.\" ROLLBACK_COMPLETE (the handler masks the service error; the chained resources carry an unknown policy type and a non-array Policies string); pass 10 policies -> CREATE_COMPLETE. api 2026-09-13 us-east-1 PutParameter: 11 -> PoliciesLimitExceededException \"Number of policies attached to a parameter cannot exceed 10\". Ten ExpirationNotification policies on their own are rejected for another reason (\"Expiration notification policies are missing expiration policy\"), so the pass is one Expiration plus nine ExpirationNotification."
addedOn: 2026-09-05
