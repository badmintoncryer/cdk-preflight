id: pf-ssm-parameter-policies
service: ssm
resourceTypes: [AWS::SSM::Parameter]
severity: ERROR
title: "Policies is a JSON array of at most 10 {Type, Version \"1.0\", Attributes} entries: one Expiration with an ISO-8601 Timestamp, ExpirationNotification (Before + Unit) only alongside it, NoChangeNotification (After + Unit), Unit Days or Hours"
constraintSource: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-policies.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Error occurred during operation 'PutParameter'.\" (the CloudFormation handler masks the service error; the same input sent straight to the API is rejected with \"Policy type Foo is not supported.\"); pass template -> CREATE_COMPLETE"
addedOn: 2026-09-05
