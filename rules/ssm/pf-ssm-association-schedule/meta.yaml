id: pf-ssm-association-schedule
service: ssm
resourceTypes: [AWS::SSM::Association]
severity: ERROR
title: "Association schedules: rate() of at least 30 minutes with matching singular/plural unit; cron() only in the accepted forms (every 30 minutes, every 1/2/4/8/12 hours, a time every day or on one weekday, nth or last weekday of the month); at() only with ApplyOnlyAtCronInterval; ApplyOnlyAtCronInterval not with rate(); ScheduleOffset only with ApplyOnlyAtCronInterval and a #n/L weekday cron"
constraintSource: https://docs.aws.amazon.com/systems-manager/latest/userguide/reference-cron-and-rate-expressions.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Invalid request provided: Schedule expression rate(15 minutes) is not valid. Minimum interval for rate based association is 30 minutes.\"; pass template -> CREATE_COMPLETE"
addedOn: 2026-09-05
