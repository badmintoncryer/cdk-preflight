id: pf-elbv2-lb-name
service: elbv2
benchRegion: ap-northeast-1
resourceTypes: [AWS::ElasticLoadBalancingV2::LoadBalancer]
severity: ERROR
title: Load balancer names are at most 32 alphanumeric/hyphen chars and cannot begin with internal- or a hyphen
constraintSource: https://docs.aws.amazon.com/elasticloadbalancing/latest/APIReference/API_CreateLoadBalancer.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: the 33-character name rolled back with \"The load balancer name 'internal-aaaaaaaaaaaaaaaaaaaaaa_-' cannot be longer than '32' characters\". The length answers first, so the internal- prefix, the trailing hyphen, the underscore and the second load balancer's leading hyphen are all masked; CreateLoadBalancer reports each on its own (\"cannot begin with 'internal-'\", \"cannot end with a hyphen(-)\", \"can only contain characters that are alphanumeric characters and hyphens(-)\"). The pass template's 32-character name reached CREATE_COMPLETE."
addedOn: 2026-09-03
