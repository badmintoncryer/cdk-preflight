id: pf-elbv2-tg-attr-health-percentage-range
service: elbv2
resourceTypes: [AWS::ElasticLoadBalancingV2::TargetGroup]
severity: ERROR
title: "A minimum healthy target percentage is off or 1-100"
constraintSource: https://docs.aws.amazon.com/elasticloadbalancing/latest/APIReference/API_TargetGroupAttribute.html
benchRegion: us-east-1
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: target_group_health.dns_failover.minimum_healthy_targets.percentage 101 rolled back with \"'target_group_health.dns_failover.minimum_healthy_targets.percentage' must be 'off' or an integer from 1 to 100 inclusive\"; the 0 on the second target group is masked by the DependsOn order and answers \"must be 'off' or a positive integer\". Each threshold sits on its own target group because dns_failover must stay at or above unhealthy_state_routing. The pass template carries 100 and 1 and reached CREATE_COMPLETE."
addedOn: 2026-09-08
