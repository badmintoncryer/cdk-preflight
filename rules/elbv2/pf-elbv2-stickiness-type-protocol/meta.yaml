id: pf-elbv2-stickiness-type-protocol
service: elbv2
resourceTypes: [AWS::ElasticLoadBalancingV2::TargetGroup]
severity: ERROR
title: Stickiness type lb_cookie needs an HTTP-protocol target group, source_ip a TCP one
constraintSource: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/sticky-sessions.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: Protocol TCP + stickiness.type lb_cookie (e06) -> \"Stickiness type 'lb_cookie' is not supported for target groups with the TCP protocol\"; Protocol HTTP + stickiness.type source_ip (e06c) -> the mirror error for HTTP. Both ROLLBACK_COMPLETE. Claims are limited to the two benched protocol/type pairs; app_cookie x TCP is masked by the cookie-name requirement (see pf-elbv2-app-cookie-name)."
addedOn: 2026-09-03
