id: pf-elbv2-rule-condition-empty-values
service: elbv2
resourceTypes: [AWS::ElasticLoadBalancingV2::ListenerRule]
severity: ERROR
title: "A rule condition matches at least one value"
constraintSource: https://docs.aws.amazon.com/elasticloadbalancing/latest/APIReference/API_RuleCondition.html
benchRegion: us-east-1
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-09 us-east-1: the fail template rolled back with \"You must provide exactly one of the following: ['Values' 'RegexValues'] for config of type 'HostHeaderConfig'\"; the pass template reached CREATE_COMPLETE.; omission bench 2026-11-25 us-east-1: pass template without AWS::ElasticLoadBalancingV2::ListenerRule.Conditions.*.PathPatternConfig.Values -> ROLLBACK_COMPLETE with \"For conditions of type 'path-pattern', you must specify the following fields: 'Values or RegexValues or PathPatternConfig'\""
  expect: "You must provide exactly one of the following: ['Values' 'RegexValues'] for config of type 'HostHeaderConfig"
addedOn: 2026-09-08
omissionFails:
  - "AWS::ElasticLoadBalancingV2::ListenerRule.Conditions.*.PathPatternConfig.Values"
