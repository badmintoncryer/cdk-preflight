id: pf-elbv2-tg-deregistration-delay-range
service: elbv2
benchRegion: us-east-1
resourceTypes: [AWS::ElasticLoadBalancingV2::TargetGroup]
severity: ERROR
title: Target group deregistration_delay.timeout_seconds must be between 0 and 3600
constraintSource: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html#deregistration-delay
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: deregistration_delay.timeout_seconds 3601 rolled back with \"'deregistration_delay.timeout_seconds' value '3601' must be between '0-3600' inclusive\"; the -1 on the second target group is masked by the DependsOn order and answers the same message for '-1'. The pass template carries 0 and 3600 and reached CREATE_COMPLETE."
addedOn: 2026-09-01
