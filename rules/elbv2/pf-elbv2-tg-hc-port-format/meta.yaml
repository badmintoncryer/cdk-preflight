id: pf-elbv2-tg-hc-port-format
service: elbv2
resourceTypes: [AWS::ElasticLoadBalancingV2::TargetGroup]
severity: ERROR
title: "The health check port is traffic-port or a port number"
constraintSource: https://docs.aws.amazon.com/elasticloadbalancing/latest/APIReference/API_CreateTargetGroup.html
benchRegion: us-east-1
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: HealthCheckPort 65536 rolled back with \"Health check port '65536' must be within '1-65535' or 'traffic-port'\"; the 0 and the traffic_port (underscore) target groups are masked by the DependsOn order and answer the same message. The pass template carries 1, 65535 and traffic-port and reached CREATE_COMPLETE."
addedOn: 2026-09-08
