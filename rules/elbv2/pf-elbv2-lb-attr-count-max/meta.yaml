id: pf-elbv2-lb-attr-count-max
service: elbv2
resourceTypes: [AWS::ElasticLoadBalancingV2::LoadBalancer]
severity: ERROR
title: "A load balancer carries at most 20 attributes"
constraintSource: https://docs.aws.amazon.com/elasticloadbalancing/latest/APIReference/API_LoadBalancerAttribute.html
benchRegion: us-east-1
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: 21 attributes rolled back with \"1 validation error detected: Value '[LoadBalancerAttribute(key=..., value=...), ... 21 entries]' at 'attributes' failed to satisfy constraint: Member must have length less than or equal to 20\"; the pass template carries exactly 20 and reached CREATE_COMPLETE. Reaching 20 valid attributes needs a log target: only 16 keys stand alone, a *.s3.prefix is refused without its *.s3.bucket, and the service checks the bucket permission even with logging off, so the template creates the bucket and the policy itself. Running the pass side leaves that bucket behind: ELB writes an ELBAccessLogTestFile into it as soon as the attribute is set, and CloudFormation cannot delete a bucket that is not empty; empty and remove it by hand afterwards."
addedOn: 2026-09-08
