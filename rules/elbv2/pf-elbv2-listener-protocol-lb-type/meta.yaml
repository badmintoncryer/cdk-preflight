id: pf-elbv2-listener-protocol-lb-type
service: elbv2
resourceTypes: [AWS::ElasticLoadBalancingV2::Listener, AWS::ElasticLoadBalancingV2::LoadBalancer]
severity: ERROR
title: Listener protocols must match the load balancer type
constraintSource: https://docs.aws.amazon.com/elasticloadbalancing/latest/APIReference/API_CreateListener.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: application LB + TCP listener (e17) -> \"Listener protocol 'TCP' must be one of 'HTTP, HTTPS'\"; network LB + HTTP listener (e17b) -> \"Listener protocol 'HTTP' must be one of 'TCP, QUIC, TCP_QUIC, UDP, TCP_UDP, TLS'\". Both allow-sets are quoted verbatim from the service (QUIC and TCP_QUIC included). ROLLBACK_COMPLETE for both."
addedOn: 2026-09-03
