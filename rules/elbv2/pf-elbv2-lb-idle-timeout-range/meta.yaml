id: pf-elbv2-lb-idle-timeout-range
service: elbv2
resourceTypes: [AWS::ElasticLoadBalancingV2::LoadBalancer]
severity: ERROR
title: ALB idle_timeout.timeout_seconds must be between 1 and 4000
constraintSource: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html#connection-idle-timeout
upstream: none
repro:
  method: research-case
  evidence: "bench 2026-09-13 us-east-1: idle_timeout.timeout_seconds 4001 rolled back with \"The value of 'idle_timeout.timeout_seconds' cannot be greater than 4000 characters\" (the service says \"characters\" for a count of seconds). The 0 on the second load balancer is masked by the DependsOn order; ModifyLoadBalancerAttributes answers it directly with \"cannot be less than 1 characters\". The pass template carries 1 and 4000 and reached CREATE_COMPLETE."
addedOn: 2026-09-01
