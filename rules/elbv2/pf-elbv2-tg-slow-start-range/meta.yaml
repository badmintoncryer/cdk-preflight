id: pf-elbv2-tg-slow-start-range
service: elbv2
benchRegion: us-east-1
resourceTypes: [AWS::ElasticLoadBalancingV2::TargetGroup]
severity: ERROR
title: Target group slow_start.duration_seconds must be 0 or between 30 and 900
constraintSource: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html#slow-start-mode
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: slow_start.duration_seconds 901 rolled back with \"'slow_start.duration_seconds' value '901' must be between '30-900' inclusive\"; the 29 and -1 target groups are masked by the DependsOn order and answer the same message. The pass template carries 0 (disabled), 30 and 900 and reached CREATE_COMPLETE."
addedOn: 2026-09-01
