id: pf-elbv2-tg-name
service: elbv2
benchRegion: us-east-1
resourceTypes: [AWS::ElasticLoadBalancingV2::TargetGroup]
severity: ERROR
title: Target group names are at most 32 alphanumeric/hyphen chars and cannot start or end with a hyphen
constraintSource: https://docs.aws.amazon.com/elasticloadbalancing/latest/APIReference/API_CreateTargetGroup.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: the 33-character name rolled back with \"Target group name 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' cannot be longer than '32' characters\"; the 32-character name that starts and ends with a hyphen is masked by the DependsOn order and answers \"Value '-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-' at 'targetGroupName' failed to satisfy constraint: Member must satisfy regular expression pattern: (?!^-)(?!.*-$)^[A-Za-z0-9-]+$\". The pass template's 32-character name reached CREATE_COMPLETE."
addedOn: 2026-09-04
