id: pf-codedeploy-config-name-reserved-prefix
service: codedeploy
benchRegion: us-east-1
resourceTypes: [AWS::CodeDeploy::DeploymentConfig]
severity: ERROR
title: "A custom deployment configuration may not use the CodeDeployDefault. prefix"
constraintSource: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: DeploymentConfigName \"CodeDeployDefault.MyConfig\" -> \"The prefix CodeDeployDefault. is reserved for predefined configuration names\" (ROLLBACK_COMPLETE); pass \"CodeDeployDefault-<stack name>\" -> CREATE_COMPLETE. Only the dot makes it reserved: api-probe 2026-09-14 us-east-1 accepts \"CodeDeployDefaultFoo\" and \"codedeploydefault.Foo\"."
addedOn: 2026-09-14
