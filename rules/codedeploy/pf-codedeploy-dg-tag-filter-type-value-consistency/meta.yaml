id: pf-codedeploy-dg-tag-filter-type-value-consistency
service: codedeploy
benchRegion: us-east-1
resourceTypes: [AWS::CodeDeploy::DeploymentGroup]
severity: ERROR
title: "A KEY_ONLY tag filter carries no Value and a VALUE_ONLY tag filter carries no Key"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-codedeploy-deploymentgroup-ec2tagfilter.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: Ec2TagFilters carrying a KEY_ONLY filter with a Value and a VALUE_ONLY filter with a Key -> \"Values must not be provided for key-only filters.\" (ROLLBACK_COMPLETE); pass the same two filters with only the half their Type matches -> CREATE_COMPLETE. The mirror half is the same check from the other side: VALUE_ONLY with a Key alone is refused with \"Keys must not be provided for value-only filters.\" (probe D2, 2026-09-14 us-east-1). The tag sets are checked too (probe D7, same message) and so are the on-premises filters, though those come back as an InvalidTagException with an empty message (probes D5/D6), which is why the fixtures use the EC2 form the service names."
addedOn: 2026-09-14
