id: pf-codedeploy-config-traffic-routing-block-matches-type
service: codedeploy
benchRegion: us-east-1
resourceTypes: [AWS::CodeDeploy::DeploymentConfig]
severity: ERROR
title: "TrafficRoutingConfig must carry exactly the sub-block its Type names"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-codedeploy-deploymentconfig-trafficroutingconfig.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: Type AllAtOnce carrying a TimeBasedCanary block -> \"TimeBasedCanaryConfiguration should be null for AllAtOnce type\" (ROLLBACK_COMPLETE); Type TimeBasedCanary with no block in the same fail template -> \"TimeBasedCanaryConfiguration should not be null for TimeBasedCanary type\" (api-probe 2026-09-14 us-east-1); pass Type TimeBasedCanary with its own block plus Type AllAtOnce with none -> CREATE_COMPLETE. api-probe also measured AllAtOnce+TimeBasedLinear, TimeBasedCanary+TimeBasedLinear and TimeBasedLinear+TimeBasedCanary: one check, one message shape."
addedOn: 2026-09-14
