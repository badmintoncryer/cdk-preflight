id: pf-codedeploy-config-traffic-routing-percentage-range
service: codedeploy
benchRegion: us-east-1
resourceTypes: [AWS::CodeDeploy::DeploymentConfig]
severity: ERROR
title: "Traffic routing percentage must be between 1 and 99"
constraintSource: https://docs.aws.amazon.com/codedeploy/latest/userguide/limits.html
