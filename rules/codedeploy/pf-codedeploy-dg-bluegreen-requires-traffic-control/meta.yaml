id: pf-codedeploy-dg-bluegreen-requires-traffic-control
service: codedeploy
benchRegion: us-east-1
resourceTypes: [AWS::CodeDeploy::DeploymentGroup, AWS::CodeDeploy::Application]
severity: ERROR
title: "A BLUE_GREEN deployment style requires WITH_TRAFFIC_CONTROL"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-codedeploy-deploymentgroup-deploymentstyle.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: Server application, DeploymentStyle BLUE_GREEN + WITHOUT_TRAFFIC_CONTROL -> \"BLUE_GREEN deployment type not supported with WITHOUT_TRAFFIC_CONTROL option\" (ROLLBACK_COMPLETE); pass BLUE_GREEN + WITH_TRAFFIC_CONTROL with a LoadBalancerInfo -> CREATE_COMPLETE. api-probe 2026-09-14 us-east-1: the same shape under a Lambda application returns the Lambda message instead, which is why this rule skips Lambda groups."
addedOn: 2026-09-14
