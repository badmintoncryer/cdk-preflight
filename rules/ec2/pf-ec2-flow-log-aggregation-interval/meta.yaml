id: pf-ec2-flow-log-aggregation-interval
service: ec2
resourceTypes: [AWS::EC2::FlowLog]
severity: ERROR
title: Flow log MaxAggregationInterval accepts only 60 or 600 seconds
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-flowlog.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: CreateFlowLogs with MaxAggregationInterval=300 -> \"InvalidParameter: Invalid Flow Log Max Aggregation Interval.\"; the same call with 600 passed parameter validation. bench 2026-09-08 ap-northeast-1: MaxAggregationInterval 300 -> ROLLBACK_COMPLETE with the same message; 600 -> CREATE_COMPLETE."
addedOn: 2026-09-08
