  evidence: "api 2026-09-08 ap-northeast-1: AssociateVpcCidrBlock with a range inside the primary -> \"CidrConflict: CIDR range conflicts with 10.99.0.0/16 with association ID vpc-cidr-assoc-...\". bench 2026-09-08 ap-northeast-1: secondary 10.60.128.0/17 against primary 10.60.0.0/16 -> ROLLBACK_COMPLETE \"CIDR range conflicts with 10.60.0.0/16\"; 10.61.0.0/16 -> CREATE_COMPLETE."
