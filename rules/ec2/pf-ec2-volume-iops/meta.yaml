id: pf-ec2-volume-iops
service: ec2
benchRegion: us-east-1
resourceTypes: [AWS::EC2::Volume]
severity: ERROR
title: EBS Iops/Throughput must match the volume type's supported ranges and ratios
constraintSource: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-13 us-east-1 (CreateVolume): gp3 Iops 99 -> \"Volume iops of 99 is too low; minimum is 100.\", 80001 -> \"too high; maximum is 80000.\", 5001 on 10 GiB -> \"Iops to volume size ratio of 500.100000 is too high; maximum is 500\", Throughput 2001 -> \"too high; maximum is 2000.\", Throughput 751 with no Iops -> \"Throughput (MiBps) to iops ratio of 0.250333 is too high; maximum is 0.250000 MiBps per iops\"; io1 64001 and 501-on-10-GiB, io2 256001 and 10001-on-10-GiB rejected the same way; gp2 Iops and st1 Throughput -> \"not supported\". gp3's documented 3000 IOPS / 125 MiB/s minimums are NOT rejections: --iops 2999 was created with Iops=3000 and --throughput 0/1/124 with Throughput=125, so those two bounds were false positives and are gone (the floor EC2 enforces is 100 IOPS). bench 2026-09-13 us-east-1: fail chains all of the ends above and reports the first (Throughput 751 against the default 3000 IOPS) -> ROLLBACK_COMPLETE; pass = gp3 10 GiB Throughput 750 (the default-IOPS ceiling) and gp3 16 GiB Iops 8000 Throughput 2000 (500 IOPS/GiB, 0.25 MiB/s per IOPS and the 2000 MiB/s cap, all three exactly at the limit) -> CREATE_COMPLETE."
addedOn: 2026-09-01
