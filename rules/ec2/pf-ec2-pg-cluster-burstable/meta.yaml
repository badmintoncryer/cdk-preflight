id: pf-ec2-pg-cluster-burstable
service: ec2
resourceTypes: [AWS::EC2::Instance, AWS::EC2::PlacementGroup]
severity: ERROR
title: Burstable instance types are not supported in cluster placement groups
constraintSource: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-groups.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: cluster placement group + t3.micro (e11), t4g.micro (e11b), t2.micro (e11c), t3a.micro (e11d) each -> \"Cluster placement groups are not supported by the '<type>' instance type.\" ROLLBACK_COMPLETE. All four claimed families benched individually; nothing launches (failure precedes RunInstances success)."
addedOn: 2026-09-03
