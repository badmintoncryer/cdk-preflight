id: pf-ec2-cpu-options-combination
service: ec2
resourceTypes: [AWS::EC2::Instance]
severity: ERROR
title: CpuOptions ThreadsPerCore and CoreCount must be in range
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-instance.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: c5.xlarge with ThreadsPerCore 0, 3 and 4 all -> \"A value of N for ThreadsPerCore is not a valid value for the c5.xlarge instance type. Valid values are [1, 2].\"; CoreCount 0 -> the same shape for CoreCount. The rule keeps to these two type-independent bounds rather than transcribing the per-type table. bench 2026-09-08 ap-northeast-1: c5.xlarge with ThreadsPerCore 3 -> ROLLBACK_COMPLETE \"A value of 3 for ThreadsPerCore is not a valid value for the c5.xlarge instance type. Valid values are [1, 2].\"; ThreadsPerCore 1 -> CREATE_COMPLETE."
addedOn: 2026-09-08
