id: pf-ec2-flow-log-transit-gateway-traffic-type
service: ec2
resourceTypes: [AWS::EC2::FlowLog]
severity: ERROR
title: A Transit Gateway flow log cannot take TrafficType
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-flowlog.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: FlowLog with ResourceType TransitGateway + TrafficType ALL -> ROLLBACK_COMPLETE \"traffic-type is not supported when the resource-type is TransitGateway or TransitGatewayAttachment\"; the same template without TrafficType -> CREATE_COMPLETE. The API probe could not decide this one (CreateFlowLogs looks the Transit Gateway up first), so the real-deploy gate settled it."
addedOn: 2026-09-08
