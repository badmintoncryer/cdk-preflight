id: pf-ec2-sg-cidr-valid
service: ec2
resourceTypes: [AWS::EC2::SecurityGroup, AWS::EC2::SecurityGroupIngress, AWS::EC2::SecurityGroupEgress]
severity: ERROR
title: Security group rule CidrIp must be a well-formed IPv4 CIDR
constraintSource: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_AuthorizeSecurityGroupIngress.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: CidrIp 10.0.0.0/33 (e14) -> \"CIDR block 10.0.0.0/33 is malformed\"; CidrIp 10.0.999.0/24 (e14b) -> \"CIDR block 10.0.999.0/24 is malformed\". Both ROLLBACK_COMPLETE. Claim limited to numeric dotted-quad shapes with an out-of-range octet or prefix; other malformed strings are unbenched."
addedOn: 2026-09-03
