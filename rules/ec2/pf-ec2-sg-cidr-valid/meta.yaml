id: pf-ec2-sg-cidr-valid
service: ec2
resourceTypes: [AWS::EC2::SecurityGroup, AWS::EC2::SecurityGroupIngress, AWS::EC2::SecurityGroupEgress]
severity: ERROR
title: Security group rule CidrIp must be a well-formed IPv4 CIDR
constraintSource: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_AuthorizeSecurityGroupIngress.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: one security group with CidrIp 10.0.0.0/33 and 10.0.0.256/24 -> \"CIDR block 10.0.0.0/33 is malformed\" (ROLLBACK_COMPLETE; EC2 reports the first rejected entry, so the 256 octet stays hidden behind it); pass CidrIp 10.0.0.255/32 -> CREATE_COMPLETE. Both fixtures build their own VPC: with a made-up VpcId the create fails with \"The vpc ID 'vpc-11112222' does not exist\" before EC2 ever looks at the CIDR, which is how this pair read until 2026-09-14. Claim limited to numeric dotted-quad shapes with an out-of-range octet or prefix; other malformed strings are unbenched."
addedOn: 2026-09-03
