id: pf-ec2-tgw-route-blackhole-exclusive
service: ec2
resourceTypes: [AWS::EC2::TransitGatewayRoute]
severity: ERROR
title: A blackhole transit gateway route cannot name an attachment
constraintSource: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_CreateTransitGatewayRoute.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: CreateTransitGatewayRoute with --blackhole and --transit-gateway-attachment-id -> \"The request must contain exactly one of Blackhole, or TransitGatewayAttachmentId\"; the same call with --blackhole alone created the route (State: blackhole). The attachment id in the fail fixture is a literal that does not exist, which is enough because the exclusivity is checked before the attachment is looked up. bench 2026-09-09 ap-northeast-1: fail -> ROLLBACK_COMPLETE with that message, pass -> CREATE_COMPLETE"
addedOn: 2026-09-09
