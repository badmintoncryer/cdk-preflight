id: pf-ec2-vpce-service-region
service: ec2
resourceTypes: [AWS::EC2::VPCEndpoint]
severity: ERROR
title: VPC endpoint service names must use the deploy region unless ServiceRegion is set
constraintSource: https://docs.aws.amazon.com/vpc/latest/privatelink/privatelink-access-aws-services.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: Gateway (default type) + com.amazonaws.us-east-1.s3 (e09) -> \"Endpoint type (Gateway) does not match available service types ([Interface]).\"; Interface + the same name (e09c) -> \"The Vpc Endpoint Service 'com.amazonaws.us-east-1.s3' does not exist\". Cross-region names fail for both endpoint types; cross-region PrivateLink requires the ServiceRegion property, so the rule mutes when it is present."
addedOn: 2026-09-03
