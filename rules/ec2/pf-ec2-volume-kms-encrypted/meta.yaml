id: pf-ec2-volume-kms-encrypted
service: ec2
resourceTypes: [AWS::EC2::Volume]
severity: ERROR
title: KmsKeyId on a volume requires Encrypted to be true
constraintSource: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_CreateVolume.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: gp3 + KmsKeyId with Encrypted absent (e06) and with Encrypted false (e06b) both -> \"The parameter [KmsKeyId] requires the parameter Encrypted to be set.\" ROLLBACK_COMPLETE. Unresolvable Encrypted values (tokens) stay silent by design; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::EC2::Volume.Encrypted -> ROLLBACK_COMPLETE with \"The parameter [KmsKeyId] requires the parameter Encrypted to be set.\""
  expect: "The parameter [KmsKeyId] requires the parameter Encrypted to be set."
addedOn: 2026-09-03
omissionFails:
  - "AWS::EC2::Volume.Encrypted"
