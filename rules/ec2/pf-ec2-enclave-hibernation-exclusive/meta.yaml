id: pf-ec2-enclave-hibernation-exclusive
service: ec2
resourceTypes: [AWS::EC2::Instance]
severity: ERROR
title: Nitro Enclaves and hibernation cannot both be enabled
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-instance.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: RunInstances with --enclave-options Enabled=true and --hibernation-options Configured=true -> \"InvalidParameterCombination: You cannot enable Nitro Enclaves and hibernation on the same instance.\" bench 2026-09-08 ap-northeast-1: both enabled -> ROLLBACK_COMPLETE with the same message; enclaves alone -> CREATE_COMPLETE."
addedOn: 2026-09-08
