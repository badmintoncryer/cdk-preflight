id: pf-ec2-natgw-secondary-ip-exclusive
service: ec2
resourceTypes: [AWS::EC2::NatGateway]
severity: ERROR
title: NAT gateway secondary IP count and list are mutually exclusive
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-natgateway.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: SecondaryPrivateIpAddressCount together with SecondaryPrivateIpAddresses -> ROLLBACK_COMPLETE; the count alone -> CREATE_COMPLETE. The API probe could not decide it: CreateNatGateway --dry-run returned DryRunOperation for both calls. bench 2026-11-27 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"\"The request cannot contain both secondary private Ip addresses and secondary private Ip addresses count for NAT gateway with Connectivity Type private. (Service: Ec2, Status Code: 400, Request ID: a7af3c71-d775-4aad-9291-09bc69e97384) (SDK Attempt Count: 1)\" (RequestToken: ab94ac32-dbc3-5fd6-6c43-6d6fbee48f8d, HandlerErrorCode: InvalidRequest)\""
  expect: "The request cannot contain both secondary private Ip addresses and secondary private Ip addresses count for NAT gateway with Connectivity"
addedOn: 2026-09-08
