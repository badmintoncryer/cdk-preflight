id: pf-ec2-natgw-secondary-ip-exclusive
service: ec2
resourceTypes: [AWS::EC2::NatGateway]
severity: ERROR
title: NAT gateway secondary IP count and list are mutually exclusive
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-natgateway.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: SecondaryPrivateIpAddressCount together with SecondaryPrivateIpAddresses -> ROLLBACK_COMPLETE; the count alone -> CREATE_COMPLETE. The API probe could not decide it: CreateNatGateway --dry-run returned DryRunOperation for both calls."
addedOn: 2026-09-08
