id: pf-ec2-volume-multi-attach-type
service: ec2
resourceTypes: [AWS::EC2::Volume]
severity: ERROR
title: Multi-Attach is only available on io1 and io2 volumes
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-volume.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 ap-northeast-1: gp3 with MultiAttachEnabled -> ROLLBACK_COMPLETE; io2 with Iops and MultiAttachEnabled -> CREATE_COMPLETE. The API probe could not decide it: CreateVolume --dry-run returned DryRunOperation for both the violating and the control call."
addedOn: 2026-09-08
