id: pf-ec2-instance-ami-arch
service: ec2
resourceTypes: [AWS::EC2::Instance]
severity: ERROR
title: Instance type architecture must match the SSM public-parameter AMI architecture
constraintSource: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: t3.micro + al2023 arm64 SSM path (e12) -> \"The architecture 'x86_64' of the specified instance type does not match the architecture 'arm64' of the specified AMI.\" ROLLBACK_COMPLETE. Applies only to literal {{resolve:ssm:...}} ImageId strings whose path names arm64 or x86_64; Graviton families are recognized by the documented g-suffix convention plus a1, and mac* families are skipped."
addedOn: 2026-09-03
