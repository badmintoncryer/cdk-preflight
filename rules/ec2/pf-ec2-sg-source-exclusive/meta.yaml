id: pf-ec2-sg-source-exclusive
service: ec2
resourceTypes: [AWS::EC2::SecurityGroup, AWS::EC2::SecurityGroupIngress, AWS::EC2::SecurityGroupEgress]
severity: ERROR
title: A security group rule takes exactly one source/destination field
constraintSource: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_AuthorizeSecurityGroupIngress.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: embedded ingress CidrIp + SourceSecurityGroupId (e03b) -> \"Both CidrIp and SourceSecurityGroup cannot be specified\"; embedded egress CidrIp + DestinationSecurityGroupId (e03d) -> \"Only one of CidrIp, CidrIpv6, DestinationPrefixListId or DestinationSecurityGroupId can be specified\"; standalone ingress with two sources (e03c) and with zero (e03e), and standalone egress with two destinations (e03f) -> \"Exactly one of ... must be specified and not empty\". A source-less EMBEDDED ingress deployed clean (e03), so the zero-member direction applies only to the standalone resource types."
addedOn: 2026-09-03
