id: pf-ec2-vpn-pre-shared-key
service: ec2
resourceTypes: [AWS::EC2::VPNConnection]
severity: ERROR
title: VPN tunnel PreSharedKey must be 8-64 characters of [A-Za-z0-9._] and must not start with 0
constraintSource: https://docs.aws.amazon.com/vpn/latest/s2svpn/VPNTunnels.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-13 us-east-1: CreateVpnConnection with a 65-character PreSharedKey, with a 7-character one, with an 8-character one starting with 0, and with an 8-character one containing '-' are all rejected as \"Value for parameter PreSharedKey is invalid.\" The message never names the reason, so each end was probed on its own. bench 2026-09-13 us-east-1: fail (tunnel 1 = 65 characters, tunnel 2 = 7) -> ROLLBACK_COMPLETE with that message; pass (tunnel 1 = 64 characters, tunnel 2 = 8) -> CREATE_COMPLETE."
addedOn: 2026-09-06
