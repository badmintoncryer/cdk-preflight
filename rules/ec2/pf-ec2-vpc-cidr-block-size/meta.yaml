id: pf-ec2-vpc-cidr-block-size
service: ec2
resourceTypes: [AWS::EC2::VPC]
severity: ERROR
title: VPC IPv4 CIDR block netmask must be between /16 and /28
constraintSource: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-cidr-blocks.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-13 us-east-1: CreateVpc 10.98.0.0/15 -> \"The CIDR '10.98.0.0/15' is invalid.\", 10.99.0.0/29 -> the same for /29; /28 and /16 accepted. bench 2026-09-13 us-east-1: fail chains /15 then /29 and reports the /15 -> ROLLBACK_COMPLETE; pass = /28 plus /16 -> CREATE_COMPLETE, both ends measured. Write the /15 aligned (10.98.0.0/15): EC2 canonicalises the block before quoting it, so 10.99.0.0/15 comes back as 10.98.0.0/15 and the message stops matching the template."
addedOn: 2026-09-03
