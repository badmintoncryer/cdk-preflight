id: pf-ec2-nacl-rule-number-unique
service: ec2
resourceTypes: [AWS::EC2::NetworkAclEntry]
severity: ERROR
title: Network ACL rule numbers must be unique per direction
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/AWS_EC2.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: a second CreateNetworkAclEntry with rule number 100 in the same direction -> \"NetworkAclEntryAlreadyExists: The network acl entry identified by 100 already exists.\"; the same number with --egress succeeded, so the rule is scoped per direction. bench 2026-09-08 ap-northeast-1: two ingress entries numbered 100 -> ROLLBACK_COMPLETE \"The network acl entry identified by 100 already exists.\"; the same number split across ingress and egress -> CREATE_COMPLETE."
addedOn: 2026-09-08
