id: pf-ec2-prefix-list-name-reserved
service: ec2
resourceTypes: [AWS::EC2::PrefixList]
severity: ERROR
title: A managed prefix list name cannot use an AWS-reserved prefix
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-prefixlist.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: CreateManagedPrefixList --prefix-list-name com.amazonaws.cdkpf -> \"The prefix list name cannot begin with (com.amazonaws., com.amazon., com.aws.).\" The rule carries all three prefixes the message names, not just the one in the survey. bench 2026-09-08 ap-northeast-1: PrefixListName com.amazonaws.cdkpf -> ROLLBACK_COMPLETE; a plain name -> CREATE_COMPLETE."
addedOn: 2026-09-08
