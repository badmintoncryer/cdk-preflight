id: pf-ec2-vpc-cidr-reserved-range
service: ec2
resourceTypes: [AWS::EC2::VPC]
severity: ERROR
title: A VPC CIDR must not overlap a reserved IPv4 range
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-vpc.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: CreateVpc with 224.0.0.0/16, 127.0.0.0/16, 169.254.0.0/16 and 0.0.0.0/16 -> \"The CIDR '...' is invalid.\"; the controls 10.94.0.0/16, 100.64.0.0/16, 223.255.0.0/16 and 240.0.0.0/16 were all created (and deleted), so class E and CGNAT are allowed and are not in the rule. The first probe used the documented 224.0.0.0/4 and 127.0.0.0/8 masks and was a confounder: those are rejected for the /16-/28 netmask limit, not for the range. bench 2026-09-09 ap-northeast-1: fail -> ROLLBACK_COMPLETE, \"The CIDR '224.0.0.0/16' is invalid.\"; pass -> CREATE_COMPLETE"
addedOn: 2026-09-09
