id: pf-ec2-placement-group-spread-level
service: ec2
resourceTypes: [AWS::EC2::PlacementGroup]
severity: ERROR
title: SpreadLevel is only valid with the spread or partition strategy
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-placementgroup.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: CreatePlacementGroup --strategy cluster --spread-level host -> \"spread-level is only available with the 'spread' or 'partition' strategy.\"; the spread strategy created cleanly. The survey listed this as spread-only; the measured message allows partition too. bench 2026-09-08 ap-northeast-1: cluster + SpreadLevel -> ROLLBACK_COMPLETE; spread + SpreadLevel -> CREATE_COMPLETE."
addedOn: 2026-09-08
