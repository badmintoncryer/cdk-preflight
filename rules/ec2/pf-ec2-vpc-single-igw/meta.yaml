id: pf-ec2-vpc-single-igw
service: ec2
resourceTypes: [AWS::EC2::VPCGatewayAttachment]
severity: ERROR
title: A VPC accepts only one internet gateway attachment
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/AWS_EC2.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: AttachInternetGateway for a second gateway -> \"InvalidParameterValue: Network vpc-... already has an internet gateway attached\". bench 2026-09-08 ap-northeast-1: a second VPCGatewayAttachment on the same VPC -> ROLLBACK_COMPLETE \"IGW|vpc-0f42b3c0bd4f0168d already exists in stack\" (CloudFormation rejects it before the EC2 call); a single attachment -> CREATE_COMPLETE."
addedOn: 2026-09-08
