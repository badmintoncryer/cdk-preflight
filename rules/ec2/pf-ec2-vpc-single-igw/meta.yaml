id: pf-ec2-vpc-single-igw
service: ec2
resourceTypes: [AWS::EC2::VPCGatewayAttachment]
severity: ERROR
title: A VPC accepts only one internet gateway attachment
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/AWS_EC2.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: AttachInternetGateway for a second gateway -> \"InvalidParameterValue: Network vpc-... already has an internet gateway attached\". bench 2026-09-08 ap-northeast-1: a second VPCGatewayAttachment on the same VPC -> ROLLBACK_COMPLETE \"IGW|vpc-0f42b3c0bd4f0168d already exists in stack\" (CloudFormation rejects it before the EC2 call); a single attachment -> CREATE_COMPLETE. monthly 2026-09-29 ap-northeast-1 (502761806921): the same collision surfaced as \"Resource IGW|vpc-... created successfully, but it is managed by stack\" - which wording CloudFormation uses depends on timing, so the expect is the attachment identifier both share."
  expect: "IGW|vpc-"
addedOn: 2026-09-08
