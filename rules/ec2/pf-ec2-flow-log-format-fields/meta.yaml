id: pf-ec2-flow-log-format-fields
service: ec2
resourceTypes: [AWS::EC2::FlowLog]
severity: ERROR
title: Flow log LogFormat accepts only documented field names
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-flowlog.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: LogFormat \"${not-a-real-field}\" -> \"InvalidParameter: Unknown fields provided: 'not-a-real-field'\". A LogFormat naming all 40 fields in the rule's allow-list passed parameter validation, so the list is measured rather than transcribed. bench 2026-09-08 ap-northeast-1: LogFormat \"${srcaddr} ${not-a-real-field}\" -> ROLLBACK_COMPLETE \"Unknown fields provided: 'not-a-real-field'\"; a LogFormat of documented fields -> CREATE_COMPLETE."
addedOn: 2026-09-08
