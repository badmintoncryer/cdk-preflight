id: pf-ec2-flow-log-destination-config
service: ec2
resourceTypes: [AWS::EC2::FlowLog]
severity: ERROR
title: Flow log destination type requires its matching destination property
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-flowlog.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: LogDestinationType=s3 without LogDestination -> \"InvalidParameter: LogDestination can't be empty if LogGroupName is not provided.\"; cloud-watch-logs without DeliverLogsPermissionArn (explicit and defaulted) -> \"InvalidParameter: DeliverLogsPermissionArn can't be empty if LogDestinationType is cloud-watch-logs.\" bench 2026-09-08 ap-northeast-1: LogDestinationType s3 without LogDestination -> ROLLBACK_COMPLETE with the same message; with LogDestination -> CREATE_COMPLETE."
addedOn: 2026-09-08
