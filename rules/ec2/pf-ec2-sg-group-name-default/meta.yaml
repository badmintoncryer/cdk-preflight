id: pf-ec2-sg-group-name-default
service: ec2
resourceTypes: [AWS::EC2::SecurityGroup]
severity: ERROR
title: A security group cannot be named default
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-securitygroup.html
upstream: none
repro:
  method: real-deploy
  evidence: "api 2026-09-08 ap-northeast-1: CreateSecurityGroup --group-name default -> \"Cannot use reserved security group name: default\". The survey first recorded this as engine-detected, but that E1151 came from a malformed fixture VPC id; with a well-formed id the engine is silent. bench 2026-09-08 ap-northeast-1: GroupName default -> ROLLBACK_COMPLETE with the same message; another name -> CREATE_COMPLETE."
addedOn: 2026-09-08
