id: pf-ec2-client-vpn-authorization-rule-exclusive
service: ec2
resourceTypes: [AWS::EC2::ClientVpnAuthorizationRule]
severity: ERROR
title: Client VPN authorization rule cannot set both AccessGroupId and AuthorizeAllGroups
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-clientvpnauthorizationrule.html
upstream: none
repro:
  method: real-deploy
  evidence: 'bench 2026-09-06 ap-northeast-1: fail template -> ROLLBACK_COMPLETE, "You can specify either access-group-id or authorize-all-groups, not both"; pass template -> CREATE_COMPLETE. Both stacks were deployed with the placeholder ACM ARNs replaced by a real bench certificate, because the committed fixture must not carry an account-specific ARN.'
addedOn: 2026-09-06
