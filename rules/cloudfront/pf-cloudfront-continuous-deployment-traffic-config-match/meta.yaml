id: pf-cloudfront-continuous-deployment-traffic-config-match
service: cloudfront
resourceTypes: [AWS::CloudFront::ContinuousDeploymentPolicy]
severity: ERROR
title: 'TrafficConfig Type must match the config block that is present'
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudfront-continuousdeploymentpolicy.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-11-26 us-east-1: fail (Type SingleWeight carrying only SingleHeaderConfig, against a real staging distribution) -> ROLLBACK_COMPLETE with \"Invalid request provided: AWS::CloudFront::ContinuousDeploymentPolicy: The parameter Weight is null or empty.\" The earlier record (bench 2026-09-09) is not evidence: its fixture named a.cloudfront.net, and the request fell on \"The parameter StagingDistributionDnsNames is not a default CloudFront domain name\" before the traffic config was read; omission bench 2026-11-26 us-east-1: pass template without AWS::CloudFront::ContinuousDeploymentPolicy.ContinuousDeploymentPolicyConfig.TrafficConfig.SingleWeightConfig -> ROLLBACK_COMPLETE with \"Invalid request provided: AWS::CloudFront::ContinuousDeploymentPolicy: The parameter Weight is null or empty.\""
  expect: "AWS::CloudFront::ContinuousDeploymentPolicy: The parameter Weight is null or empty"
addedOn: 2026-09-08
benchRegion: us-east-1
omissionFails:
  - "AWS::CloudFront::ContinuousDeploymentPolicy.ContinuousDeploymentPolicyConfig.TrafficConfig.SingleWeightConfig"
