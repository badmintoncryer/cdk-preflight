severity: ERROR
title: 'SingleWeightConfig Weight must be between 0 and 0.15'
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudfront-continuousdeploymentpolicy.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-11-26 us-east-1, both fixtures now building their own staging distribution and passing its DomainName: fail (SingleWeight 0.5) -> ROLLBACK_COMPLETE with \"Invalid request provided: AWS::CloudFront::ContinuousDeploymentPolicy: The parameter Weight is higher than the maximum allowed value.\" The earlier record (bench 2026-09-09) is not evidence: the fixture named a.cloudfront.net, and the request fell on \"The parameter StagingDistributionDnsNames is not a default CloudFront domain name\" before the traffic config was read"
  expect: "AWS::CloudFront::ContinuousDeploymentPolicy: The parameter Weight is higher than the maximum allowed value"
