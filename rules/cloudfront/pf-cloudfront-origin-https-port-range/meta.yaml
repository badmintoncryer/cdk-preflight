id: pf-cloudfront-origin-https-port-range
service: cloudfront
resourceTypes: [AWS::CloudFront::Distribution]
severity: ERROR
title: 'HTTPSPort must be 80, 443 or in 1024-65535'
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-cloudfront-distribution-origin.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: HTTPSPort 1023 -> \"The parameter origin port is not within allowed range.\" ROLLBACK_COMPLETE (the same template carries a second origin at 65536); pass 1024 and 65535 -> CREATE_COMPLETE. api 2026-09-13 us-east-1 CreateDistribution: 1023 and 65536 are both rejected with that message. 80 and 443 stay valid below 1024."
addedOn: 2026-09-08
benchRegion: us-east-1
