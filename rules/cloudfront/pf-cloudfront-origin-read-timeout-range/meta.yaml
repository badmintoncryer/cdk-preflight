id: pf-cloudfront-origin-read-timeout-range
service: cloudfront
resourceTypes: [AWS::CloudFront::Distribution]
severity: ERROR
title: 'OriginReadTimeout must be at least 1'
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-cloudfront-distribution-origin.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: OriginReadTimeout 0 -> \"Your request of setting originReadTimeout is not within the valid range.\" ROLLBACK_COMPLETE; pass 1 -> CREATE_COMPLETE. api 2026-09-13 us-east-1 CreateDistribution: 0 is rejected and 1 is accepted. The rule does not check an upper end: 120 is the adjustable quota L-AECE9FA7 (\"Response timeout per origin\"), and this account rejects 121 and 181 only because it sits at the default, so an account that raised it would get a false positive (principle 6)."
addedOn: 2026-09-08
benchRegion: us-east-1
