id: pf-cloudfront-continuous-deployment-header-prefix
service: cloudfront
resourceTypes: [AWS::CloudFront::ContinuousDeploymentPolicy]
severity: ERROR
title: 'SingleHeaderConfig Header must start with aws-cf-cd-'
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudfront-continuousdeploymentpolicy.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-11-26 us-east-1, both fixtures now building their own staging distribution and passing its DomainName: fail (SingleHeader with header x-my-header, which lacks the aws-cf-cd- prefix) -> ROLLBACK_COMPLETE with \"Invalid request provided: AWS::CloudFront::ContinuousDeploymentPolicy: The parameter Header contains x-my-header that is not allowed.\" The earlier record (bench 2026-09-09) is not evidence: the fixture named a.cloudfront.net, and the request fell on \"The parameter StagingDistributionDnsNames is not a default CloudFront domain name\" before the traffic config was read; pass -> CREATE_COMPLETE (bench 2026-11-26 us-east-1, same staging distribution)"
  expect: "AWS::CloudFront::ContinuousDeploymentPolicy: The parameter Header contains x-my-header that is not allowed"
addedOn: 2026-09-08
benchRegion: us-east-1
