id: pf-cloudfront-vpc-origin-port-range
service: cloudfront
resourceTypes: [AWS::CloudFront::VpcOrigin]
severity: ERROR
title: 'VPC origin ports must be 80, 443 or 1024-65535'
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudfront-vpcorigin.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: HTTPPort 1023 -> \"The parameter origin port is not within allowed range.\" ROLLBACK_COMPLETE (the chained second resource carries HTTPSPort 65536); pass HTTPPort 1024 / HTTPSPort 65535 on a real internal Application Load Balancer -> CREATE_COMPLETE. api 2026-09-13 us-east-1 CreateVpcOrigin: 0, 1, 79, 1023 and 65536 are rejected with that message while 80, 443, 1024 and 65535 pass the port check and go on to the Arn check - the allowed set is the same as a custom origin, so the rule was corrected from \"1-65535\" to \"80, 443 or 1024-65535\". The port is validated before the Arn is resolved, which is why the fail template can keep a placeholder load balancer ARN. The pass template carries its own VPC, two subnets, an internet gateway, an internal Application Load Balancer and a listener: CloudFront rejects a VPC origin whose VPC has no internet gateway (\"does not have an internet gateway in its VPC\"), so the gateway and its attachment are part of the fixture."
addedOn: 2026-09-08
benchRegion: us-east-1
