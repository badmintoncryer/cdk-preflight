id: pf-cloudfront-wafv2-webacl-scope
service: cloudfront
resourceTypes: [AWS::CloudFront::Distribution]
severity: ERROR
title: A WAFv2 web ACL attached to CloudFront must be globally scoped
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-wafv2-webacl.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-02 us-east-1: ROLLBACK_COMPLETE, \"Only global scoped ARNs are supported arn:aws:wafv2:ap-northeast-1:<account>:regional/webacl/app/...\" (Service: CloudFront, Status Code: 400). The check is on the ARN scope segment, not the region, so a REGIONAL web ACL created in us-east-1 fails the same way."
addedOn: 2026-09-02
