id: pf-cloudfront-continuous-deployment-session-ttl-order
service: cloudfront
resourceTypes: [AWS::CloudFront::ContinuousDeploymentPolicy]
severity: ERROR
title: 'SessionStickinessConfig IdleTTL cannot exceed MaximumTTL'
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudfront-continuousdeploymentpolicy.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: IdleTTL 601 with MaximumTTL 600 -> \"The parameter Maximum TTL must be larger than Inactive Session TTL.\" (ROLLBACK_COMPLETE); pass 600 / 600 -> CREATE_COMPLETE, so despite the wording equal is accepted and is the limit. Both fixtures now build their own staging distribution and pass its DomainName: with the literal \"a.cloudfront.net\" the create failed on \"The parameter StagingDistributionDnsNames is not a default CloudFront domain name\" long before the TTLs were read, which is the confound the earlier evidence had recorded."
addedOn: 2026-09-08
benchRegion: us-east-1
