id: pf-apigw-body-lambda-integration-post
service: apigateway
resourceTypes: [AWS::ApiGateway::RestApi]
severity: ERROR
title: "A Lambda x-amazon-apigateway-integration in a RestApi Body must use httpMethod POST"
constraintSource: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-swagger-extensions-integration.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-17 ap-northeast-1: a RestApi Body whose GET / x-amazon-apigateway-integration is aws_proxy to a Lambda function with httpMethod GET reached CREATE_COMPLETE; TestInvokeMethod answered 500 for 100 s with Endpoint response body before transformations: <AccessDeniedException> -> probe FAILED, ROLLBACK_COMPLETE; pass with httpMethod POST -> 200, CREATE_COMPLETE"
  expect: "Endpoint response body before transformations: <AccessDeniedException>"
addedOn: 2026-10-17
