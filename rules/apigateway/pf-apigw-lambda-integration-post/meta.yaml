id: pf-apigw-lambda-integration-post
service: apigateway
resourceTypes: [AWS::ApiGateway::Method]
severity: ERROR
title: "A Lambda integration's IntegrationHttpMethod must be POST"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-apigateway-method-integration.html#cfn-apigateway-method-integration-integrationhttpmethod
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-10-16 ap-northeast-1: an AWS_PROXY Lambda integration with IntegrationHttpMethod GET reached CREATE_COMPLETE; TestInvokeMethod kept returning HTTP 500 for 100 s with the execution log 'Endpoint response body before transformations: <AccessDeniedException>' then 'Execution failed due to configuration error' -> probe FAILED, ROLLBACK_COMPLETE; pass IntegrationHttpMethod POST -> HTTP 200, CREATE_COMPLETE"
  expect: "Endpoint response body before transformations: <AccessDeniedException>"
addedOn: 2026-10-16
