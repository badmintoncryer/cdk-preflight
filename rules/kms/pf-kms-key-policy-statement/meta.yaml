id: pf-kms-key-policy-statement
service: kms
resourceTypes: [AWS::KMS::Key, AWS::KMS::ReplicaKey]
severity: ERROR
title: "Every KeyPolicy statement needs Principal, Action and Resource, the Statement list must not be empty, and AWS principals must be *, an account id or an IAM/STS ARN"
constraintSource: https://docs.aws.amazon.com/kms/latest/APIReference/API_CreateKey.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Policy contains a statement with no principal.\"; pass template -> CREATE_COMPLETE; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::KMS::Key.KeyPolicy.Statement.*.Principal -> ROLLBACK_COMPLETE with \"Policy contains a statement with no principal.\"; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::KMS::Key.KeyPolicy.Statement.*.Action -> ROLLBACK_COMPLETE with \"Missing required field Action\"; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::KMS::Key.KeyPolicy.Statement.*.Resource -> ROLLBACK_COMPLETE with \"Missing required field Resource\""
  expect: "Policy contains a statement with no principal"
addedOn: 2026-09-05
omissionFails:
  - "AWS::KMS::Key.KeyPolicy.Statement.*.Principal"
  - "AWS::KMS::Key.KeyPolicy.Statement.*.Action"
  - "AWS::KMS::Key.KeyPolicy.Statement.*.Resource"
