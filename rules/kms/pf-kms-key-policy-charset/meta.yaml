id: pf-kms-key-policy-charset
service: kms
resourceTypes: [AWS::KMS::Key, AWS::KMS::ReplicaKey]
severity: ERROR
title: "A KeyPolicy may only contain tab, LF, CR and characters U+0020..U+00FF (no Japanese or other non-Latin-1 text, e.g. in a Sid)"
constraintSource: https://docs.aws.amazon.com/kms/latest/APIReference/API_CreateKey.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"1 validation error detected: Value '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Action\":\"kms:*\",\"Resource\":\"*\",\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"arn:aws:iam::214794239830:root\"},\"Sid\":\"root\"},{\"Action\":\"kms:Encrypt\",\"Resource\":\"*\",\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"*\"},\"Sid\":\"????\"}]}' at 'policy' failed to satisfy constraint: Member must satisfy regular expression pattern: [\\u0009\\u000A\\u000D\\u0020-\\u00FF]+\"; pass template -> CREATE_COMPLETE"
addedOn: 2026-09-05
