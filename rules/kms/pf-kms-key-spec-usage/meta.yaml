id: pf-kms-key-spec-usage
service: kms
resourceTypes: [AWS::KMS::Key]
severity: ERROR
title: "KeyUsage must match KeySpec (symmetric: ENCRYPT_DECRYPT, HMAC: GENERATE_VERIFY_MAC, RSA: ENCRYPT_DECRYPT|SIGN_VERIFY, NIST ECC: SIGN_VERIFY|KEY_AGREEMENT, ed25519/secp256k1/ML-DSA: SIGN_VERIFY) and is required for every non-symmetric key"
constraintSource: https://docs.aws.amazon.com/kms/latest/APIReference/API_CreateKey.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"KeyUsage ENCRYPT_DECRYPT is not compatible with KeySpec HMAC_256\"; pass template -> CREATE_COMPLETE; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::KMS::Key.KeySpec -> ROLLBACK_COMPLETE with \"KeyUsage GENERATE_VERIFY_MAC is not compatible with KeySpec SYMMETRIC_DEFAULT\"; omission bench 2026-11-26 ap-northeast-1: pass template without AWS::KMS::Key.KeyUsage -> ROLLBACK_COMPLETE with \"KeyUsage ENCRYPT_DECRYPT is not compatible with KeySpec HMAC_256\""
  expect: "KeyUsage ENCRYPT_DECRYPT is not compatible with KeySpec HMAC_256"
addedOn: 2026-09-05
omissionFails:
  - "AWS::KMS::Key.KeySpec"
  - "AWS::KMS::Key.KeyUsage"
