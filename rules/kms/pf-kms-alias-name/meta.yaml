id: pf-kms-alias-name
service: kms
resourceTypes: [AWS::KMS::Alias]
severity: ERROR
title: "AliasName must not start with alias/aws/ (reserved for AWS managed keys) and may not contain a colon (the CloudFormation schema allows it, CreateAlias does not)"
constraintSource: https://docs.aws.amazon.com/kms/latest/APIReference/API_CreateAlias.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-05 ap-northeast-1: fail template -> ROLLBACK_COMPLETE with \"Error occurred during operation 'CreateAlias'.\" (the CloudFormation handler masks the service error; the same input sent straight to the API is rejected with \"The alias name for a customer managed CMK cannot begin with alias/aws/.\"); pass template -> CREATE_COMPLETE"
addedOn: 2026-09-05
