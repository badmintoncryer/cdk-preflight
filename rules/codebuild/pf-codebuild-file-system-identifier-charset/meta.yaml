id: pf-codebuild-file-system-identifier-charset
service: codebuild
resourceTypes: [AWS::CodeBuild::Project]
benchRegion: us-east-1
severity: ERROR
title: A project that mounts a file system runs in privileged mode
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-codebuild-project-projectfilesystemlocation.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail template (FileSystemLocations with a well-formed EFS location and no Environment.PrivilegedMode) -> \"Privileged Mode has to be set for projects with File System Locations\" (ROLLBACK_COMPLETE); pass template (PrivilegedMode true and no FileSystemLocations) -> CREATE_COMPLETE. The pass cannot carry a FileSystemLocations of its own: CreateProject answers a well-formed location with \"VPC has to be configured for projects with File System Locations\" next, and the VpcConfig it then wants needs EC2 permissions the bench service role does not hold. The documented Identifier charset limit is a separate, still unmeasured hypothesis; this id keeps the survey's name."
addedOn: 2026-09-14
