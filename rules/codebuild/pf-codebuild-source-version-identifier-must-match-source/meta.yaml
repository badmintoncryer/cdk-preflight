id: pf-codebuild-source-version-identifier-must-match-source
service: codebuild
resourceTypes: [AWS::CodeBuild::Project]
benchRegion: us-east-1
severity: ERROR
title: Every SecondarySourceVersions entry names a declared secondary source
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-codebuild-project-projectsourceversion.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail template (a SecondarySourceVersions entry naming SourceIdentifier \"s9\" on a project with no SecondarySources) -> \"Invalid input: secondary source identifier does not exist\" (ROLLBACK_COMPLETE); pass template (SecondarySources declaring \"s0\" and the version entry naming \"s0\") -> CREATE_COMPLETE. Only secondary sources count: CreateProject answers an entry pointing at the primary Source.SourceIdentifier with the same message."
addedOn: 2026-09-14
