id: pf-codebuild-secondary-source-identifier-unique
service: codebuild
resourceTypes: [AWS::CodeBuild::Project]
benchRegion: us-east-1
severity: ERROR
title: Secondary source identifiers are unique within a project
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-codebuild-project-source.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail template (two SecondarySources entries sharing SourceIdentifier \"s0\", each with its own Location) -> \"Invalid input: sourceIdentifier cannot be duplicated\" (ROLLBACK_COMPLETE); pass template (the same two entries with \"s0\" and \"s1\") -> CREATE_COMPLETE. The Locations have to differ: two secondary sources pointing at the same place are rejected by a separate check, \"Invalid input: conflicting source locations\"."
addedOn: 2026-09-14
