resourceTypes: [AWS::CodeBuild::Project]
benchRegion: us-east-1
severity: ERROR
title: The CODEPIPELINE source and artifact types are set together
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-codebuild-project-source.html
