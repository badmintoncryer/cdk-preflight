id: pf-codebuild-vpc-security-groups-max-5
service: codebuild
resourceTypes: [AWS::CodeBuild::Project]
benchRegion: us-east-1
severity: ERROR
title: VpcConfig names at most 5 security groups
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-codebuild-project-vpcconfig.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: fail template (VpcConfig naming 6 security groups) -> \"Invalid vpc config: the maximum number of security groups is 5\" (ROLLBACK_COMPLETE); pass template (a VPC, 16 subnets, 5 security groups and a service role built in the same stack, all named by VpcConfig) -> CREATE_COMPLETE. The count is checked before the ids are resolved, so the fail template gets away with made-up ids."
addedOn: 2026-09-14
