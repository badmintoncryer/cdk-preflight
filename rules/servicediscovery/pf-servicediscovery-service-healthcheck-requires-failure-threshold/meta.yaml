id: pf-servicediscovery-service-healthcheck-requires-failure-threshold
service: servicediscovery
benchRegion: us-east-1
resourceTypes: [AWS::ServiceDiscovery::Service]
severity: ERROR
title: "A HealthCheckConfig without FailureThreshold breaks the service handler"
constraintSource: https://docs.aws.amazon.com/cloud-map/latest/api/API_HealthCheckConfig.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-23 us-east-1: HealthCheckConfig without FailureThreshold -> \"Cannot invoke\" (ROLLBACK_COMPLETE); pass FailureThreshold 1 -> CREATE_COMPLETE; omission bench 2026-11-26 us-east-1: pass template without AWS::ServiceDiscovery::Service.HealthCheckConfig.FailureThreshold -> ROLLBACK_COMPLETE with \"Cannot invoke \"java.lang.Double.intValue()\" because the return value of \"software.amazon.servicediscovery.service.HealthCheckConfig.getFailureThreshold()\" is...\""
addedOn: 2026-09-23
omissionFails:
  - "AWS::ServiceDiscovery::Service.HealthCheckConfig.FailureThreshold"
