id: pf-servicediscovery-private-namespace-name-length
service: servicediscovery
benchRegion: us-east-1
resourceTypes: [AWS::ServiceDiscovery::PrivateDnsNamespace]
severity: ERROR
title: "A private DNS namespace name is limited to 253 characters"
constraintSource: https://docs.aws.amazon.com/cloud-map/latest/api/API_CreatePrivateDnsNamespace.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-22 us-east-1: Name of 254 characters -> \"Resource handler returned message: '2 validation errors detected: Value 'pnlfaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.local' at 'name' failed to satisfy constraint: Member must have length less than or equal to 253; Value 'pnlfaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.local' at 'name' failed to satisfy constraint: Member must satisfy regular expression pattern: ^(?!arn:)[!-~]{1,253}$ (Service: ServiceDiscovery, Status Code: 400, Request ID: f3fe3983-4bd9-4fe4-824f-98241dd716f2) (SDK Attempt Count: 1)' (RequestToken: 52d5da58-f837-68ea-5f8f-a8890ff2ac3d, HandlerErrorCode: InvalidRequest)\" (ROLLBACK_COMPLETE); Name of 253 -> CREATE_COMPLETE"
addedOn: 2026-09-22
