resourceTypes: [AWS::ServiceDiscovery::Instance]
severity: ERROR
title: "An instance of a health-checked service needs AWS_INSTANCE_PORT"
constraintSource: https://docs.aws.amazon.com/cloud-map/latest/api/API_HealthCheckConfig.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-23 us-east-1: health-checked service, AWS_INSTANCE_IPV4=1.1.1.1 without AWS_INSTANCE_PORT -> \"A port must be supplied in order to register this instance.\" (ROLLBACK_COMPLETE); pass not deployed on purpose: registering an instance on a HealthCheckConfig service creates a Route 53 health check that Cloud Map can orphan (--fail-only)"
