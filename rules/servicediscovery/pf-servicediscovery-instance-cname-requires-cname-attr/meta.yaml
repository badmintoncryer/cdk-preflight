id: pf-servicediscovery-instance-cname-requires-cname-attr
service: servicediscovery
benchRegion: us-east-1
resourceTypes: [AWS::ServiceDiscovery::Instance]
severity: ERROR
title: "A CNAME record service needs AWS_INSTANCE_CNAME on every instance"
constraintSource: https://docs.aws.amazon.com/cloud-map/latest/api/API_RegisterInstance.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-23 us-east-1: CNAME-record service, instance without AWS_INSTANCE_CNAME -> \"Required attribute(s) AWS_INSTANCE_CNAME are missing.\" (ROLLBACK_COMPLETE); pass with AWS_INSTANCE_CNAME -> CREATE_COMPLETE; omission bench 2026-11-26 us-east-1: pass template without AWS::ServiceDiscovery::Instance.InstanceAttributes.AWS_INSTANCE_CNAME -> ROLLBACK_COMPLETE with \"RegisterInstanceRequest::Attributes cannot be empty\""
  expect: "Required attribute(s) AWS_INSTANCE_CNAME are missing"
addedOn: 2026-09-23
omissionFails:
  - "AWS::ServiceDiscovery::Instance.InstanceAttributes.AWS_INSTANCE_CNAME"
