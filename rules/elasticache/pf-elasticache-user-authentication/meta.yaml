id: pf-elasticache-user-authentication
service: elasticache
resourceTypes: [AWS::ElastiCache::User]
severity: ERROR
title: "A user needs exactly one authentication mode, and passwords are 16-128 characters with at most two per user"
constraintSource: https://docs.aws.amazon.com/AmazonElastiCache/latest/APIReference/API_CreateUser.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a 129 character password -> \"Passwords length must be between 16-128 characters.\" ROLLBACK_COMPLETE (the chained users carry a 15 character password, three passwords, and NoPasswordRequired together with a password); pass one user with a 128 and a 16 character password -> CREATE_COMPLETE."
addedOn: 2026-09-06
