id: pf-elasticache-replication-group-clusters
service: elasticache
resourceTypes: [AWS::ElastiCache::ReplicationGroup]
severity: ERROR
title: "Automatic failover needs at least two cache clusters (CloudFormation turns it on by default), and NumCacheClusters cannot be combined with NumNodeGroups"
constraintSource: https://docs.aws.amazon.com/AmazonElastiCache/latest/APIReference/API_CreateReplicationGroup.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: AutomaticFailoverEnabled with NumCacheClusters 1 -> \"Automatic failover requires 2 or more cache clusters. Create more cache clusters or disable automatic failover.\" ROLLBACK_COMPLETE; pass AutomaticFailoverEnabled with NumCacheClusters 2 -> CREATE_COMPLETE. The old pass had failover disabled, which the rule cannot fire on whatever the cluster count is."
addedOn: 2026-09-06
