id: pf-elasticache-identifier
service: elasticache
resourceTypes: [AWS::ElastiCache::ReplicationGroup, AWS::ElastiCache::CacheCluster]
severity: ERROR
title: "A replication group or cluster name starts with a letter and holds no consecutive or trailing hyphens"
constraintSource: https://docs.aws.amazon.com/AmazonElastiCache/latest/APIReference/API_CreateReplicationGroup.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-06 ap-northeast-1: fail template -> ROLLBACK_FAILED with \"Replication Group ID specified is not a valid identifier. Identifiers must begin with a letter; must contain only ASCII letters, digits, and hyphens; and must not end with a hyphen or contain two consecutive hyphens.\"; pass template -> CREATE_COMPLETE"
addedOn: 2026-09-06
