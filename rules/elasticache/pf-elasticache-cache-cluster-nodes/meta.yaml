id: pf-elasticache-cache-cluster-nodes
service: elasticache
resourceTypes: [AWS::ElastiCache::CacheCluster]
severity: ERROR
title: "A Redis cluster holds one node and cross-az needs at least two"
constraintSource: https://docs.aws.amazon.com/AmazonElastiCache/latest/APIReference/API_CreateCacheCluster.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 ap-northeast-1: one memcached cluster with AZMode cross-az and NumCacheNodes 1 -> \"Must specify at least two cache nodes in order to specify AZ Mode of 'cross-az'.\" (ROLLBACK_COMPLETE); pass with a Redis cluster at 1 node and a cross-az memcached cluster at 2 -> CREATE_COMPLETE. The Redis end is chained behind the cross-az one with DependsOn, so it is never created in the fail run: its message \"NumCacheNodes should be 1 if engine is redis\" comes from the 2026-09-06 ap-northeast-1 run, which is also what the rego quotes — until 2026-09-14 it quoted the API reference's wording instead, which no deploy has ever returned."
addedOn: 2026-09-06
