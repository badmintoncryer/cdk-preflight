id: pf-cognito-idp-oidc-required-keys
service: cognito
resourceTypes: [AWS::Cognito::UserPoolIdentityProvider]
severity: ERROR
title: "An OIDC provider needs four ProviderDetails keys"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-cognito-userpoolidentityprovider.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-08 us-east-1: fail template -> ROLLBACK_COMPLETE with \"clientId, authorizeScopes, oidcIssuer and attributesRequestMethod are all required idp details.\"; pass template -> CREATE_COMPLETE; omission bench 2026-11-26 us-east-1: pass template without AWS::Cognito::UserPoolIdentityProvider.ProviderDetails.client_id -> ROLLBACK_COMPLETE with \"clientId, authorizeScopes, oidcIssuer and attributesRequestMethod are all required idp details.\"; omission bench 2026-11-26 us-east-1: pass template without AWS::Cognito::UserPoolIdentityProvider.ProviderDetails.authorize_scopes -> ROLLBACK_COMPLETE with \"clientId, authorizeScopes, oidcIssuer and attributesRequestMethod are all required idp details.\"; omission bench 2026-11-26 us-east-1: pass template without AWS::Cognito::UserPoolIdentityProvider.ProviderDetails.oidc_issuer -> ROLLBACK_COMPLETE with \"clientId, authorizeScopes, oidcIssuer and attributesRequestMethod are all required idp details.\"; omission bench 2026-11-26 us-east-1: pass template without AWS::Cognito::UserPoolIdentityProvider.ProviderDetails.attributes_request_method -> ROLLBACK_COMPLETE with \"clientId, authorizeScopes, oidcIssuer and attributesRequestMethod are all required idp details.\""
  expect: "clientId, authorizeScopes, oidcIssuer and attributesRequestMethod are all required idp details"
addedOn: 2026-09-08
omissionFails:
  - "AWS::Cognito::UserPoolIdentityProvider.ProviderDetails.client_id"
  - "AWS::Cognito::UserPoolIdentityProvider.ProviderDetails.authorize_scopes"
  - "AWS::Cognito::UserPoolIdentityProvider.ProviderDetails.oidc_issuer"
  - "AWS::Cognito::UserPoolIdentityProvider.ProviderDetails.attributes_request_method"
