id: pf-cognito-token-validity-range
service: cognito
resourceTypes: [AWS::Cognito::UserPoolClient]
severity: ERROR
title: Token validity ranges depend on token type and unit
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-cognito-userpoolclient.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: AccessTokenValidity 299 seconds with RefreshTokenValidity 3599 seconds -> \"Invalid range for token validity.\" (ROLLBACK_COMPLETE; the message names neither the value nor which token); pass 300 and 3600 seconds -> CREATE_COMPLETE, alongside a second client at the upper limits, 86400 and 315360000 seconds. The upper ends cannot go in the fail fixture: the bundled engine's schema caps AccessTokenValidity at 86400 and RefreshTokenValidity at 315360000, so 86401 is stopped at F3034/FATAL before the rule is reached (AGENTS.md principle 1). Expressing it in minutes gets past the schema but the smallest violation is then 1441 minutes = 86460 seconds, which is not the boundary."
addedOn: 2026-09-03
