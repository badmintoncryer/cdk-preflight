id: pf-cognito-recovery-duplicate
service: cognito
resourceTypes: [AWS::Cognito::UserPool]
severity: ERROR
title: Recovery mechanisms cannot repeat priorities or names
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-cognito-userpool-recoveryoption.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-03 ap-northeast-1: two RecoveryMechanisms both Priority 1 (c12) -> \"Invalid account recovery setting parameter. Account Recovery Setting cannot have duplicate priorities or recovery mechanisms.\" ROLLBACK_COMPLETE (the error names duplicate mechanisms too)."
addedOn: 2026-09-03
