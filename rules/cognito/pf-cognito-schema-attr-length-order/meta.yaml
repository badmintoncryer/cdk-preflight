id: pf-cognito-schema-attr-length-order
service: cognito
resourceTypes: [AWS::Cognito::UserPool]
severity: ERROR
title: Schema attribute MaxLength cannot undercut MinLength
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-cognito-userpool-schemaattribute.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-14 us-east-1: MinLength 6 with MaxLength 5 -> \"Attribute custom:level cannot have a max length shorter than it's min length\" (ROLLBACK_COMPLETE); pass MinLength 1 with MaxLength 1 -> CREATE_COMPLETE."
addedOn: 2026-09-03
