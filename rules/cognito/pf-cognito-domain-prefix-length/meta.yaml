id: pf-cognito-domain-prefix-length
service: cognito
resourceTypes: [AWS::Cognito::UserPoolDomain]
severity: ERROR
title: "A hosted UI domain prefix is capped at 63 characters"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-cognito-userpooldomain.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a 64-character domain prefix -> CREATE_FAILED, but the CloudFormation handler for AWS::Cognito::UserPoolDomain only says \"Invalid request provided: AWS::Cognito::UserPoolDomain\"; the same prefix put straight to CreateUserPoolDomain names the constraint: \"Value 'abbb...' at 'domain' failed to satisfy constraint: Member must have length less than or equal to 63\" (ROLLBACK_COMPLETE); pass 63 characters -> CREATE_COMPLETE"
addedOn: 2026-09-08
