id: pf-cognito-password-min-length
service: cognito
resourceTypes: [AWS::Cognito::UserPool]
severity: ERROR
title: PasswordPolicy MinimumLength runs 6 to 99
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-cognito-userpool-passwordpolicy.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 ap-northeast-1: two pools, MinimumLength 5 and MinimumLength 100 -> \"Value '5' at 'policies.passwordPolicy.minimumLength' failed to satisfy constraint: Member must have value greater than or equal to 6\" (ROLLBACK_COMPLETE; the low end is reported first, so the 100 pool is cancelled before it is validated); pass MinimumLength 6 and 99 -> CREATE_COMPLETE"
addedOn: 2026-09-03
