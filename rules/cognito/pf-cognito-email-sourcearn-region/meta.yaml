id: pf-cognito-email-sourcearn-region
service: cognito
resourceTypes: [AWS::Cognito::UserPool]
severity: ERROR
title: "The SES SourceArn must be in a Cognito-supported SES region"
constraintSource: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-cognito-userpool.html
upstream: none
benchRegion: us-east-1
repro:
  method: real-deploy
  evidence: "bench 2026-11-25 (probe stacks, issue #395; identities unverified, so a stack that passes the Region check fails later with \"Email address is not verified\"): ap-northeast-1 pool with an ap-northeast-1 or us-east-1 identity passes the Region check, with ap-southeast-2 -> \"must be in one of the following SES regions: eu-west-1, ap-northeast-1, us-east-1, us-west-2\"; ap-southeast-2 pool lists eu-west-1, ap-southeast-2, us-east-1, us-west-2; us-west-1, ap-northeast-3, eu-west-3, eu-north-1 and sa-east-1 pools with a us-east-1 identity -> \"must be in the <pool Region> SES region\"; a us-west-1 identity in a us-west-1 pool passes; arn:aws:ses:*:... in us-east-1 and ap-northeast-1 (DEVELOPER and COGNITO_DEFAULT) -> Region error. bench 2026-09-08 us-east-1: fail template -> ROLLBACK_COMPLETE with \"Invalid EmailConfiguration.SourceArn. Provided SourceArn must be in one of the following SES regions: eu-west-1, us-east-1, us-west-2.\"; pass template -> CREATE_COMPLETE"
  expect: "Invalid EmailConfiguration.SourceArn. Provided SourceArn must be in one of the following SES regions"
addedOn: 2026-09-08
