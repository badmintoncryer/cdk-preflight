id: pf-ecr-lifecycle-tag-status
service: ecr
resourceTypes: [AWS::ECR::Repository, AWS::ECR::RepositoryCreationTemplate]
severity: ERROR
title: "tagStatus=tagged needs exactly one of tagPrefixList / tagPatternList, tagStatus=untagged or any takes neither"
constraintSource: https://docs.aws.amazon.com/AmazonECR/latest/userguide/lifecycle_policy_parameters.html
upstream: none
repro:
  method: real-deploy
  evidence: "bench 2026-09-13 us-east-1: a tagged rule with no tagPatternList -> \"Must specify tagPrefixList or tagPatternList when tagStatus=TAGGED.\" ROLLBACK_COMPLETE (the same policy carries a second rule whose tag pattern has five wildcards); pass a four-wildcard pattern -> CREATE_COMPLETE. api 2026-09-13 us-east-1 PutLifecyclePolicy: a pattern with five * is rejected with \"Invalid tag pattern provided. Total number of * must not exceed 4\" and four is accepted."
addedOn: 2026-09-06
